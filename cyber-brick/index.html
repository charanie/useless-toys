<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>赛博砖头 · CYBER BRICK</title>
<style>
  :root{
    --ink:#e9e6df;
    --dim:#8b8880;
    --brick:#d3654a;
    --neon:#ff6a45;
    --cyan:#5fd8ff;
    --glass:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:#0b0b0f;
    background-image:radial-gradient(1100px 780px at 50% 26%, #1b1b24 0%, #0b0b0f 72%);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 35%, transparent 82%);
            mask-image:radial-gradient(circle at 50% 38%, #000 35%, transparent 82%);
  }
  #c{position:fixed;inset:0;display:block;z-index:2;touch-action:none;cursor:grab}
  #c.grabbing{cursor:grabbing}

  #overlay{position:fixed;inset:0;z-index:3;pointer-events:none}
  button{pointer-events:auto}

  header{position:absolute;top:22px;left:26px;line-height:1.15}
  header h1{
    margin:0;font-size:26px;letter-spacing:.16em;font-weight:800;
    background:linear-gradient(92deg,#ff8a5c,#ffd36e 40%,#5fd8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{margin-top:5px;font-size:12px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  header .sub b{color:var(--brick)}

  #hud{
    position:absolute;top:22px;right:26px;text-align:right;
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:12px;line-height:1.9;color:var(--dim);letter-spacing:.06em;
    background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
    padding:12px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #hud b{color:var(--ink);font-weight:700}
  #hud .lv{color:var(--neon)}

  footer{
    position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    padding:0 12px;
  }
  button{
    font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
    background:var(--glass);border:1px solid var(--stroke);border-radius:999px;
    padding:9px 16px;letter-spacing:.06em;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
  button:active{transform:translateY(1px) scale(.98)}
  button kbd{
    font:inherit;font-size:10px;color:var(--dim);border:1px solid var(--stroke);
    border-radius:5px;padding:1px 5px;margin-left:6px;background:rgba(0,0,0,.25);
  }

  #hint{
    position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
    font-size:12px;color:var(--dim);letter-spacing:.14em;white-space:nowrap;
    transition:opacity .6s ease;
  }
  #hint.hide{opacity:0}

  /* 砖头的吐槽气泡 */
  .bubble{
    position:absolute;left:0;top:0;max-width:min(360px,72vw);
    transform:translate(-50%,-100%);
    padding:10px 14px;border-radius:14px;
    background:rgba(20,20,26,.92);border:1px solid rgba(255,255,255,.16);
    color:#f3f0ea;font-size:14px;line-height:1.5;letter-spacing:.02em;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .22s ease;white-space:pre-wrap;
  }
  .bubble.show{opacity:1}
  .bubble::after{
    content:'';position:absolute;left:50%;bottom:-7px;width:12px;height:12px;
    background:inherit;border-right:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);
    transform:translateX(-50%) rotate(45deg);
  }

  /* 弹幕 */
  #danmaku{position:absolute;inset:0;overflow:hidden}
  .dm{
    position:absolute;white-space:nowrap;font-size:14px;color:rgba(255,255,255,.34);
    letter-spacing:.08em;will-change:transform;text-shadow:0 0 12px rgba(0,0,0,.6);
  }
  .dm .u{color:rgba(255,138,92,.55);margin-right:6px;font-size:12px}

  /* 成就 toast */
  #toast{
    position:absolute;left:50%;top:88px;transform:translate(-50%,-14px);
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .ach{
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(100deg,rgba(255,106,69,.18),rgba(95,216,255,.14));
    border:1px solid rgba(255,255,255,.2);border-radius:12px;
    padding:9px 15px;font-size:13px;letter-spacing:.05em;
    box-shadow:0 10px 34px rgba(0,0,0,.5);
    animation:achIn .32s cubic-bezier(.2,1.3,.4,1) both, achOut .5s ease 3.4s both;
  }
  .ach .ic{font-size:16px}
  .ach b{color:#ffd36e}
  .ach small{color:var(--dim);font-size:11px}
  @keyframes achIn{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes achOut{to{opacity:0;transform:translateY(-10px)}}

  /* 顿悟闪光 */
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,224,150,.5),transparent 60%);opacity:0;pointer-events:none}
  #flash.go{animation:flash .8s ease}
  @keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

  @media (max-width:560px){
    header h1{font-size:20px}
    #hud{font-size:11px;padding:9px 12px}
    #hint{font-size:11px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="overlay">
  <header>
    <h1>赛博砖头</h1>
    <div class="sub">CYBER BRICK · <b>一块毫无用途的砖</b></div>
  </header>

  <div id="hud">
    <div>道行 <b class="lv" id="uLevel">Lv.1 砖胚</b></div>
    <div>搬砖 <b id="uDrags">0</b> 次</div>
    <div>累计 <b id="uDist">0</b> 米</div>
    <div>现存 <b id="uCount">1</b> 块</div>
  </div>

  <div id="danmaku"></div>
  <div id="toast"></div>
  <div id="flash"></div>

  <div id="hint">拖动砖头 · 甩出去 · 点一下让它开口</div>

  <footer>
    <button data-act="line">让它开口<kbd>空格</kbd></button>
    <button data-act="add">再来一块</button>
    <button data-act="reset">重置</button>
    <button data-act="mute" id="uMute">🔊</button>
  </footer>
</div>

<script>
"use strict";
/* =========================================================
   赛博砖头 · CYBER BRICK
   一块毫无用途的砖。零依赖，单文件。
   ========================================================= */

/* ---------- 抽象台词库（本玩具的灵魂） ---------- */
const LINES = {
  打工: [
    "你搬砖的样子，很像在搬砖。",
    "砖是搬不完的，但工资是发得完的。",
    "我们都在搬砖，只是有的砖会飞。",
    "今天也要元气满满地……算了。",
    "别问我在哪，我在承重。",
    "摸鱼一分钟，砖少一块；摸鱼一小时，砖还是少一块。",
    "老板说的团队精神，就是大家一起搬砖。",
    "我是一块砖，哪里需要哪里搬。问题是没人需要我。",
    "加班，是在为明天的自己搬砖。明天的自己，也在加班。",
    "你的 KPI 是虚拟的，我的质量是真实的。",
    "到手一块砖，心里一块砖。",
    "把砖放下，你就自由了。但你会把它捡起来。"
  ],
  存在: [
    "我是一块砖，我拒绝被定义。",
    "存在先于本质，砖先于墙。",
    "我可以砌成墙，也可以躺在路边。这叫自由。",
    "别拿我跟别的砖比，每块砖都有自己的弧度。",
    "意义是我们自己砌出来的。",
    "我思，故我在搬砖。",
    "宇宙是一块砖，你也是。",
    "你不必成为墙的一部分。",
    "万物的尽头不是虚无，是砖。",
    "我躺平，是因为重力也在躺平。"
  ],
  抽象: [
    "你再点我，我就盖成承重墙。",
    "啊？你还没下班？",
    "这下抽象了。",
    "你说得对，但是《砖》是由……后面忘了。",
    "6",
    "已阅，砖。",
    "你礼貌吗？拿砖砸我。",
    "别戳了，我很忙的（其实不忙）。",
    "这很难评，祝你成功。",
    "典。",
    "你可以轻一点，我也有感受的。",
    "再戳我，我们就只能做陌生人了。"
  ],
  物理: [
    "我的动量守恒，你的热情不守恒。",
    "摩擦力，是唯一还站在我这边的力。",
    "重力从未失约。",
    "我落地不是失败，是回归大地。",
    "让我安静地下坠一会儿。",
    "加速度是一种态度。",
    "我被扔出去的那一刻，终于理解了抛物线。"
  ],
  鸡汤: [
    "不要问砖为你做了什么，要问你为砖做了什么。",
    "生活递给你一块砖，你可以砌墙，也可以……（不建议）。",
    "每一块砖，都曾是泥土的梦想。",
    "慢慢来，砖会有的，墙也会有的。",
    "你现在的每一次搬砖，都在为将来的墙做准备。",
    "砖不会背叛你，它只会砸到你。",
    "今天你嫌弃的砖，是明天你收租的楼。"
  ],
  起飞: [
    "再见。",
    "我起飞了，勿念。",
    "芜湖——",
    "这就是自由的味道吗。",
    "重力，一位老朋友。",
    "我说过，我是会飞的砖。",
    "别追了，追不上的。"
  ],
  撞击: [
    "疼。",
    "谁？",
    "又来？",
    "别推我。",
    "我警告你。",
    "这块墙跟我有仇。",
    "再来一次我就碎了（不会）。"
  ],
  发呆: [
    "你是不是忘了还有别的事要做？",
    "我可以陪你，但我只是一块砖。",
    "……",
    "（砖在看着你）",
    "你盯着我看，已经很久了。",
    "摸鱼可以，别把我当借口。",
    "时间在流逝，砖在原地。"
  ]
};
const KEYS = Object.keys(LINES);
const pick = arr => arr[(Math.random()*arr.length)|0];

/* ---------- 道行 / 进化 ---------- */
const TITLES = ["砖胚","砖块","承重砖","金砖","抽象之砖","砖神","砖宇宙"];
const THRESH = [0, 40, 150, 400, 1000, 2500, 6000]; // 单位：米
const SKIN_OF_LEVEL = lv => lv<=2?0 : lv===3?1 : lv===4?2 : 3;
const SKINS = [
  {name:"红砖", body:["#e0755a","#c14e33","#7c2a1a"], hole:"#8f3520", line:"#ffb59a"},
  {name:"青砖", body:["#93a4b3","#5f7180","#374a55"], hole:"#465666", line:"#c6d6e3"},
  {name:"金砖", body:["#ffe89a","#e5ad33","#9a6f10"], hole:"#c99524", line:"#fff3c4"},
  {name:"抽象砖", body:["#ff7ad9","#ffd93d","#4fd1ff"], hole:"#ff4fd8", line:"#ffffff", rainbow:true}
];

/* ---------- 屏幕 ---------- */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const overlay = document.getElementById('overlay');
const danmakuEl = document.getElementById('danmaku');
const toastEl = document.getElementById('toast');
const flashEl = document.getElementById('flash');
const hintEl = document.getElementById('hint');

let W = 0, H = 0, DPR = 1;
const world = { floorY: 0, G: 2200, rest: 0.44, air: 0.35 };

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  world.floorY = H - 60;
}
window.addEventListener('resize', resize);

/* ---------- 音效（程序化，零素材） ---------- */
const A = {
  ctx:null, muted:false, noise:null,
  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    this.ctx = new C();
    const len = Math.floor(this.ctx.sampleRate*0.4);
    const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = b;
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  clack(v){
    v = Math.max(0.15, Math.min(1.6, v));
    if(this.muted || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    // 撞击噪声
    const s = c.createBufferSource(); s.buffer = this.noise;
    s.playbackRate.value = 0.8 + Math.random()*0.5;
    const bp = c.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 780 + Math.random()*700; bp.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.min(0.5, 0.16*v), t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.085);
    s.connect(bp).connect(g).connect(c.destination);
    s.start(t); s.stop(t+0.12);
    // 砖的"腔体"音
    const o = c.createOscillator(); o.type='triangle';
    const f = 165 + Math.random()*70 - v*22;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f*0.62, t+0.09);
    const g2 = c.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(Math.min(0.4, 0.13*v), t+0.005);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
    o.connect(g2).connect(c.destination);
    o.start(t); o.stop(t+0.17);
  },
  knock(){ this.clack(0.35); },
  levelUp(){
    if(this.muted || !this.ctx) return;
    const c = this.ctx; let t = c.currentTime;
    [392,523.25,659.25,880].forEach((f,i)=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=c.createGain();
      const st=t+i*0.07;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.22, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.5);
      o.connect(g).connect(c.destination); o.start(st); o.stop(st+0.55);
    });
  }
};

/* ---------- 粒子 ---------- */
const parts = [];
function dust(x, y, n, power, color){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = (20+Math.random()*120)*power;
    parts.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 30,
      life:0.5+Math.random()*0.5, t:0,
      size:1.5+Math.random()*3.5, color:color||"rgba(210,180,150,"
    });
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.t += dt;
    if(p.t >= p.life){ parts.splice(i,1); continue; }
    p.vy += 700*dt; p.vx *= 0.98; p.vy *= 0.98;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const k = 1 - p.t/p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color + (0.75*k).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*k, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 砖 ---------- */
const BW = 92, BH = 54, HW = BW/2, HH = BH/2, RAD = Math.hypot(HW,HH)*0.82;
let uid = 0;

class Brick {
  constructor(x, y){
    this.id = ++uid;
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*120; this.vy = 0;
    this.a = (Math.random()-0.5)*0.3; this.av = 0;
    this.dragging = false; this.gox = 0; this.goy = 0;
    this.text = ""; this.textT = -1e9;
    this.squash = 0; this.blink = 0; this.nextBlink = 1+Math.random()*3;
    this.onGround = false;
    this.bubble = document.createElement('div');
    this.bubble.className = 'bubble';
    overlay.appendChild(this.bubble);
  }
  extents(){
    const c = Math.abs(Math.cos(this.a)), s = Math.abs(Math.sin(this.a));
    return { hw: c*HW + s*HH, hh: s*HW + c*HH };
  }
  say(text, kind){
    this.text = text; this.textT = performance.now();
    this.squash = 1;
    if(kind !== 'silent') A.knock();
    lastInteract = performance.now();
  }
  update(dt, targetX, targetY){
    if(this.dragging){
      const k = 260, d = 24;               // 弹簧跟随
      this.vx += ((targetX - this.x)*k - this.vx*d)*dt;
      this.vy += ((targetY - this.y)*k - this.vy*d)*dt;
      this.av += (0 - this.a*6 - this.av*2)*dt; // 拖动时缓慢扶正
    }else{
      this.vy += world.G*dt;
      this.av *= (1 - 1.1*dt);
    }
    this.vx *= (1 - world.air*dt);
    this.vy *= (1 - world.air*dt);

    this.x += this.vx*dt; this.y += this.vy*dt; this.a += this.av*dt;

    const {hw, hh} = this.extents();

    // 左右墙
    if(this.x - hw < 0){ this.x = hw; if(this.vx<0){ impact(this, Math.abs(this.vx), 0); this.vx = -this.vx*world.rest; } }
    if(this.x + hw > W){ this.x = W-hw; if(this.vx>0){ impact(this, Math.abs(this.vx), 0); this.vx = -this.vx*world.rest; } }
    // 天花板
    if(this.y - hh < 0){ this.y = hh; if(this.vy<0){ impact(this, Math.abs(this.vy), 0); this.vy = -this.vy*world.rest; S.hitCeiling = true; } }
    // 地面
    this.onGround = false;
    if(this.y + hh > world.floorY){
      this.y = world.floorY - hh;
      if(this.vy > 40){ impact(this, this.vy, 1); this.vy = -this.vy*world.rest; }
      else { this.vy = 0; this.onGround = true; }
      this.vx *= 0.9; this.av *= 0.85;
      if(this.onGround && Math.hypot(this.vx,this.vy) < 160){
        // 落地后慢慢躺平
        const goal = Math.round(this.a/Math.PI)*Math.PI;
        this.a += (goal - this.a) * Math.min(1, 6*dt);
        this.av *= 0.6;
      }
    }
  }
  draw(now, mx, my){
    const skin = SKINS[SKIN_OF_LEVEL(S.level)];
    const {hw, hh} = this.extents();

    // 地面投影
    const hgt = Math.max(0, world.floorY - (this.y + hh));
    const k = Math.max(0.12, 1 - hgt/520);
    ctx.save();
    ctx.globalAlpha = 0.34*k;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(this.x, world.floorY - 3, hw*1.05*k + 18, 10*k + 4, 0, 0, 7);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.a);

    // 挤压回弹
    const sq = this.squash;
    const sx = 1 + sq*0.16, sy = 1 - sq*0.16;
    ctx.scale(sx, sy);

    // 多彩砖
    let b0 = skin.body[0], b1 = skin.body[1], b2 = skin.body[2];
    if(skin.rainbow){
      const hue = (now/8) % 360;
      b0 = `hsl(${hue},95%,72%)`; b1 = `hsl(${(hue+70)%360},85%,55%)`; b2 = `hsl(${(hue+150)%360},80%,42%)`;
    }

    // 主体
    const g = ctx.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, b0); g.addColorStop(0.55, b1); g.addColorStop(1, b2);
    rr(-HW, -HH, BW, BH, 9);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 2.2; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.stroke();

    // 顶部高光
    ctx.save(); rr(-HW,-HH,BW,BH,9); ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.moveTo(-HW,-HH); ctx.lineTo(HW,-HH); ctx.lineTo(HW,-HH+9); ctx.lineTo(-HW,-HH+13); ctx.closePath(); ctx.fill();
    // 砖孔
    ctx.fillStyle = skin.rainbow ? "rgba(0,0,0,.28)" : skin.hole;
    ctx.globalAlpha = 0.55;
    for(const px of [-26, 0, 26]){ ctx.beginPath(); ctx.ellipse(px, 2, 7, 9, 0, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    // 底部暗影
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.moveTo(-HW,HW); ctx.lineTo(HW,HW); ctx.lineTo(HW,HW-10); ctx.lineTo(-HW,HW-6); ctx.closePath(); ctx.fill();
    ctx.restore();

    // 眼睛（会看着你）
    this.drawEyes(mx, my, hh, now);

    ctx.restore();
  }
  drawEyes(mx, my, hh, now){
    // 眨眼
    if(now/1000 > this.nextBlink){ this.blink = 0.13; this.nextBlink = now/1000 + 1.5 + Math.random()*3.5; }
    this.blink = Math.max(0, this.blink - 1/60);
    const openness = this.blink > 0 ? 0.12 : 1;

    // 光标 → 本地坐标
    const cos = Math.cos(-this.a), sin = Math.sin(-this.a);
    const dx = mx - this.x, dy = my - this.y;
    let lx = dx*cos - dy*sin, ly = dx*sin + dy*cos;

    const eyeY = -2;
    for(const ex of [-16, 16]){
      const dirx = lx - ex, diry = ly - eyeY;
      const d = Math.hypot(dirx, diry) || 1;
      const px = ex + dirx/d*3.4, py = eyeY + diry/d*2.6;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(ex, eyeY, 8.5, 9.5*openness, 0, 0, 7); ctx.fill();
      if(openness > 0.5){
        ctx.fillStyle = "#181820";
        ctx.beginPath(); ctx.arc(px, py, 4.1, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(px-1.4, py-1.6, 1.4, 0, 7); ctx.fill();
      } else {
        ctx.strokeStyle = "#181820"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ex-7, eyeY); ctx.lineTo(ex+7, eyeY); ctx.stroke();
      }
    }
  }
  kill(){ this.bubble.remove(); }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function impact(b, speed, kind){
  const now = performance.now();
  if(now - (b._lastHit||0) < 45) return;
  b._lastHit = now;
  if(speed > 90){
    A.clack(Math.min(1.4, speed/700));
    dust(b.x, b.y + (kind?HH:-HH), Math.min(14, 3+speed/90|0), Math.min(1.6, 0.5+speed/900));
    b.squash = Math.min(1, speed/900);
    if(Math.random() < 0.35){ b.say(pick(LINES.撞击), 'silent'); }
  }
}

/* ---------- 状态 ---------- */
const S = {
  level:1, drags:0, dist:0, maxSpeed:0, maxCount:1,
  hitCeiling:false, restTime:0, idleTime:0
};
let lastInteract = performance.now();
let bricks = [];
const pointer = { x: 0, y: 0, down:false, downAt:0, downX:0, downY:0, moved:0 };

function atPointer(x,y){
  for(let i=bricks.length-1;i>=0;i--){
    const b = bricks[i];
    const cos = Math.cos(-b.a), sin = Math.sin(-b.a);
    const dx = x-b.x, dy = y-b.y;
    const lx = dx*cos - dy*sin, ly = dx*sin + dy*cos;
    if(Math.abs(lx) <= HW+8 && Math.abs(ly) <= HH+8) return b;
  }
  return null;
}
function spawn(x,y){
  const b = new Brick(x ?? (W/2 + (Math.random()-0.5)*W*0.3), y ?? (world.floorY - HH - 220));
  bricks.push(b);
  S.maxCount = Math.max(S.maxCount, bricks.length);
  updateHUD();
  return b;
}
function reset(){
  bricks.forEach(b=>b.kill());
  bricks = []; spawn(W/2, world.floorY - HH - 260);
}

/* ---------- 指针交互 ---------- */
cvs.addEventListener('pointerdown', e=>{
  A.init(); A.resume(); lastInteract = performance.now();
  cvs.setPointerCapture(e.pointerId);
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.down = true; pointer.downAt = performance.now();
  pointer.downX = e.clientX; pointer.downY = e.clientY; pointer.moved = 0;
  const b = atPointer(e.clientX, e.clientY);
  if(b){
    bricks.splice(bricks.indexOf(b),1); bricks.push(b);
    b.dragging = true; b.gox = b.x - e.clientX; b.goy = b.y - e.clientY;
    cvs.classList.add('grabbing');
  }
});
cvs.addEventListener('pointermove', e=>{
  pointer.x = e.clientX; pointer.y = e.clientY;
  if(pointer.down) pointer.moved += Math.hypot(e.movementX||0, e.movementY||0);
});
function endDrag(e){
  if(!pointer.down) return;
  pointer.down = false;
  cvs.classList.remove('grabbing');
  const held = bricks.find(b=>b.dragging);
  if(held){
    held.dragging = false;
    const sp = Math.hypot(held.vx, held.vy);
    if(sp > 2600){ held.vx *= 2600/sp; held.vy *= 2600/sp; }
    const dur = performance.now() - pointer.downAt;
    if(dur < 260 && pointer.moved < 8){          // 轻点 → 说话
      held.say(pick(LINES[pick(KEYS)]));
    } else if(pointer.moved > 40){                // 真·搬砖
      S.drags++;
    }
  }
  hideHint();
  updateHUD();
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
window.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------- 按钮 / 键盘 ---------- */
document.querySelector('[data-act="line"]').addEventListener('click', ()=>{
  A.init(); A.resume();
  const b = bricks[bricks.length-1] || spawn();
  b.say(pick(LINES[pick(KEYS)]));
  hideHint();
});
document.querySelector('[data-act="add"]').addEventListener('click', ()=>{
  A.init(); A.resume();
  if(bricks.length < 14) spawn();
  else toast("🎯 够了，再多就成墙了。");
  hideHint();
});
document.querySelector('[data-act="reset"]').addEventListener('click', ()=>{
  A.init(); A.resume(); reset(); hideHint();
});
const muteBtn = document.getElementById('uMute');
muteBtn.addEventListener('click', ()=>{
  A.init(); A.muted = !A.muted;
  muteBtn.textContent = A.muted ? "🔇" : "🔊";
});
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); document.querySelector('[data-act="line"]').click(); }
  if(e.key === 'r' || e.key === 'R'){ reset(); }
});
function hideHint(){ hintEl.classList.add('hide'); }
setTimeout(hideHint, 9000);

/* ---------- HUD ---------- */
const uLevel = document.getElementById('uLevel');
const uDrags = document.getElementById('uDrags');
const uDist  = document.getElementById('uDist');
const uCount = document.getElementById('uCount');
function updateHUD(){
  uLevel.textContent = "Lv."+S.level+" "+TITLES[S.level-1];
  uDrags.textContent = S.drags;
  uDist.textContent = (S.dist/20|0);
  uCount.textContent = bricks.length;
}

/* ---------- 顿悟 ---------- */
function checkLevel(){
  const m = S.dist/20;
  let lv = 1;
  for(let i=0;i<THRESH.length;i++) if(m >= THRESH[i]) lv = i+1;
  if(lv > S.level){
    S.level = lv;
    A.levelUp();
    flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
    const b = bricks[bricks.length-1] || bricks[0];
    if(b) b.say("【顿悟】"+TITLES[lv-1]+" —— 砖，进化了。", 'silent');
    toast("✨ 道行提升 · "+TITLES[lv-1]);
    updateHUD();
  }
}

/* ---------- 成就 ---------- */
const ACS = [
  {id:'first', ic:'🧱', n:'初次搬砖', d:'拖动一次砖头', t:()=>S.drags>=1},
  {id:'labor', ic:'💪', n:'体力劳动者', d:'搬砖 10 次', t:()=>S.drags>=10},
  {id:'master',ic:'👷', n:'搬砖大师', d:'搬砖 50 次', t:()=>S.drags>=50},
  {id:'sky',   ic:'🚀', n:'上九天揽月', d:'把砖扔到天花板', t:()=>S.hitCeiling},
  {id:'warp',  ic:'💫', n:'星际砖', d:'速度超过 2000', t:()=>S.maxSpeed>2000},
  {id:'wall',  ic:'🧱', n:'砌墙工程师', d:'同时存在 5 块砖', t:()=>S.maxCount>=5},
  {id:'zen',   ic:'🧘', n:'禅', d:'让一块砖静止 10 秒', t:()=>S.restTime>=10},
  {id:'fish',  ic:'🐟', n:'摸鱼', d:'发呆 60 秒', t:()=>S.idleTime>=60},
  {id:'god',   ic:'🌈', n:'抽象之砖', d:'道行达到 Lv.5', t:()=>S.level>=5}
];
const unlocked = new Set();
function checkAch(){
  for(const a of ACS){
    if(!unlocked.has(a.id) && a.t()){
      unlocked.add(a.id);
      toast(a.ic+" 解锁成就 · "+a.n, a.d);
      if(!A.muted) A.clack(0.5);
    }
  }
}
function toast(main, sub){
  const el = document.createElement('div');
  el.className = 'ach';
  el.innerHTML = '<span class="ic">'+(main.split(' ')[0])+'</span><span><b>'+
    main.replace(/^\S+\s/,'')+'</b>'+(sub?' <small>'+sub+'</small>':'')+'</span>';
  toastEl.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

/* ---------- 弹幕 ---------- */
const DM = ["这砖不错","我搬过这块","砖砖好可爱","一眼抽象","哈哈哈哈哈","搬砖人搬砖魂",
  "承重墙警告","建议直接躺平","这很砖","我裂开了","砌起来砌起来","6","典","绷不住了","已阅",
  "砖头也能这么可爱","这波啊，这波是砖","我上班也是这个状态","啊？","你说得对"];
function shoot(){
  const d = document.createElement('div');
  d.className = 'dm';
  d.innerHTML = '<span class="u">'+ (["路人","工头","甲方","网友","砖友","项目经理"][(Math.random()*6)|0]) +'：</span>' + pick(DM);
  d.style.top = (10 + Math.random()*30) + '%';
  const w = d.offsetWidth || 200;
  d.style.left = W + 20 + 'px';
  danmakuEl.appendChild(d);
  const dur = 9000 + Math.random()*6000;
  d.animate(
    [{ transform:'translateX(0)' }, { transform:'translateX('+(-(W + w + 80))+'px)' }],
    { duration: dur, easing:'linear' }
  ).onfinish = ()=>d.remove();
}

/* ---------- 主循环 ---------- */
const STEP = 1/120;
let acc = 0, last = performance.now();

function physics(dt){
  const dragB = bricks.find(b=>b.dragging);
  const tx = pointer.x + (dragB?dragB.gox:0);
  const ty = pointer.y + (dragB?dragB.goy:0);

  for(const b of bricks){
    if(b.dragging){ trackDist(b); }
    b.update(dt, tx, ty);
  }
  // 砖与砖碰撞
  for(let i=0;i<bricks.length;i++){
    for(let j=i+1;j<bricks.length;j++){
      const a = bricks[i], c = bricks[j];
      let dx = c.x-a.x, dy = c.y-a.y;
      let d = Math.hypot(dx,dy) || 0.001;
      const min = RAD*2;
      if(d < min){
        const nx = dx/d, ny = dy/d;
        const push = (min-d)/2;
        a.x -= nx*push; a.y -= ny*push; c.x += nx*push; c.y += ny*push;
        const rvx = c.vx-a.vx, rvy = c.vy-a.vy;
        const vn = rvx*nx + rvy*ny;
        if(vn < 0){
          const imp = -(1+0.5)*vn/2;
          a.vx -= imp*nx; a.vy -= imp*ny;
          c.vx += imp*nx; c.vy += imp*ny;
          if(Math.abs(vn) > 120){ A.clack(Math.min(1, Math.abs(vn)/600)); dust((a.x+c.x)/2,(a.y+c.y)/2, 5, 0.8); }
        }
      }
    }
  }
  // 统计
  let maxSp = 0, allRest = bricks.length>0;
  for(const b of bricks){
    const sp = Math.hypot(b.vx,b.vy);
    maxSp = Math.max(maxSp, sp);
    if(!(b.onGround && sp < 14)) allRest = false;
  }
  S.maxSpeed = Math.max(S.maxSpeed, maxSp);
  S.restTime = allRest ? S.restTime + dt : 0;
  S.idleTime = (performance.now() - lastInteract)/1000;
  updateParts(dt);
  checkLevel();
  checkAch();
}
let lastDragPos = null;
function trackDist(b){
  if(lastDragPos){
    S.dist += Math.hypot(b.x-lastDragPos.x, b.y-lastDragPos.y);
  }
  lastDragPos = {x:b.x, y:b.y};
}

function draw(now){
  ctx.clearRect(0,0,W,H);
  // 地板
  ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, world.floorY+1.5); ctx.lineTo(W, world.floorY+1.5); ctx.stroke();
  const gg = ctx.createLinearGradient(0, world.floorY, 0, world.floorY+80);
  gg.addColorStop(0,'rgba(255,255,255,.045)'); gg.addColorStop(1,'transparent');
  ctx.fillStyle = gg; ctx.fillRect(0, world.floorY, W, 80);

  for(const b of bricks) b.draw(now, pointer.x, pointer.y);
  drawParts();

  // 气泡跟随
  const tnow = performance.now();
  for(const b of bricks){
    const on = b.text && (tnow - b.textT) < 4200;
    b.bubble.classList.toggle('show', !!on);
    if(on){
      b.bubble.textContent = b.text;
      const {hw, hh} = b.extents();
      let bx = b.x, by = b.y - hh - 14;
      const bw = b.bubble.offsetWidth || 200;
      bx = Math.min(Math.max(bx, bw/2 + 12), W - bw/2 - 12);
      by = Math.max(by, 96);
      b.bubble.style.left = bx + 'px';
      b.bubble.style.top  = by + 'px';
    }
    b.squash = Math.max(0, b.squash - 0.02);
  }
  // 拖动时砖头微微发光
  if(pointer.down){
    const b = bricks.find(x=>x.dragging);
    if(b){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const r = ctx.createRadialGradient(b.x,b.y,4,b.x,b.y,110);
      r.addColorStop(0,'rgba(255,170,120,.28)'); r.addColorStop(1,'transparent');
      ctx.fillStyle = r; ctx.beginPath(); ctx.arc(b.x,b.y,110,0,7); ctx.fill();
      ctx.restore();
    }
  }
}

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  acc += dt;
  let guard = 0;
  while(acc >= STEP && guard++ < 8){ physics(STEP); acc -= STEP; }
  if(!bricks.find(b=>b.dragging)) lastDragPos = null;
  draw(now);
}

/* ---------- 启动 ---------- */
resize();
bricks.push(new Brick(W/2, world.floorY - HH - 260));
updateHUD();
requestAnimationFrame(loop);
setInterval(()=>{ if(!document.hidden && Math.random()<0.75) shoot(); }, 2800);
setTimeout(()=>{ if(bricks[0]) bricks[0].say("你好。我是一块砖。"+ (Math.random()<0.5?"你可以拖我。":"你也可以不拖，都行。")); }, 700);

// 发呆时砖头自己搭话
setInterval(()=>{
  const sec = (performance.now()-lastInteract)/1000;
  if(sec > 22 && Math.random() < 0.5){
    const b = bricks[bricks.length-1];
    if(b && (!b.text || performance.now()-b.textT > 6000)) b.say(pick(LINES.发呆), 'silent');
  }
}, 9000);
</script>
