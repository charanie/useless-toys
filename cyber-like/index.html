<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点赞按钮 · THE LIKE BUTTON</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0e}
  body{
    background-image:radial-gradient(900px 700px at 50% 42%, #1b1622 0%, #0a0a0e 70%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:#ece7dd;display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none}
  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px}

  .count{font:800 clamp(52px,13vw,96px)/1 ui-monospace,Consolas,monospace;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(96deg,#ffd36e,#ff6a45 45%,#c86bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,140,90,.25));transition:transform .12s}
  .count.pop{transform:scale(1.09)}
  .cap{font-size:12px;letter-spacing:.34em;color:#8f887c;margin-bottom:26px}

  .ring{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
  #like{
    width:168px;height:168px;border-radius:50%;cursor:pointer;border:none;
    font-size:70px;line-height:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 34% 28%, #3a2a44, #1a1420 70%);
    box-shadow:0 26px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.10), 0 0 0 0 rgba(255,106,69,.5);
    transition:transform .12s cubic-bezier(.2,1.4,.4,1), box-shadow .3s;
    animation:breathe 3.4s ease-in-out infinite;
  }
  #like:hover{box-shadow:0 26px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.18), 0 0 46px rgba(255,106,69,.5)}
  #like:active{transform:scale(.93)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #like.happy{animation:wiggle .5s ease}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

  .lvl{font-size:17px;letter-spacing:.16em;margin-bottom:4px}
  .lvl b{color:#ffb26b}
  .next{font-size:11.5px;color:#8f887c;letter-spacing:.1em}

  .bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
  button.mini{
    font:inherit;font-size:12px;color:#8f887c;background:transparent;border:1px solid rgba(255,255,255,.12);
    border-radius:999px;padding:6px 14px;cursor:pointer;transition:.15s;
  }
  button.mini:hover{color:#ece7dd;border-color:rgba(255,255,255,.3)}

  .toasts{position:fixed;left:20px;top:20px;z-index:4;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none;max-width:min(330px,78vw)}
  .toast{
    background:linear-gradient(100deg,rgba(255,140,90,.2),rgba(200,107,255,.16));
    border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:9px 16px;
    font-size:13px;letter-spacing:.06em;box-shadow:0 12px 34px rgba(0,0,0,.5);
    animation:tin .3s cubic-bezier(.2,1.3,.4,1) both, tout .5s ease 3.2s both;
    max-width:100%;line-height:1.5;
  }
  @keyframes tin{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-10px)}}
  .float{position:fixed;z-index:4;pointer-events:none;font-weight:800;color:#ffd36e;
    text-shadow:0 0 14px rgba(255,180,90,.6);animation:flup 1s ease-out both}
  @keyframes flup{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}to{opacity:0;transform:translate(-50%,-190%) scale(1.25)}}
  .hintb{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);font-size:11.5px;color:#6f6a62;letter-spacing:.14em;z-index:3}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="stage">
  <div class="count" id="count">0</div>
  <div class="cap">你 已 经 点 了 这 么 多 次</div>

  <div class="ring"><button id="like" aria-label="点赞">👍</button></div>

  <div class="lvl">称号 <b id="lvl">路过的</b></div>
  <div class="next" id="next">再点 3 次升级</div>
</div>

<div class="toasts" id="toasts"></div>
<div class="hintb">这个赞会一直记得你（存在本机）</div>
<div class="bar">
  <button class="mini" id="muteBtn">🔊</button>
  <button class="mini" id="resetBtn">让它忘记我</button>
</div>

<script>
"use strict";
/* ========= 点赞按钮 ========= */
const $=id=>document.getElementById(id);
const KEY='ut_like_count';
let count = 0; try{ count = JSON.parse(localStorage.getItem(KEY)||'0')||0; }catch(e){}
let saveTimer=null, lastClick=0, combo=0;

/* ---- 音效 ---- */
const A={
  ctx:null,muted:false,
  init(){ if(this.ctx)return; const C=window.AudioContext||window.webkitAudioContext; if(C)this.ctx=new C(); },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  pop(n){
    if(this.muted||!this.ctx)return;
    const c=this.ctx,t=c.currentTime;
    const f = 420 + Math.min(900, n*9) + Math.random()*60;
    const o=c.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.6,t+0.09);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.10,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.16);
  },
  up(){
    if(this.muted||!this.ctx)return;
    const c=this.ctx,t=c.currentTime;
    [523,659,784,1046].forEach((f,i)=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=c.createGain(); const st=t+i*0.06;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.11,st+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.5);
      o.connect(g).connect(c.destination); o.start(st); o.stop(st+0.55);
    });
  }
};

/* ---- 等级 ---- */
const LEVELS=[
  {n:0,   t:"路过的",        e:"👍"},
  {n:3,   t:"手滑了",        e:"👍"},
  {n:10,  t:"回头客",        e:"👏"},
  {n:30,  t:"常来",          e:"🔥"},
  {n:80,  t:"铁粉",          e:"💖"},
  {n:180, t:"点赞狂魔",      e:"🏆"},
  {n:400, t:"点赞之神",      e:"🌟"},
  {n:800, t:"宇宙点赞者",    e:"🌌"},
  {n:2000,t:"摸鱼界的神",    e:"🐟"}
];
const TOASTS={
  1:"👋 你好，这是你的第一个赞。",
  3:"嗯？你又点了一下。",
  10:"开始有点上瘾了，是吧。",
  30:"按钮注意到你了。",
  80:"它开始发光了。",
  180:"说真的，手不酸吗。",
  400:"你已经超越 99% 的用户（其实没有别的用户）。",
  800:"这个赞，宇宙记下了。",
  2000:"好了，你可以去干点正事了。"
};
const RANDOM=["又一个。","数字在增长，很好。","你确定不是在测手速？","我记得你。","继续，我还能扛。","这很有意义（并没有）。","点吧，反正也没别的事。","你的手速不错。","+1 了，恭喜。"];
function pick(a){ return a[(Math.random()*a.length)|0]; }
function levelOf(n){ let L=LEVELS[0], i=0; LEVELS.forEach((l,idx)=>{ if(n>=l.n){ L=l; i=idx; } }); return {L, i}; }

/* ---- 粒子 ---- */
const cv=$('fx'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, parts=[];
function fxResize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR|0; cv.height=H*DPR|0; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function burst(x,y,n){
  const hue = (20 + Math.random()*280);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90,t:0,life:.6+Math.random()*.6,
      r:2+Math.random()*4.5,h:hue+Math.random()*70});
  }
}
function fxDraw(){
  ctx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=1/60;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.vy+=520/60; p.x+=p.vx/60; p.y+=p.vy/60;
    const k=1-p.t/p.life;
    ctx.globalAlpha=k; ctx.fillStyle=`hsl(${p.h},88%,${62+10*k}%)`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*k,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(fxDraw);
}

/* ---- 交互 ---- */
const btn=$('like');
function render(){
  $('count').textContent = count;
  const {L,i}=levelOf(count);
  $('lvl').textContent = L.t;
  btn.textContent = L.e;
  const nextT = LEVELS[i+1];
  $('next').textContent = nextT ? `再点 ${nextT.n-count} 次升级到「${nextT.t}」` : '已封顶，宇宙记住了你';
  const sc = 1 + Math.min(0.5, Math.log10(count+1)*0.22);
  btn.style.width = btn.style.height = Math.round(168*sc)+'px';
  btn.style.fontSize = Math.round(70*sc)+'px';
  btn.style.background = `radial-gradient(circle at 34% 28%, hsl(${(20+count*3)%360} 40% 26%), #141018 72%)`;
}
function onClick(e){
  A.init(); A.resume();
  const now=performance.now();
  combo = (now-lastClick < 420) ? combo+1 : 1;
  lastClick = now;
  count++;
  A.pop(count);
  // 数字动效
  const cEl=$('count'); cEl.textContent=count;
  cEl.classList.remove('pop'); void cEl.offsetWidth; cEl.classList.add('pop');
  // 粒子从按钮中心
  const r=btn.getBoundingClientRect();
  burst(r.left+r.width/2, r.top+r.height/2, 14);
  // 飘字
  const f=document.createElement('div');
  f.className='float';
  f.textContent = combo>3 ? 'x'+combo+' 赞！' : '+1';
  f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.top+r.height/2)+'px';
  f.style.fontSize = (16+Math.min(18,combo*2))+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(),1000);

  // 里程碑
  if(TOASTS[count]){ toast(TOASTS[count]); A.up(); }
  else if(count%37===0){ toast(pick(RANDOM)); }
  if(LEVELS.some(l=>l.n===count)){ A.up(); toast('🎉 升级：'+levelOf(count).L.t); }

  render();
  btn.classList.remove('happy'); void btn.offsetWidth; btn.classList.add('happy');
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(count)); }catch(e){} }, 400);
}
btn.addEventListener('click', onClick);
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); onClick(); } });

function toast(msg){
  const d=document.createElement('div');
  d.className='toast'; d.textContent=msg;
  $('toasts').appendChild(d);
  setTimeout(()=>d.remove(), 3800);
}
$('muteBtn').addEventListener('click', ()=>{ A.init(); A.muted=!A.muted; $('muteBtn').textContent=A.muted?'🔇':'🔊'; });
$('resetBtn').addEventListener('click', ()=>{
  count=0; combo=0;
  try{ localStorage.removeItem(KEY); }catch(e){}
  render(); toast('它已经不记得你了。（它其实有点难过）');
});

/* ---- 启动 ---- */
fxResize(); addEventListener('resize', fxResize); fxDraw();
render();
if(count>0) setTimeout(()=>toast(`欢迎回来。你已经点了 ${count} 次了。`), 700);
</script>
</body>
</html>
