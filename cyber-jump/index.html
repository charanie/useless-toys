<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>跳槽 · JOB HOPPING</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0;background:#07080c}
  body{
    background-image:radial-gradient(900px 700px at 50% 14%, #131b26 0%, #07080c 68%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#e8ecf2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:18px 14px 24px;gap:12px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }

  header{width:min(560px,94vw);display:flex;align-items:flex-end;gap:12px}
  .brand{flex:1;min-width:0}
  .brand .t{font-size:11px;letter-spacing:.4em;color:#6f7b8c}
  .brand h1{margin:4px 0 0;font-size:21px;letter-spacing:.14em;color:#8fd9ff;font-weight:800}
  .brand .s{margin-top:5px;font-size:11.5px;color:#8492a4}
  .stats{display:flex;gap:7px}
  .stat{background:rgba(20,26,36,.82);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:6px 13px;text-align:center;min-width:62px}
  .stat .k{font-size:9.5px;letter-spacing:.22em;color:#6f7b8c}
  .stat .v{font:800 18px/1.3 ui-monospace,Consolas,monospace;color:#8fd9ff;font-variant-numeric:tabular-nums}
  .stat.pf .v{color:#ffd36e}
  .stat.best .v{color:#8ef0c8}
  /* 窄屏时三个数字块会把标题挤成竖排，让标题自己占一行 */
  @media (max-width:520px){
    header{flex-wrap:wrap;gap:9px}
    .brand{flex:1 1 100%}
    .stats{flex:1 1 100%;justify-content:space-between}
  }

  .wrap{position:relative;border-radius:16px;padding:8px;
    background:linear-gradient(160deg,#141a26,#0b0f16);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 66px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.05);
    touch-action:none;line-height:0}
  canvas{display:block;border-radius:10px;background:#080c13;cursor:pointer}

  .bar{width:min(560px,94vw);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-size:12.5px;color:#e8ecf2;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:10px 18px;letter-spacing:.08em;transition:.15s}
  button.b:hover{background:rgba(143,217,255,.15);border-color:rgba(143,217,255,.5);color:#cfeaff}
  button.b.primary{background:linear-gradient(120deg,rgba(143,217,255,.28),rgba(142,240,200,.2));border-color:rgba(143,217,255,.55)}
  .hint{flex:1;text-align:right;font-size:11px;color:#67748a;letter-spacing:.06em;line-height:1.6}
  footer{font-size:11px;color:#57647a;letter-spacing:.14em;text-align:center;line-height:1.9}
  footer b{color:#ffd36e}

  .over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(5,7,11,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .over.show{display:flex}
  .box{width:min(400px,92vw);text-align:center;padding:30px 26px 24px;border-radius:22px;
    background:linear-gradient(180deg,rgba(24,30,42,.98),rgba(13,17,23,.98));
    border:1px solid rgba(143,217,255,.24);box-shadow:0 30px 80px rgba(0,0,0,.72)}
  .box .em{font-size:38px;line-height:1}
  .box h2{margin:13px 0 6px;font-size:20px;letter-spacing:.14em;color:#8fd9ff}
  .box p{margin:0 0 18px;font-size:12.5px;line-height:1.95;color:#93a2b6}
  .box p b{color:#ffd36e}
  .box .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="t">JOB HOPPING</div>
    <h1>跳槽</h1>
    <div class="s">按住蓄力，松手起跳，落在下一家公司上</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">年薪</div><div class="v" id="score">0</div></div>
    <div class="stat pf"><div class="k">跳槽</div><div class="v" id="hops">0</div></div>
    <div class="stat best"><div class="k">最佳</div><div class="v" id="best">0</div></div>
  </div>
</header>

<div class="wrap"><canvas id="c"></canvas></div>

<div class="bar">
  <button class="b primary" id="start">开始 (空格)</button>
  <span class="hint">按住蓄力 · 松手起跳<br>落在公司正中间 = 谈成了，落在边上 = 被压价</span>
</div>

<footer><b>蓄力的时候脚下的地基在下沉</b> —— 蓄得越久跳得越远，但也沉得越深，沉到虚线就塌<br>
落点越靠正中越能谈成，落在边上就被压价 —— 而且被压价的那家更不靠谱，地基沉得更快</footer>

<div class="over" id="over">
  <div class="box">
    <div class="em" id="oEmoji">🕳</div>
    <h2 id="oTitle">掉下去了</h2>
    <p id="oText"></p>
    <div class="row">
      <button class="b primary" id="oAgain">再来一次</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ========= 一键跳 KPI ========= */
const $ = id => document.getElementById(id);
const W = 560, H = 560;
const GROUND = 452;          // 地面线
const PLAT_H = 104;          // 工位高度
const MIN_D = 86;            // 最短跳跃距离
const MAX_D = 344;           // 满蓄力距离
const CHARGE_MS = 950;       // 蓄满需要的时间
const PERFECT = 8;           // 落在中心多少 px 内算「谈成了」
const SINK_MAX = 88;         // 地基一共能沉多深，沉透就塌
const SINK_LO = 0.13, SINK_HI = 0.26;   // 每家公司的下沉速度（每秒占 SINK_MAX 的比例）
const LOWBALL_SINK = 1.7;    // 被压价的那家更不靠谱，地基沉得更快

const ROOMS = ['某某科技','不睡网络','摸鱼集团','打工人力','加班信息','内卷科技','画饼智能',
               'OKR 咨询','对齐网络','闭环数据','抓手科技','复盘文化','赋能集团','颗粒度研究',
               '方法论股份','跨界整合','生态位科技','下半场资本','宣发一号','元宇宙筹备'];

const cvs = $('c'), ctx = cvs.getContext('2d');
let plats = [];              // {x, w, room, offer, sink, sinkV}
let cur = 0;                 // 当前站在第几家公司上
let score = 0, hops = 0, perfect = 0, perfectStreak = 0, best = 0;
let camX = 0, camTarget = 0;
let charging = false, chargeStart = 0, power = 0;
let phase = 'idle';          // idle | charging | jumping | falling | over
let jump = null, fall = null, deathWhy = '';
let fx = [];
let last = 0, s = 1;
let player = {x:0, y:0, rot:0};

/* ---------- 音效 ---------- */
const A = {
  ctx:null, chargeOsc:null, chargeGain:null,
  init(){ if(this.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C(); },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f, dur, type, gain, bend, delay){
    if(!this.ctx) return;
    const c=this.ctx, t0=c.currentTime+(delay||0);
    const o=c.createOscillator(); o.type=type||'sine';
    const g=c.createGain();
    o.frequency.setValueAtTime(f, t0);
    if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*bend), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.04);
  },
  chargeOn(){
    this.init(); this.resume();
    if(!this.ctx || this.chargeOsc) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = 'triangle';
    const g = c.createGain();
    o.frequency.setValueAtTime(180, t);
    o.frequency.linearRampToValueAtTime(760, t + CHARGE_MS/1000);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t+0.05);
    o.connect(g).connect(c.destination);
    o.start(t);
    this.chargeOsc = o; this.chargeGain = g;
  },
  chargeOff(){
    if(!this.ctx || !this.chargeOsc) return;
    const c = this.ctx, t = c.currentTime;
    try{
      this.chargeGain.gain.cancelScheduledValues(t);
      this.chargeGain.gain.setValueAtTime(Math.max(0.0001, this.chargeGain.gain.value), t);
      this.chargeGain.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
      this.chargeOsc.stop(t+0.08);
    }catch(e){}
    this.chargeOsc = null; this.chargeGain = null;
  },
  jump(){ this.tone(520, .22, 'sine', .07, .35); },
  land(){ this.tone(150, .14, 'triangle', .08, .7); },
  perfect(){ [0,7,12].forEach((n,i)=> this.tone(880*Math.pow(2,n/12), .22, 'triangle', .065, 1, i*.06)); },
  fail(){ [0,.1,.22,.36,.52].forEach((d,i)=> this.tone(300*Math.pow(.82,i), .3, 'sine', .075, .7, d)); }
};

/* ---------- 关卡生成 ---------- */
function randRange(a, b){ return a + Math.random()*(b - a); }
function makePlat(x, w, i, offer){
  return {x, w, room: ROOMS[i % ROOMS.length], offer, sink: 0,
          sinkV: randRange(SINK_LO, SINK_HI)};
}
/* 站在 from 上（不管站在哪儿）都至少有一档蓄力能落到 p 上。
   保守判法：最左边那一跳也得够得着 p 的右沿，最右边那一跳也不能越过 p 的左沿 */
function reachable(from, p){
  return p.x <= from.x + MAX_D && (p.x + p.w) >= (from.x + from.w) + MIN_D;
}
function nextPlat(){
  const i = plats.length;
  const prev = plats[i-1];
  const t = Math.min(1, hops/22);
  const w = randRange(104 - t*58, 118 - t*56);          // 越来越窄
  const gap = randRange(64 + t*18, 132 + t*104);        // 越来越远
  let x = prev.x + prev.w + Math.max(46, gap);
  const loX = prev.x + prev.w + MIN_D - w;              // 再近也不能近到落不上
  const hiX = prev.x + MAX_D;                           // 再远也不能远到满蓄力够不着
  if(loX <= hiX) x = Math.max(loX, Math.min(x, hiX));
  x = Math.max(x, prev.x + prev.w + 30);                // 别和上一家叠一起
  const offer = 8 + Math.floor(hops*1.7) + Math.floor(randRange(0, 12));
  plats.push(makePlat(x, w, i, offer));
}
function reset(){
  plats = [makePlat(0, 118, 0, 8)];
  nextPlat();
  cur = 0; score = 0; hops = 0; perfect = 0; perfectStreak = 0;
  charging = false; power = 0; phase = 'idle';
  jump = null; fall = null; fx = []; deathWhy = '';
  camX = -W*0.18; camTarget = camX;
  placePlayer();
  $('over').classList.remove('show');
  updateHUD();
}
/* 脚下这块地沉了多少 */
function sinkOff(p){ return p ? p.sink * SINK_MAX : 0; }
function placePlayer(){
  const p = plats[cur];
  player.x = p.x + p.w/2;
  player.y = GROUND - PLAT_H + sinkOff(p);
  player.rot = 0;
}
function updateHUD(){
  $('score').textContent = score;
  $('hops').textContent = hops;
  $('best').textContent = best;
}

/* ---------- 蓄力 / 起跳 ---------- */
function startCharge(){
  if(phase !== 'idle') return;
  charging = true; phase = 'charging'; chargeStart = performance.now(); power = 0;
  A.chargeOn();
}
function release(){
  if(phase !== 'charging') return;
  charging = false;
  A.chargeOff();
  const p = Math.max(0, Math.min(1, power));
  const dist = MIN_D + p*(MAX_D - MIN_D);
  const from = player.x;
  const to = from + dist;
  const nxt = plats[cur+1];
  jump = {
    t: 0,
    dur: 0.30 + dist/900,
    x0: from, x1: to,
    y0: player.y,                 // 从已经沉下去的位置起跳
    apex: 92 + power*54
  };
  phase = 'jumping';
  A.jump();
}
function dropOut(x, straight){
  phase = 'falling';
  fall = { t: 0, x, y: GROUND - PLAT_H + (straight ? SINK_MAX : 0), vx: 0, vy: 0, target: x,
           straight: !!straight };
  A.fail();
  updateHUD();
}
function land(){
  const lx = jump.x1;
  // 落在哪家就是哪家 —— 这样才能一脚跨过一家皮包公司
  let hit = -1;
  for(let i = cur+1; i < plats.length; i++){
    const q = plats[i];
    if(lx >= q.x && lx <= q.x + q.w){ hit = i; break; }
  }
  if(hit < 0){
    deathWhy = 'miss';
    return dropOut(lx, false);
  }
  const next = plats[hit];
  // 站上去，开始谈
  cur = hit; hops++;
  const center = next.x + next.w/2;
  const off = Math.abs(lx - center);
  let gain, msg, gold = false;
  if(off <= PERFECT){
    perfect++; perfectStreak++;
    gain = next.offer + 5*Math.min(3, perfectStreak);
    gold = true;
    A.perfect();
    msg = perfectStreak > 1 ? `谈成了 ×${perfectStreak}  +${gain}` : `谈成了 +${gain}`;
  } else {
    perfectStreak = 0;
    gain = Math.max(1, Math.round(next.offer * 0.55));
    // 谈崩了的那家更不靠谱：地基沉得比别家快，留给你的蓄力时间更短
    next.sinkV *= LOWBALL_SINK;
    A.land();
    msg = `被压价 +${gain}`;
  }
  score += gain;
  player.x = clamp(lx, next.x + 10, next.x + next.w - 10);
  player.y = GROUND - PLAT_H;
  player.rot = 0;
  phase = 'idle';
  fx.push({x: player.x, y: player.y - 46, text: msg, life: 1, gold});
  if(score > best){ best = score; try{ localStorage.setItem('ut_jump_salary', String(best)); }catch(e){} }
  updateHUD();
  while(plats.length < cur + 4) nextPlat();   // 前面始终留几家
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---------- 主循环 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(60, ts - last || 16) / 1000; last = ts;

  if(phase === 'charging'){
    power = Math.min(1, (performance.now() - chargeStart) / CHARGE_MS);
  }
  // 脚下这块地基在下沉：蓄力越久沉得越深，沉透了就连人带工位一起塌
  if((phase === 'idle' || phase === 'charging') && plats[cur]){
    const p = plats[cur];
    p.sink += dt * p.sinkV;
    if(p.sink >= 1){
      p.sink = 1;
      A.chargeOff(); charging = false;
      deathWhy = 'sink';
      dropOut(player.x, true);
    } else {
      player.y = GROUND - PLAT_H + sinkOff(p);   // 站着的人跟着往下走
    }
  }
  if(phase === 'jumping' && jump){
    jump.t += dt / jump.dur;
    if(jump.t >= 1){ jump.t = 1; land(); }
    if(phase === 'jumping'){
      player.x = jump.x0 + (jump.x1 - jump.x0) * jump.t;
      player.y = jump.y0 - 4*jump.apex*jump.t*(1 - jump.t);
      player.rot = jump.t * Math.PI * 2;
    }
  }
  if(phase === 'falling' && fall){
    fall.t += dt;
    // 掉出公司边缘就往那侧斜着坠；地基塌了就是原地直着下去
    if(!fall.straight){
      const nx = plats[cur+1];
      const edge = fall.x < nx.x ? nx.x : nx.x + nx.w;
      fall.x += (edge - fall.x) * Math.min(1, dt*4);
    }
    fall.vy += 1500*dt;
    fall.y += fall.vy*dt;
    player.x = fall.x; player.y = fall.y;
    player.rot += dt*4;
    if(fall.y > H + 160) finish();
  }

  // 相机
  const p = plats[cur];
  camTarget = p.x + p.w/2 - W*0.34;
  camX += (camTarget - camX) * Math.min(1, dt*7);

  for(let i=fx.length-1;i>=0;i--){
    const f = fx[i];
    f.life -= dt*1.25; f.y -= dt*46;
    if(f.life <= 0) fx.splice(i,1);
  }
  draw();
}
function finish(){
  if(phase === 'over') return;
  phase = 'over';
  let emoji, title, chop;
  if(deathWhy === 'sink'){
    emoji = '🕳'; title = '地基塌了';
    chop = '你在这家公司待太久了，地基都是你踩塌的。';
  } else {
    emoji = score >= 400 ? '🏢' : '🕳';
    title = score >= 400 ? '跳到对手公司去了' : '掉下去了';
    chop = score >= 400 ? '年薪谈上去了，但公司和公司之间是有缝的。'
         : score >= 150 ? '跳得还行，就是手一抖。'
         : '刚起步就摔了，今天不宜面谈。';
  }
  $('oEmoji').textContent = emoji;
  $('oTitle').textContent = title;
  $('oText').innerHTML = `${chop}<br>跳了 <b>${hops}</b> 家 · 年薪谈到 <b>${score}</b> 万 · 一次谈成 <b>${perfect}</b> 次<br>历史最高 <b>${best}</b> 万`;
  $('over').classList.add('show');
}

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function resize(){
  const avail = Math.min(window.innerWidth*0.94, window.innerHeight*0.62, 560);
  const size = Math.max(270, Math.floor(avail));
  s = size/W;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = size*dpr; cvs.height = size*dpr;
  cvs.style.width = size+'px'; cvs.style.height = size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.scale(s, s);
  draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, '#0b1119'); bg.addColorStop(1, '#070a0f');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // 窗外格子
  ctx.strokeStyle = 'rgba(143,217,255,.045)'; ctx.lineWidth = 1;
  for(let x=-200; x<W+400; x+=40){
    ctx.beginPath(); ctx.moveTo(x - camX*0.35, 0); ctx.lineTo(x - camX*0.35, H); ctx.stroke();
  }
  for(let y=0;y<H;y+=40){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.save();
  ctx.translate(-camX, 0);

  // 地基塌陷线：平台顶沉到这条线上就完了
  ctx.save();
  ctx.setLineDash([6,7]);
  ctx.strokeStyle = 'rgba(255,110,90,.28)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(camX - 40, GROUND - PLAT_H + SINK_MAX);
  ctx.lineTo(camX + W + 40, GROUND - PLAT_H + SINK_MAX);
  ctx.stroke();
  ctx.restore();

  // 一家家公司
  for(let i=0;i<plats.length;i++){
    const p = plats[i];
    if(p.x + p.w < camX - 60 || p.x > camX + W + 60) continue;
    const top = GROUND - PLAT_H + sinkOff(p);
    const here = i === cur;
    const g = ctx.createLinearGradient(p.x, top, p.x, top + PLAT_H);
    g.addColorStop(0, here ? '#2c4a63' : '#22303f');
    g.addColorStop(1, '#141c26');
    ctx.fillStyle = g;
    rr(p.x, top, p.w, PLAT_H, 8); ctx.fill();
    ctx.strokeStyle = here ? 'rgba(143,217,255,.55)' : 'rgba(143,217,255,.18)';
    ctx.lineWidth = 2;
    rr(p.x+1, top+1, p.w-2, PLAT_H-2, 8); ctx.stroke();
    ctx.fillStyle = here ? 'rgba(143,217,255,.28)' : 'rgba(143,217,255,.10)';
    rr(p.x+2, top+2, p.w-4, 6, 4); ctx.fill();

    // 公司名
    const n = p.room.length;
    ctx.fillStyle = 'rgba(200,225,245,.5)';
    ctx.font = `700 ${n>4 ? 10.5 : 13}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.room, p.x + p.w/2, top + 28);

    // 报的价
    ctx.fillStyle = 'rgba(255,211,110,.78)';
    ctx.font = `800 12px ui-monospace,Consolas,monospace`;
    ctx.fillText(p.offer + ' 万', p.x + p.w/2, top + 50);

    // 中心刻度：落在这条线上就是「谈成了」
    ctx.strokeStyle = 'rgba(255,211,110,.32)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w/2, top + 6); ctx.lineTo(p.x + p.w/2, top + 17);
    ctx.stroke();

    // 正在下沉就顶上发红
    if(here && p.sink > 0.02){
      ctx.fillStyle = `rgba(255,110,90,${Math.min(.55, p.sink*0.6).toFixed(3)})`;
      rr(p.x, top, p.w, 5, 3); ctx.fill();
    }
  }

  // 人物（在跳就不画脚下的影子）
  if(phase !== 'over' || fall){
    drawChar(player.x, player.y, player.rot);
  }

  ctx.restore();

  // 飘字
  for(const f of fx){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.gold ? '#ffd36e' : '#8ef0c8';
    ctx.font = `800 16px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x - camX, f.y);
  }
  ctx.globalAlpha = 1;

  // 蓄力条
  const bw = W*0.5, bh = 9, bx = (W-bw)/2, by = H - 34;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  rr(bx, by, bw, bh, bh/2); ctx.fill();
  if(power > 0){
    const g = ctx.createLinearGradient(bx, 0, bx+bw, 0);
    g.addColorStop(0, '#8ef0c8'); g.addColorStop(.6, '#8fd9ff'); g.addColorStop(1, '#ff8a5c');
    ctx.fillStyle = g;
    rr(bx, by, Math.max(bh, bw*power), bh, bh/2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.font = `600 11px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(phase === 'charging' ? '松手！' : '按住蓄力', W/2, by - 12);

  if(phase === 'idle' && score === 0){
    ctx.fillStyle = 'rgba(8,12,19,.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#8fd9ff';
    ctx.font = `800 26px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('按住蓄力 · 松手起跳', W/2, H*0.44);
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    ctx.font = `600 13px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText('落在工位正中间算「完美」', W/2, H*0.44 + 30);
  }
}
function drawChar(x, y, rot){
  ctx.save();
  ctx.translate(x, y - 13);
  ctx.rotate(rot);
  ctx.shadowColor = 'rgba(143,217,255,.6)'; ctx.shadowBlur = 14;
  const g = ctx.createLinearGradient(0,-13,0,13);
  g.addColorStop(0, '#bfe6ff'); g.addColorStop(1, '#4f9ed6');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0b1119';
  ctx.beginPath(); ctx.arc(-4.4, -2, 2.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc( 4.4, -2, 2.4, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(11,17,25,.7)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 3.5, 4, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
  ctx.restore();
}

/* ---------- 交互 ---------- */
cvs.addEventListener('pointerdown', e=>{ e.preventDefault(); if(phase==='idle') startCharge(); });
addEventListener('pointerup', ()=>{ if(phase==='charging') release(); });
cvs.addEventListener('pointercancel', ()=>{ if(phase==='charging') release(); });
addEventListener('keydown', e=>{
  if(e.key === ' '){
    e.preventDefault();
    if(phase === 'idle' && e.repeat === false) startCharge();
  }
});
addEventListener('keyup', e=>{
  if(e.key === ' '){ e.preventDefault(); if(phase === 'charging') release(); }
});
$('start').addEventListener('click', ()=>{ A.init(); A.resume(); reset(); });
$('oAgain').addEventListener('click', ()=>{ A.init(); A.resume(); reset(); });
addEventListener('resize', resize);

/* ---------- 测试钩子 ---------- */
window.__j = {
  reset, startCharge, release, nextPlat, sinkOff, reachable, finish,
  step(sec){                       // 只推进「下沉」这类跟时间有关的逻辑
    const dt = sec*1000;
    if((phase === 'idle' || phase === 'charging') && plats[cur]){
      const p = plats[cur];
      p.sink += dt/1000 * p.sinkV;
      if(p.sink >= 1){ p.sink = 1; A.chargeOff(); charging = false; deathWhy = 'sink'; dropOut(player.x, true); }
      else player.y = GROUND - PLAT_H + sinkOff(p);
    }
  },
  get phase(){ return phase; },
  get cur(){ return cur; },
  get salary(){ return score; },
  get hops(){ return hops; },
  get perfect(){ return perfect; },
  get best(){ return best; },
  get over(){ return phase === 'over'; },
  get deathWhy(){ return deathWhy; },
  get curSink(){ return plats[cur] ? plats[cur].sink : 0; },
  get raw(){ return plats; },
  get px(){ return player.x; },
  cfg: {MIN_D, MAX_D},
  /* 从现在站的位置出发，前方哪几家是这一跳够得到的 */
  hittable(){
    const lo = player.x + MIN_D, hi = player.x + MAX_D;
    const out = [];
    for(let i = cur+1; i < Math.min(plats.length, cur+4); i++){
      const p = plats[i];
      if(p.x <= hi && p.x + p.w >= lo) out.push(i);
    }
    return out;
  },
  get plats(){ return plats.map(p => ({x:Math.round(p.x), w:Math.round(p.w), room:p.room, offer:p.offer})); },
  setPower(v){ power = Math.max(0, Math.min(1, v)); },
  setHops(v){ hops = v; },
  /* 从当前站的公司出发，前方有没有一家一跳够得着 */
  hasWayOut(){
    const from = plats[cur];
    for(let i = cur+1; i <= Math.min(cur+2, plats.length-1); i++){
      if(reachable(from, plats[i])) return true;
    }
    return false;
  },
  bestChargeFor(i){
    // 让落点正好落在第 i 家公司正中间需要的蓄力
    const from = player.x;
    const target = plats[i].x + plats[i].w/2;
    const d = target - from;
    return Math.max(0, Math.min(1, (d - MIN_D)/(MAX_D - MIN_D)));
  }
};

/* ---------- 启动 ---------- */
(function boot(){
  try{ best = parseInt(localStorage.getItem('ut_jump_salary')||'0',10) || 0; }catch(e){ best = 0; }
  reset(); resize();
  requestAnimationFrame(loop);
})();
</script>
