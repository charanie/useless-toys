<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>摸鱼 · SNEAK OUT</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0;background:#08070b}
  body{
    background-image:radial-gradient(900px 700px at 50% 14%, #1c1620 0%, #08070b 68%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#ece7ee;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:18px 14px 24px;gap:12px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }

  header{width:min(560px,94vw);display:flex;align-items:flex-end;gap:12px}
  .brand{flex:1;min-width:0}
  .brand .t{font-size:11px;letter-spacing:.4em;color:#7e7286}
  .brand h1{margin:4px 0 0;font-size:21px;letter-spacing:.14em;color:#ff8a9c;font-weight:800}
  .brand .s{margin-top:5px;font-size:11.5px;color:#918799}
  .stats{display:flex;gap:7px}
  .stat{background:rgba(28,22,32,.82);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:6px 10px;text-align:center;min-width:54px}
  .stat .k{font-size:9.5px;letter-spacing:.18em;color:#7e7286}
  .stat .v{font:800 18px/1.3 ui-monospace,Consolas,monospace;color:#ffd36e;font-variant-numeric:tabular-nums}
  .stat.tm .v{color:#8fd9ff}
  .stat.cb .v{color:#ff8a9c}
  .stat.hp .v{color:#ff6b8a;letter-spacing:1px;font-size:14px}
  .stat.best .v{color:#8ef0c8}
  /* 五个数字块在窄屏会把标题挤成竖排，干脆让标题自己占一行 */
  @media (max-width:560px){
    header{flex-wrap:wrap;gap:9px}
    .brand{flex:1 1 100%}
    .stats{flex:1 1 100%;justify-content:space-between}
  }

  .wrap{position:relative;border-radius:16px;padding:8px;
    background:linear-gradient(160deg,#1a1420,#0d0a12);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 66px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.05);
    touch-action:none;line-height:0}
  canvas{display:block;border-radius:10px;background:#0c0910;cursor:crosshair}

  .bar{width:min(560px,94vw);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-size:12.5px;color:#ece7ee;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:10px 18px;letter-spacing:.08em;transition:.15s}
  button.b:hover{background:rgba(255,138,156,.16);border-color:rgba(255,138,156,.5);color:#ffd0d8}
  button.b.primary{background:linear-gradient(120deg,rgba(255,138,156,.3),rgba(255,211,110,.2));border-color:rgba(255,138,156,.55)}
  .hint{flex:1;text-align:right;font-size:11px;color:#6b5f74;letter-spacing:.06em;line-height:1.6}
  footer{font-size:11px;color:#5f5568;letter-spacing:.14em;text-align:center;line-height:1.9}
  footer b{color:#ff8a9c}

  .over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(6,5,9,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .over.show{display:flex}
  .box{width:min(400px,92vw);text-align:center;padding:30px 26px 24px;border-radius:22px;
    background:linear-gradient(180deg,rgba(32,24,32,.98),rgba(18,14,20,.98));
    border:1px solid rgba(255,138,156,.24);box-shadow:0 30px 80px rgba(0,0,0,.72)}
  .box .em{font-size:38px;line-height:1}
  .box h2{margin:13px 0 6px;font-size:20px;letter-spacing:.14em;color:#ff8a9c}
  .box p{margin:0 0 18px;font-size:12.5px;line-height:1.95;color:#a094aa}
  .box p b{color:#ffd36e}
  .box .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="t">SNEAK OUT</div>
    <h1>摸鱼</h1>
    <div class="s">这回不能砸了 —— 你就是那只地鼠</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div>
    <div class="stat cb"><div class="k">连击</div><div class="v" id="combo">0</div></div>
    <div class="stat hp"><div class="k">命</div><div class="v" id="lives">❤❤❤</div></div>
    <div class="stat tm"><div class="k">剩余</div><div class="v" id="time">45</div></div>
    <div class="stat best"><div class="k">最佳</div><div class="v" id="best">0</div></div>
  </div>
</header>

<div class="wrap"><canvas id="c"></canvas></div>

<div class="bar">
  <button class="b primary" id="start">开始 (空格)</button>
  <span class="hint">按住一个洞不松 = 从那儿探出头<br>键盘 1–9 对应九宫格 · 松手就缩回去</span>
</div>

<footer><b>按住洞探头去吃外卖，但领导看过来的洞千万别探头</b><br>
警告先黄后红 —— 红的就是已经看见了 · 探头要 0.4 秒才够得着 · 外卖三秒半不吃就凉</footer>

<div class="over" id="over">
  <div class="box">
    <div class="em" id="oEmoji">🔨</div>
    <h2 id="oTitle">下班了</h2>
    <p id="oText"></p>
    <div class="row">
      <button class="b primary" id="oAgain">再来一局</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ========= 摸鱼 ========= */
const $ = id => document.getElementById(id);
const G = 3;                       // 3×3 个洞
const W = 560, H = 560;
const ROUND = 45;                  // 一局多少秒
const LIVES = 3;
const FOOD_N = 3;                  // 场上同时摆几份外卖
const RISE_MS = 400;               // 探头要 0.4 秒才够得着
const FOOD_LIFE = 3.6;             // 外卖几秒凉
const GAZE_MAX = 2;                // 同时最多几道视线

const FOODS = [
  {ic:'🍜', name:'外卖',   pts:10},
  {ic:'☕', name:'续命咖啡', pts:10},
  {ic:'🍗', name:'加餐',   pts:20},
  {ic:'🍰', name:'下午茶', pts:20}
];

const cvs = $('c'), ctx = cvs.getContext('2d');
let foods = [];                    // {idx, kind, t, life}
let gazes = [];                    // {idx, phase:'warn'|'lock', t, warn, lock}
let me = {hole:-1, rise:0, ateThisHold:false};   // 你：在哪个洞探头、冒了多高
let fx = [];
let score = 0, combo = 0, bestCombo = 0, best = 0, lives = LIVES;
let eaten = 0, caught = 0, missed = 0;
let running = false, over = true;
let timeLeft = ROUND, gazeT = 0, flash = 0;
let last = 0, gen = 0;
let geo = {};

/* ---------- 音效 ---------- */
const A = {
  ctx:null,
  init(){ if(this.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C(); },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f, dur, type, gain, bend, delay){
    if(!this.ctx) return;
    const c=this.ctx, t0=c.currentTime+(delay||0);
    const o=c.createOscillator(); o.type=type||'sine';
    const g=c.createGain();
    o.frequency.setValueAtTime(f, t0);
    if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*bend), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.04);
  },
  eat(mult){
    this.tone(300 * Math.pow(1.08, mult), .1, 'triangle', .06, 1.5);
    this.tone(620 * Math.pow(1.06, mult), .08, 'sine', .03, 1.4, .03);
  },
  warn(){ this.tone(420, .07, 'sine', .022, 1.25); },
  lock(){ this.tone(150, .2, 'sawtooth', .055, .6); this.tone(96, .22, 'square', .035, .7, .04); },
  caught(){ [0,.08,.17].forEach((d,i)=> this.tone(190*Math.pow(.72,i), .22, 'square', .07, .55, d)); },
  cold(){ this.tone(210, .1, 'triangle', .028, .7); },
  miss(){ this.tone(120, .06, 'triangle', .025, .8); },
  start(){ [0,5,9].forEach((n,i)=> this.tone(392*Math.pow(2,n/12), .22, 'triangle', .06, 1, i*.07)); },
  end(){ [0,.13,.26,.4].forEach((d,i)=> this.tone(330*Math.pow(.8,i), .3, 'sine', .07, .75, d)); }
};

/* ---------- 布局 ---------- */
function resize(){
  const avail = Math.min(window.innerWidth*0.94, window.innerHeight*0.62, 560);
  const size = Math.max(270, Math.floor(avail));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = size*dpr; cvs.height = size*dpr;
  cvs.style.width = size+'px'; cvs.style.height = size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const pad = size*0.06;
  const cellW = (size - pad*2) / G;
  const cellH = (size - pad*2) / G;
  const holes = [];
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    holes.push({
      x: pad + cellW*(c + 0.5),
      y: pad + cellH*(r + 0.72),
      rw: cellW*0.38,
      rh: cellH*0.15,
      scale: size/560
    });
  }
  geo = { size, holes, s: size/560 };
  draw();
}
function holeAt(px, py){
  // 判定区要盖住「洞 + 冒出来的头」，否则点脑袋点不到
  for(let i=0;i<geo.holes.length;i++){
    const h = geo.holes[i];
    const dx = (px - h.x) / (h.rw*1.25);
    const dy = (py - (h.y - h.rw*0.55)) / (h.rw*1.20);
    if(dx*dx + dy*dy <= 1) return i;
  }
  return -1;
}

/* ---------- 一局 ---------- */
function reset(){
  gen++;                       // 重开一代：上一局的延时弹窗认这一代才不会糊到新局上
  foods = []; gazes = []; fx = [];
  me = {hole:-1, rise:0, ateThisHold:false};
  score = 0; combo = 0; bestCombo = 0; lives = LIVES;
  eaten = 0; caught = 0; missed = 0;
  timeLeft = ROUND; gazeT = 520; flash = 0;
  running = false; over = true;
  $('over').classList.remove('show');
  placeFoods(); updateHUD(); draw();
}
function begin(){
  reset();
  running = true; over = false;
  A.init(); A.resume(); A.start();
  last = 0;
}
function finish(){
  running = false; over = true;
  retract();
  A.end();
  if(score > best){ best = score; try{ localStorage.setItem('ut_mole_best', String(best)); }catch(e){} }
  updateHUD();
  let chop;
  if(score >= 1200) chop = '摸得炉火纯青，今天领导压根没发现你。';
  else if(score >= 600) chop = '吃得不错，就是有点贪。';
  else if(score >= 250) chop = '摸到了几条鱼，勉强算上过班。';
  else chop = '你今天好像在认真工作。';
  const g = gen;
  setTimeout(()=>{
    if(g !== gen) return;      // 这中间已经重开了一局，别把结算糊到新局上
    $('oEmoji').textContent = lives > 0 ? '🐹' : '👀';
    $('oTitle').textContent = lives > 0 ? '摸鱼结束' : '被抓住了';
    $('oText').innerHTML = `${chop}<br>吃到 <b>${eaten}</b> 份 · 被抓 <b>${caught}</b> 次 · 放凉 <b>${missed}</b> 份 · 最高连击 <b>${bestCombo}</b><br>本局 <b>${score}</b> 分 · 最佳 <b>${best}</b> 分`;
    $('over').classList.add('show');
  }, 280);
}
function updateHUD(){
  $('score').textContent = score;
  $('combo').textContent = combo;
  $('lives').textContent = lives > 0 ? '❤'.repeat(lives) : '—';
  $('time').textContent = Math.max(0, Math.ceil(timeLeft));
  if(score > best){ best = score; try{ localStorage.setItem('ut_mole_best', String(best)); }catch(e){} }
  $('best').textContent = best;
}

/* ---------- 外卖 ---------- */
function mult(){ return Math.min(5, 1 + Math.floor(combo/5)); }
function popup(holeIdx, text, color){
  const h = geo.holes[holeIdx];
  fx.push({x: h.x, y: h.y - h.rw*1.15, text, color, life: 1});
}
function placeFoods(){
  while(foods.length < FOOD_N){
    const used = new Set(foods.map(f => f.idx));
    const free = [];
    for(let i=0;i<G*G;i++) if(!used.has(i) && i !== me.hole) free.push(i);
    if(!free.length) break;
    const i = free[(Math.random()*free.length)|0];
    foods.push({idx:i, kind:(Math.random()*FOODS.length)|0, t:0, life:FOOD_LIFE});
  }
}
function updateFoods(dt){
  for(let i=foods.length-1;i>=0;i--){
    const f = foods[i];
    f.t += dt/1000;
    if(f.t >= f.life){
      popup(f.idx, '凉了', '#9aa3b0');
      foods.splice(i,1);
      combo = 0; missed++;
      A.cold(); updateHUD();
    }
  }
  placeFoods();
}

/* ---------- 领导的视线 ---------- */
function spawnGaze(){
  const taken = new Set(gazes.map(g => g.idx));
  const free = [];
  for(let i=0;i<G*G;i++) if(!taken.has(i)) free.push(i);
  if(!free.length) return;
  const i = free[(Math.random()*free.length)|0];
  // 先黄一段当警告，再转红锁定 —— 红的时候你在那个洞里探着头就是找死
  gazes.push({idx:i, phase:'warn', t:0,
              warn: 560 + Math.random()*190,
              lock: 950 + Math.random()*900});
  A.warn();
}
function updateGazes(dt){
  gazeT -= dt;
  if(gazeT <= 0 && gazes.length < GAZE_MAX){
    spawnGaze();
    gazeT = 620 + Math.random()*820;
  }
  for(let i=gazes.length-1;i>=0;i--){
    const g = gazes[i];
    g.t += dt;
    if(g.phase === 'warn' && g.t >= g.warn){ g.phase = 'lock'; g.t = 0; A.lock(); }
    else if(g.phase === 'lock' && g.t >= g.lock) gazes.splice(i,1);
  }
}

/* ---------- 你 ---------- */
function probe(i){
  if(!running || over) return;
  if(me.hole === i) return;
  me.hole = i; me.rise = 0; me.ateThisHold = false;
  A.resume();
}
function retract(){ me.hole = -1; me.rise = 0; me.ateThisHold = false; }
function tryEat(){
  if(me.ateThisHold || me.rise < 1) return;
  const fi = foods.findIndex(f => f.idx === me.hole);
  if(fi < 0) return;
  const k = FOODS[foods[fi].kind];
  foods.splice(fi,1);
  combo++; if(combo > bestCombo) bestCombo = combo;
  eaten++;
  const m = mult();
  const gain = k.pts * m;
  score += gain;
  me.ateThisHold = true;              // 一次探头只吃一份，别一直按着狂吃
  popup(me.hole, '+' + gain + (m > 1 ? ' ×' + m : ''), m > 1 ? '#ffd36e' : '#8ef0c8');
  A.eat(m);
  placeFoods();
  updateHUD();
}
function caughtNow(){
  lives--; combo = 0; caught++; flash = 1;
  popup(me.hole, '被看见了', '#ff6b6b');
  A.caught();
  retract();
  updateHUD();
  if(lives <= 0){
    over = true;
    const g = gen;
    setTimeout(()=>{ if(g === gen) finish(); }, 300);
  }
}
function stepGame(dt){
  timeLeft -= dt/1000;
  if(timeLeft <= 0){ timeLeft = 0; finish(); return; }
  updateGazes(dt);
  updateFoods(dt);
  if(flash > 0) flash = Math.max(0, flash - dt/420);

  if(me.hole >= 0){
    me.rise = Math.min(1, me.rise + dt/RISE_MS);
    tryEat();
    if(me.rise > 0.55 && gazes.some(g => g.idx === me.hole && g.phase === 'lock')){
      caughtNow(); return;
    }
  }
  for(let i=fx.length-1;i>=0;i--){
    const f = fx[i];
    f.life -= dt/850; f.y -= dt*0.045;
    if(f.life <= 0) fx.splice(i,1);
  }
}

/* ---------- 主循环 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(60, ts - last || 16); last = ts;
  if(running && !over) stepGame(dt);
  draw();
}

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(){
  if(!geo.holes) return;                 // resize() 会先打一枪，那时还没有洞
  const size = geo.size, s = geo.s;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle = '#0c0910'; ctx.fillRect(0,0,size,size);

  // 地毯格子
  ctx.strokeStyle = 'rgba(255,138,156,.05)'; ctx.lineWidth = 1;
  for(let i=0;i<=G;i++){
    const p = size*0.06 + (size-size*0.12)/G*i;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
  }

  // 被锁定的洞先铺一层红光
  for(const g of gazes){
    if(g.phase !== 'lock') continue;
    const h = geo.holes[g.idx];
    const rg = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.rw*2.3);
    rg.addColorStop(0, 'rgba(255,70,90,.32)');
    rg.addColorStop(1, 'rgba(255,70,90,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.rw*2.3, 0, 7); ctx.fill();
  }

  // 洞（后半）
  for(const h of geo.holes){
    ctx.fillStyle = '#07050a';
    ctx.beginPath(); ctx.ellipse(h.x, h.y, h.rw, h.rh, 0, 0, 7); ctx.fill();
  }

  // 外卖和你（都裁在洞沿之上，做出「从洞里冒出来」）
  ctx.save();
  for(const f of foods){
    const h = geo.holes[f.idx];
    ctx.save();
    ctx.beginPath();
    ctx.rect(h.x - h.rw*1.4, 0, h.rw*2.8, h.y - h.rh*0.15);
    ctx.clip();
    drawFood(h, f, s);
    ctx.restore();
  }
  if(me.hole >= 0 && me.rise > 0.02){
    const h = geo.holes[me.hole];
    ctx.save();
    ctx.beginPath();
    ctx.rect(h.x - h.rw*1.4, 0, h.rw*2.8, h.y - h.rh*0.15);
    ctx.clip();
    drawMe(h, me.rise, s);
    ctx.restore();
  }
  ctx.restore();

  // 洞（前半的沿）
  for(const h of geo.holes){
    const g = ctx.createLinearGradient(h.x, h.y-h.rh, h.x, h.y+h.rh);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(.55, 'rgba(0,0,0,0)');
    g.addColorStop(.56, 'rgba(255,255,255,.07)');
    g.addColorStop(1, 'rgba(255,255,255,.02)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(h.x, h.y, h.rw, h.rh, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,138,156,.16)'; ctx.lineWidth = Math.max(1, s*1.4);
    ctx.beginPath(); ctx.ellipse(h.x, h.y, h.rw, h.rh, 0, 0, 7); ctx.stroke();
  }

  // 视线：黄虚线＝警告，红实线＝已经看见了
  for(const g of gazes){
    const h = geo.holes[g.idx];
    const lock = g.phase === 'lock';
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/(lock ? 140 : 300));
    ctx.save();
    ctx.setLineDash(lock ? [] : [Math.max(3, s*5), Math.max(3, s*4)]);
    ctx.lineWidth = Math.max(1.6, s*(lock ? 3.4 : 2.2));
    ctx.strokeStyle = lock ? `rgba(255,70,90,${(.62+pulse*.38).toFixed(3)})`
                           : `rgba(255,206,110,${(.42+pulse*.3).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(h.x, h.y, h.rw*1.3, h.rh*2.0, 0, 0, 7); ctx.stroke();
    ctx.restore();
    // 洞里那只眼睛
    ctx.globalAlpha = lock ? 1 : 0.72;
    ctx.font = `${Math.round(h.rw*0.82)}px system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lock ? '👀' : '👁', h.x, h.y);
    ctx.globalAlpha = 1;
  }

  // 探头进度环
  if(me.hole >= 0 && me.rise < 1){
    const h = geo.holes[me.hole];
    ctx.strokeStyle = 'rgba(142,240,200,.8)';
    ctx.lineWidth = Math.max(1.6, s*2.6);
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, h.rw*1.55, h.rh*2.35, 0, -Math.PI/2, -Math.PI/2 + me.rise*Math.PI*2);
    ctx.stroke();
  }

  // 飘字
  for(const f of fx){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = `800 ${Math.round(16*s)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // 倒计时条
  const bw = size*0.84, bh = Math.max(4, 6*s), bx = (size-bw)/2, by = size*0.035;
  ctx.fillStyle = 'rgba(255,255,255,.09)';
  rr(bx, by, bw, bh, bh/2); ctx.fill();
  const k = Math.max(0, timeLeft/ROUND);
  ctx.fillStyle = k > .3 ? '#8fd9ff' : '#ff7a6b';
  rr(bx, by, Math.max(bh, bw*k), bh, bh/2); ctx.fill();

  // 被抓的红闪
  if(flash > 0){
    ctx.fillStyle = `rgba(255,60,80,${(flash*0.3).toFixed(3)})`;
    ctx.fillRect(0,0,size,size);
  }

  if(!running){
    ctx.fillStyle = 'rgba(10,7,14,.74)'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#ff8a9c';
    ctx.font = `800 ${Math.round(24*s)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('按住一个洞，探出头去吃', size/2, size*0.44);
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = `600 ${Math.round(13*s)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText('红圈＝领导正在看，别探头', size/2, size*0.44 + 30*s);
    ctx.fillText('黄虚线＝快看过来了，还来得及缩回去', size/2, size*0.44 + 52*s);
  }
}
/* 外卖：浮在洞口正上方，快凉了会闪 */
function drawFood(h, f, s){
  const k = FOODS[f.kind];
  const bob = Math.sin(performance.now()/380 + f.idx)*3*s;
  const cy = h.y - h.rh*3.0 + bob;
  const left = Math.max(0, 1 - f.t/f.life);
  const blink = left < 0.34 && Math.sin(performance.now()/90) < 0;
  ctx.save();
  ctx.globalAlpha = blink ? 0.35 : 1;
  ctx.shadowColor = 'rgba(255,206,110,.8)'; ctx.shadowBlur = 13*s;
  ctx.font = `${Math.round(h.rw*1.16)}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(k.ic, h.x, cy);
  ctx.restore();
}

/* 你：一只心虚的地鼠 */
function drawMe(h, rise, s){
  const R = h.rw * 0.72;
  const cy = h.y + R - rise * R * 1.9;
  const cx = h.x;

  ctx.save();
  ctx.shadowColor = 'rgba(142,240,200,.7)'; ctx.shadowBlur = 14*s;
  const g = ctx.createLinearGradient(cx, cy-R, cx, cy+R);
  g.addColorStop(0, '#c6e0cf'); g.addColorStop(1, '#5d8471');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.restore();

  // 耳朵
  ctx.fillStyle = '#4e7361';
  for(const sgn of [-1,1]){
    ctx.beginPath(); ctx.arc(cx + sgn*R*0.66, cy - R*0.56, R*0.21, 0, 7); ctx.fill();
  }
  // 睁大眼睛（心虚）
  const eyeY = cy - R*0.30, eyeX = R*0.34, er = R*0.23;
  ctx.fillStyle = '#fff';
  for(const sgn of [-1,1]){
    ctx.beginPath(); ctx.arc(cx + sgn*eyeX, eyeY, er, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#141c18';
  for(const sgn of [-1,1]){
    ctx.beginPath(); ctx.arc(cx + sgn*eyeX, eyeY + er*0.10, er*0.5, 0, 7); ctx.fill();
  }
  // 鼻子
  ctx.fillStyle = '#ff9db4';
  ctx.beginPath(); ctx.arc(cx, cy + R*0.17, R*0.16, 0, 7); ctx.fill();
  // 胡须
  ctx.strokeStyle = 'rgba(20,28,24,.45)';
  ctx.lineWidth = Math.max(1, R*0.05);
  for(const sgn of [-1,1]){
    for(let k=0;k<2;k++){
      ctx.beginPath();
      ctx.moveTo(cx + sgn*R*0.32, cy + R*(0.12 + k*0.16));
      ctx.lineTo(cx + sgn*R*0.88, cy + R*(0.02 + k*0.24));
      ctx.stroke();
    }
  }
}

/* ---------- 交互 ---------- */
cvs.addEventListener('pointerdown', e=>{
  if($('over').classList.contains('show')) return;
  if(!running){ begin(); return; }          // 第一下是「开始」，不是探头
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * geo.size;
  const y = (e.clientY - r.top) / r.height * geo.size;
  const i = holeAt(x, y);
  if(i >= 0) probe(i);
});
// 松开就缩回去 —— 在哪松都算，免得拖出去之后一直探着头
cvs.addEventListener('pointerup', retract);
cvs.addEventListener('pointercancel', retract);
cvs.addEventListener('pointerleave', retract);
addEventListener('pointerup', retract);
addEventListener('keydown', e=>{
  if(e.key === ' '){ e.preventDefault(); if(!running) begin(); return; }
  const n = '123456789'.indexOf(e.key);
  if(n >= 0 && running){ e.preventDefault(); probe(n); }
});
addEventListener('keyup', e=>{
  if('123456789'.indexOf(e.key) >= 0) retract();
});
$('start').addEventListener('click', ()=>{ if(!running) begin(); });
$('oAgain').addEventListener('click', ()=>{ begin(); });
addEventListener('resize', resize);

/* ---------- 测试钩子 ---------- */
window.__m = {
  begin, reset, probe, retract, spawnGaze, placeFoods, stepGame, holeAt,
  step(sec){ if(running && !over) stepGame(sec*1000); },
  get score(){ return score; },
  get combo(){ return combo; },
  get lives(){ return lives; },
  get eaten(){ return eaten; },
  get caught(){ return caught; },
  get missed(){ return missed; },
  get over(){ return over; },
  get running(){ return running; },
  get me(){ return {hole:me.hole, rise:me.rise, ate:me.ateThisHold}; },
  get foods(){ return foods.map(f => f.idx); },
  get gazes(){ return gazes.map(g => g.idx + ':' + g.phase); },
  get holes(){ return geo.holes ? geo.holes.length : 0; },
  holeXY(i){
    const h = geo.holes[i], r = cvs.getBoundingClientRect();
    return {x: r.left + h.x/geo.size*r.width, y: r.top + h.y/geo.size*r.height};
  },
  putFood(i){ foods = foods.filter(f => f.idx !== i); foods.push({idx:i, kind:0, t:0, life:FOOD_LIFE}); },
  clearFoods(){ foods = []; },
  setGaze(i, phase){ gazes = [{idx:i, phase, t:0, warn:1e9, lock:1e9}]; },
  clearGazes(){ gazes = []; },
  setTime(v){ timeLeft = v; }
};

/* ---------- 启动 ---------- */
(function boot(){
  try{ best = parseInt(localStorage.getItem('ut_mole_best')||'0',10) || 0; }catch(e){ best = 0; }
  resize(); reset(); updateHUD();
  requestAnimationFrame(loop);
})();
</script>
