<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命运按钮 · THE DESTINY BUTTON</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#08080b}
  body{
    background-image:radial-gradient(900px 700px at 50% 46%, #191424 0%, #08080b 70%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:#ece7dd;display:flex;align-items:center;justify-content:center;
    transition:filter .5s ease, transform .7s cubic-bezier(.4,0,.2,1), background-color .5s;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  body.rainbow{animation:rb 2.4s linear infinite}
  @keyframes rb{to{filter:hue-rotate(360deg)}}
  body.shake{animation:sh .45s ease}
  @keyframes sh{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(6px,4px)}}
  body.flip{transform:rotate(180deg)}
  body.blurred{filter:blur(9px)}

  #fx{position:fixed;inset:0;z-index:1;pointer-events:none}

  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
  .last{
    font-size:13px;letter-spacing:.16em;color:#8f887c;min-height:20px;text-align:center;
    transition:opacity .3s
  }
  .last b{color:#ffb26b}

  #go{
    width:210px;height:210px;border-radius:50%;cursor:pointer;border:none;color:#fff;
    font:800 26px/1.35 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;
    background:radial-gradient(circle at 34% 28%, #4a2f5e, #1a1226 72%);
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.12);
    position:relative;transition:transform .12s cubic-bezier(.2,1.4,.4,1);
    animation:pulse 3.6s ease-in-out infinite;
  }
  #go::after{
    content:'';position:absolute;inset:-10px;border-radius:50%;
    border:2px dashed rgba(200,107,255,.4);animation:spin 18s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.12), 0 0 0 0 rgba(200,107,255,.4)}
    50%{box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.2), 0 0 60px 6px rgba(200,107,255,.25)}}
  #go:hover{transform:scale(1.04)}
  #go:active{transform:scale(.94)}
  .cnt{font-size:12px;letter-spacing:.22em;color:#6f6a62;font-family:ui-monospace,Consolas,monospace}

  /* 弹幕 */
  .dm{position:fixed;white-space:nowrap;z-index:4;font-size:16px;color:rgba(255,255,255,.72);
    letter-spacing:.1em;text-shadow:0 2px 12px rgba(0,0,0,.7);pointer-events:none}

  /* 弹窗 */
  .modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);z-index:6;
    width:min(420px,86vw);background:rgba(20,18,26,.96);border:1px solid rgba(255,255,255,.18);
    border-radius:18px;padding:30px 28px;text-align:center;
    box-shadow:0 40px 90px rgba(0,0,0,.7);opacity:0;pointer-events:none;
    transition:opacity .28s ease, transform .28s cubic-bezier(.2,1.3,.4,1);
  }
  .modal.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .modal .big{font-size:46px;margin-bottom:10px}
  .modal .t{font-size:19px;letter-spacing:.1em;margin-bottom:12px;color:#ffd36e}
  .modal .d{font-size:14.5px;line-height:1.9;color:#c9c3b8}
  .modal .id{font:800 26px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#a9ffe0;margin:8px 0}
  .modal button{margin-top:20px;font:inherit;font-size:13.5px;color:#ece7dd;cursor:pointer;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 22px;letter-spacing:.08em}
  .modal button:hover{background:rgba(255,180,90,.16);border-color:rgba(255,180,90,.5)}

  .clone{
    position:fixed;z-index:3;width:86px;height:86px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,.16);
    background:radial-gradient(circle at 34% 28%, #3a2a44, #171120 72%);color:#fff;
    font:700 12px/1.2 "PingFang SC",sans-serif;letter-spacing:.06em;
    animation:pop .3s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="stage" id="stage">
  <div class="last" id="last">按一下，看看会发生什么</div>
  <button id="go">命 运<br>按 钮</button>
  <div class="cnt" id="cnt">已 按 下 0 次</div>
</div>
<div id="layer"></div>

<script>
"use strict";
/* ========= 命运按钮 ========= */
const $=id=>document.getElementById(id);
const cv=$('fx'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, parts=[], pressed=0;

function fxResize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR|0; cv.height=H*DPR|0; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
/* ---- 粒子 ---- */
function addPart(p){ parts.push(p); }
function burst(x,y,n,hue){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=90+Math.random()*340;
    addPart({type:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,t:0,life:.7+Math.random()*.8,r:2+Math.random()*4,
      h: hue!=null?hue+Math.random()*60:Math.random()*360});
  }
}
function fxLoop(){
  ctx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=1/60;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    const k=1-p.t/p.life;
    if(p.type==='spark'){
      p.vy+=560/60; p.x+=p.vx/60; p.y+=p.vy/60;
      ctx.globalAlpha=k; ctx.fillStyle=`hsl(${p.h},90%,${60+12*k}%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*k,0,7); ctx.fill();
    } else if(p.type==='char'){
      p.x+=p.vx/60; p.y+=p.vy/60;
      ctx.globalAlpha=Math.min(1,k*1.7); ctx.fillStyle=`hsl(${p.h},85%,70%)`;
      ctx.font=`700 ${p.size}px "PingFang SC",sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.text, p.x, p.y);
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(fxLoop);
}

/* ---- 音效 ---- */
const A={
  ctx:null,muted:false,
  init(){ if(this.ctx)return; const C=window.AudioContext||window.webkitAudioContext; if(C)this.ctx=new C(); },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  boom(){
    if(this.muted||!this.ctx)return;
    const c=this.ctx,t=c.currentTime;
    for(let i=0;i<6;i++){
      const o=c.createOscillator(); o.type=i%2?'sine':'triangle';
      o.frequency.setValueAtTime(180+i*90,t); o.frequency.exponentialRampToValueAtTime(60+i*40,t+0.35);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.06,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.55);
    }
  }
};

/* ---- 素材 ---- */
const CHARS="的一是不了在人有我他风云山水月花雪夜灯酒梦归途行舟客愁喜悲春夏秋冬东南西北金银玉竹梅兰菊剑琴棋书画诗茶米盐酱醋锅碗手机加班摸鱼下班工资微信外卖地铁奶茶周末老板会议周五凌晨闹钟体检房租叹气";
const EMOJI=["🧱","🐟","☕","🌙","⭐","🍜","📱","💤","🎲","🌧","🍊","🐈","📎","🧋","🔥","✨","🌌","🧩"];
const DM=["这也太命运了","再来一下","按钮记得你","666","我按了 30 次了","命运不公","6","这按钮有鬼","已阅","下次一定","建议直接躺平","抽象","绷不住了","啊？"];
const ADVICE=[
  "今天不适合做任何决定。也不适合不做决定。",
  "你缺的不是机会，是起床。",
  "会过去的。什么都会过去的。包括你。",
  "别焦虑，反正你也改变不了什么。",
  "先吃饭。",
  "你已经做得很好了（这句话不要钱）。",
  "宇宙的尽头是编制。",
  "相信过程——虽然过程什么都没说。",
  "明天再说。明天不行就后天。",
  "你不是拖延，你是在等一个更好的时机。"
];
const PRIZE=[
  {e:"🏆", t:"宇宙金奖", d:"奖品：无。"},
  {e:"🥇", t:"摸鱼冠军", d:"奖品：明天的活。"},
  {e:"🎖", t:"年度好人卡", d:"你人真好，但没用。"},
  {e:"🧧", t:"神秘红包", d:"打开是空的，但心意到了。"},
  {e:"📜", t:"抽象证书", d:"兹证明你按了一个按钮。"},
  {e:"🍜", t:"一碗面", d:"虚拟的，不能吃。"}
];
const pick=a=>a[(Math.random()*a.length)|0];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---- 效果 ---- */
function say(name){ const l=$('last'); l.innerHTML='刚刚发生：<b>'+name+'</b>'; }

function evRain(){
  for(let i=0;i<70;i++) addPart({type:'char',x:Math.random()*W,y:-40-Math.random()*300,
    vx:(Math.random()-.5)*30, vy:90+Math.random()*160, t:0, life:2.2+Math.random()*1.4,
    text:CHARS[(Math.random()*CHARS.length)|0], size:14+Math.random()*20, h:170+Math.random()*120});
}
function evEmoji(){
  for(let i=0;i<34;i++) addPart({type:'char',x:Math.random()*W,y:H+40,
    vx:(Math.random()-.5)*260, vy:-(240+Math.random()*380), t:0, life:1.8+Math.random()*1,
    text:pick(EMOJI), size:22+Math.random()*24, h:Math.random()*360});
}
function evFireworks(){
  let n=0;
  const t=setInterval(()=>{
    burst(Math.random()*W*0.8+W*0.1, Math.random()*H*0.6+H*0.1, 90);
    if(++n>=4) clearInterval(t);
  }, 320);
  burst(W/2,H*0.4,120);
}
function evFlip(){
  document.body.classList.add('flip');
  setTimeout(()=>document.body.classList.remove('flip'), 2800);
}
function evShake(){
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'), 500);
}
function evRainbow(){
  document.body.classList.add('rainbow');
  setTimeout(()=>document.body.classList.remove('rainbow'), 4000);
}
function evBlur(){
  document.body.classList.add('blurred');
  setTimeout(()=>document.body.classList.remove('blurred'), 2000);
}
function evDanmaku(){
  for(let i=0;i<16;i++){
    setTimeout(()=>{
      const d=document.createElement('div');
      d.className='dm'; d.textContent=pick(DM);
      d.style.top=(6+Math.random()*80)+'%';
      d.style.left=W+'px';
      $('layer').appendChild(d);
      const w=d.offsetWidth||200;
      d.animate([{transform:'translateX(0)'},{transform:`translateX(${-(W+w+60)}px)`}],
        {duration:5000+Math.random()*3000, easing:'linear'}).onfinish=()=>d.remove();
    }, i*140);
  }
}
function modal(html, ms){
  const m=document.createElement('div');
  m.className='modal'; m.innerHTML=html;
  $('layer').appendChild(m);
  requestAnimationFrame(()=>m.classList.add('show'));
  const close=()=>{ m.classList.remove('show'); setTimeout(()=>m.remove(),300); };
  m.querySelector('[data-close]')?.addEventListener('click', close);
  if(ms) setTimeout(close, ms);
  return close;
}
function evAdvice(){
  modal(`<div class="big">🧭</div><div class="t">命运的一句忠告</div><div class="d">${pick(ADVICE)}</div><button data-close>知道了</button>`, 6000);
}
function evPrize(){
  const p=pick(PRIZE);
  modal(`<div class="big">${p.e}</div><div class="t">恭喜获得「${p.t}」</div><div class="d">${p.d}</div><button data-close>收下</button>`, 7000);
}
function evId(){
  const id='DESTINY-'+rint(1000,9999)+'-'+rint(1000,9999);
  modal(`<div class="big">🔮</div><div class="t">你的命运编号</div><div class="id">${id}</div>
    <div class="d">请记下这个编号。它没有任何用处，但你会记得它。</div><button data-close>记住了</button>`, 7000);
}
function evClone(){
  for(let i=0;i<10;i++){
    const c=document.createElement('button');
    c.className='clone'; c.textContent=pick(['按我','再按','命运','+1','嗯']);
    c.style.left=(40+Math.random()*(W-170))+'px';
    c.style.top=(60+Math.random()*(H-200))+'px';
    c.addEventListener('click', ()=>{ pressed++; sync(); burst(...(()=>{const r=c.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2,18];})()); c.remove(); });
    $('layer').appendChild(c);
    setTimeout(()=>c.remove(), 9000);
  }
}
const EVENTS=[
  {n:"一场字符雨", f:evRain},
  {n:"世界倒转", f:evFlip},
  {n:"弹幕攻击", f:evDanmaku},
  {n:"大地震", f:evShake},
  {n:"抽象烟花", f:evFireworks},
  {n:"命运的忠告", f:evAdvice},
  {n:"全屏彩虹", f:evRainbow},
  {n:"emoji 起飞", f:evEmoji},
  {n:"命运编号", f:evId},
  {n:"世界变模糊", f:evBlur},
  {n:"按钮分裂", f:evClone},
  {n:"恭喜获得", f:evPrize}
];

/* ---- 主按钮 ---- */
function sync(){ $('cnt').textContent = '已 按 下 '+pressed+' 次'; }
$('go').addEventListener('click', ()=>{
  A.init(); A.resume(); A.boom();
  pressed++; sync();
  const r=$('go').getBoundingClientRect();
  burst(r.left+r.width/2, r.top+r.height/2, 40, Math.random()*360);
  const ev = EVENTS[(Math.random()*EVENTS.length)|0];
  say(ev.n);
  setTimeout(()=>ev.f(), 140);
});
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); $('go').click(); } });

/* ---- 启动 ---- */
fxResize(); addEventListener('resize', fxResize); fxLoop(); sync();
</script>
</body>
</html>
