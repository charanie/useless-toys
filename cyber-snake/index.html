<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>今日汇报 · DAILY REPORT</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0;background:#07080b}
  body{
    background-image:radial-gradient(900px 700px at 50% 16%, #101c1a 0%, #07080b 68%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#e6ece9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:20px 16px 26px;gap:14px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }

  header{width:min(520px,90vw);display:flex;align-items:flex-end;gap:12px}
  .brand{flex:1;min-width:0}
  .brand .t{font-size:11px;letter-spacing:.4em;color:#6f7d79}
  .brand h1{margin:4px 0 0;font-size:21px;letter-spacing:.14em;color:#6ef0b8;font-weight:800}
  .brand .s{margin-top:5px;font-size:11.5px;color:#839490;letter-spacing:.06em}
  .stats{display:flex;gap:8px}
  .stat{background:rgba(18,26,24,.82);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:7px 14px;text-align:center;min-width:70px}
  .stat .k{font-size:9.5px;letter-spacing:.24em;color:#6f7d79}
  .stat .v{font:800 19px/1.3 ui-monospace,Consolas,monospace;color:#6ef0b8;font-variant-numeric:tabular-nums}
  .stat.len .v{color:#ffb26b}
  .stat.best .v{color:#8fd9ff}

  .wrap{position:relative;border-radius:18px;padding:9px;
    background:linear-gradient(160deg,#121b19,#0b1110);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 66px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    touch-action:none}
  canvas{display:block;border-radius:11px;background:#080d0c}

  .readout{width:min(520px,90vw);display:flex;gap:9px;align-items:stretch}
  .said{flex:1;min-width:0;background:rgba(18,26,24,.82);border:1px solid rgba(255,255,255,.09);
    border-radius:12px;padding:9px 14px}
  .said .k{font-size:9.5px;letter-spacing:.24em;color:#6f7d79}
  .said .v{margin-top:5px;font-size:13.5px;letter-spacing:.1em;color:#c8f2e0;min-height:19px;
    line-height:1.8;word-break:break-all}
  .said .v u{color:#6ef0b8;text-decoration:none}
  .said .v i{color:#0d1a16;background:#ffb26b;font-style:normal;border-radius:3px;padding:0 3px;font-weight:800}
  .said .v s{color:#5b6a66;text-decoration:none}

  .bar{width:min(520px,90vw);display:flex;gap:9px;align-items:center}
  button{font:inherit;font-size:12.5px;color:#e6ece9;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:10px 18px;letter-spacing:.08em;transition:.15s}
  button:hover{background:rgba(110,240,184,.15);border-color:rgba(110,240,184,.5);color:#b8ffe6}
  button.primary{background:linear-gradient(120deg,rgba(110,240,184,.28),rgba(143,217,255,.2));border-color:rgba(110,240,184,.55)}
  .bar .hint{flex:1;text-align:right;font-size:11px;color:#5f6d69;letter-spacing:.06em;line-height:1.5}

  .over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(5,8,7,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .over.show{display:flex}
  .box{width:min(420px,92vw);text-align:center;padding:30px 26px 24px;border-radius:22px;
    background:linear-gradient(180deg,rgba(20,30,28,.98),rgba(12,17,16,.98));
    border:1px solid rgba(110,240,184,.24);box-shadow:0 30px 80px rgba(0,0,0,.72)}
  .box .em{font-size:38px;line-height:1}
  .box h2{margin:13px 0 6px;font-size:20px;letter-spacing:.14em;color:#6ef0b8}
  .box p{margin:0 0 18px;font-size:12.5px;line-height:1.95;color:#94a5a0}
  .box p b{color:#ffd36e}
  .box .saidline{display:block;margin:12px 0;padding:11px 14px;border-radius:11px;
    background:rgba(110,240,184,.07);border:1px solid rgba(110,240,184,.18);
    font-size:13px;letter-spacing:.1em;color:#c8f2e0;line-height:1.8;word-break:break-all}
  .box .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  footer{font-size:11px;color:#556360;letter-spacing:.14em;text-align:center}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="t">DAILY REPORT</div>
    <h1>今日汇报</h1>
    <div class="s">照着那句话，一个字一个字念出来</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">念到</div><div class="v" id="prog">0/0</div></div>
    <div class="stat len"><div class="k">错别字</div><div class="v" id="wrong">0</div></div>
    <div class="stat best"><div class="k">最佳</div><div class="v" id="best">0</div></div>
  </div>
</header>

<div class="wrap">
  <canvas id="c" width="480" height="480"></canvas>
</div>

<div class="readout">
  <div class="said">
    <div class="k">今天要汇报的一句话</div>
    <div class="v" id="said"></div>
  </div>
</div>

<div class="bar">
  <button id="restart">重开一局</button>
  <button id="pause">暂停</button>
  <span class="hint">方向键 / WASD / 手指滑动 · 空格暂停</span>
</div>

<footer>照着上面那句话，按顺序吃掉正确的字 —— 吃错的会留在你身上当错别字<br>撞墙 ＝ 主动离职 · 咬到自己 ＝ 内耗</footer>

<div class="over" id="over">
  <div class="box">
    <div class="em" id="oEmoji">📄</div>
    <h2 id="oTitle">离职</h2>
    <p id="oText"></p>
    <div class="row">
      <button class="primary" id="oAgain">再来一局</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ========= 今日汇报 ========= */
const $ = id => document.getElementById(id);
const COLS = 16, ROWS = 16;      // 格子做大一点，字才看得清
const PELLETS = 3;               // 场上永远 1 个正确字 + 2 个干扰字

const SENTENCES = [
  '今天的会议纪要写的是明天还要开会',
  '需求在提测前一小时又变了一次',
  '我不是在摸鱼我是在思考人生',
  '这事得闭环一下不然抓手不够',
  '再改最后一版然后就下班了',
  '我已经把邮件抄送给了所有人',
  '进度条走到百分之九十九卡住了',
  '摸鱼一时爽一直摸鱼一直爽',
  '老板说简单说两句然后说了两小时',
  '这个方案我再回去对齐一下',
  '周报写得比代码还长',
  '上午的班是为了下午能继续上班',
  '把复杂留给自己把更复杂留给明天',
  '我不是针对你我是指在座的需求',
  '早八的闹钟响了七次我还是迟到了',
  '咖啡续命三杯下肚还是困',
  '这个需求我先记下来然后忘掉',
  '别催了在做了在做了目前进度零',
  '上线之前应该先加个开关',
  '我们下周一定把这个坑填了',
  '复盘一下这次复盘的复盘',
  '好的收到马上跟进稍后同步',
  '存在即合理加班即福报',
  '我的年度目标是别再定年度目标',
  '这个功能先放着以后一定用得上',
  '把简单的事情做复杂是我们的专长',
  '今天也是被工作填满的一天',
  '我先躺一会儿马上起来干活'
];
const SAYINGS = [
  '经鉴定，这是一句废话。',
  '经鉴定，这句话不适合出现在辞职信里。',
  '经鉴定，念完需要三口气。',
  '经鉴定，这就是你今年的述职材料。',
  '经鉴定，字数够了，内容为零。',
  '经鉴定，可以裱起来挂在会议室。'
];

const cvs = $('c'), ctx = cvs.getContext('2d');
let cell = 24;
let snake = [], dir = {r:0,c:1}, queue = [];
/* spoken = 你这一局真正吐出来的字（含错别字），蛇身就是它 */
let foods = [], text = '', spoken = [], correct = 0, wrong = 0, best = 0;
let running = false, paused = false, dead = false;
let stepMs = 172, acc = 0, last = 0, flash = 0;
let touchStart = null;

/* ---------- 音效 ---------- */
const A = {
  ctx:null,
  init(){ if(this.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C(); },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f, dur, type, gain, bend, delay){
    if(!this.ctx) return;
    const c=this.ctx, t0=c.currentTime+(delay||0);
    const o=c.createOscillator(); o.type=type||'sine';
    const g=c.createGain();
    o.frequency.setValueAtTime(f, t0);
    if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*bend), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.04);
  },
  eat(){ this.tone(300*Math.pow(1.03, Math.min(24, correct)), .13, 'square', .06, 1.6); this.tone(600*Math.pow(1.03, Math.min(24, correct)), .1, 'sine', .03, 1.4, .04); },
  wrong(){ this.tone(152, .17, 'sawtooth', .052, .6); this.tone(97, .21, 'square', .04, .72, .05); },
  done(){ [0,4,7,12,16].forEach((n,i)=> this.tone(392*Math.pow(2,n/12), .36, 'triangle', .075, 1, i*.085)); },
  turn(){ this.tone(160, .035, 'sine', .022, 1); },
  crash(){ [0,.1,.22,.36].forEach((d,i)=> this.tone(260*Math.pow(.75,i), .34, 'sawtooth', .07, .5, d)); }
};

/* ---------- 尺寸 ---------- */
function resize(){
  const avail = Math.min(window.innerWidth*0.9, window.innerHeight*0.56, 520);
  const size = Math.max(260, Math.floor(avail));
  cell = Math.floor(size/COLS);
  const px = cell*COLS;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = px*dpr; cvs.height = cell*ROWS*dpr;
  cvs.style.width = px+'px'; cvs.style.height = (cell*ROWS)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

/* ---------- 提词器 ---------- */
function saidNow(){
  return text.split('').map((ch,i)=>{
    if(i < correct) return `<u>${ch}</u>`;        // 已经念出来的
    if(i === correct) return `<i>${ch}</i>`;      // 下一个要念的
    return `<s>${ch}</s>`;                        // 还没念到
  }).join('');
}
/* 干扰字：从别的句子里抽，但绝不能长得跟「下一个正确字」一样 */
function decoyChar(){
  const need = text[correct];
  for(let i=0;i<60;i++){
    const s = SENTENCES[(Math.random()*SENTENCES.length)|0];
    const ch = s[(Math.random()*s.length)|0];
    if(ch !== need) return ch;
  }
  return need === '吧' ? '呢' : '吧';
}
function freeCell(){
  const free = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(snake.some(s=>s.r===r&&s.c===c)) continue;
    if(foods.some(f=>f.r===r&&f.c===c)) continue;
    free.push({r,c});
  }
  return free.length ? free[(Math.random()*free.length)|0] : null;
}
function placeFoods(){
  foods = foods.filter(f => !snake.some(s => s.r===f.r && s.c===f.c));
  const need = text[correct];
  if(need === undefined){ foods = []; return; }
  // 场上必须正好有一个「正确字」——上一个被吃掉后就补一个
  if(!foods.some(f => f.ch === need)){
    if(foods.length >= PELLETS) foods.pop();
    const p = freeCell();
    if(p) foods.push({r:p.r, c:p.c, ch:need});
  }
  while(foods.length < PELLETS){
    const p = freeCell();
    if(!p) break;
    foods.push({r:p.r, c:p.c, ch:decoyChar()});
  }
}

/* ---------- 开局 ---------- */
function reset(){
  text = SENTENCES[(Math.random()*SENTENCES.length)|0];
  const mr = Math.floor(ROWS/2), mc = Math.floor(COLS/2);
  snake = [{r:mr,c:mc},{r:mr,c:mc-1},{r:mr,c:mc-2}];
  dir = {r:0,c:1}; queue = [];
  spoken = []; correct = 0; wrong = 0; foods = [];
  stepMs = 172; acc = 0; dead = false; flash = 0;
  paused = false; running = false;
  $('over').classList.remove('show');
  $('pause').textContent = '暂停';
  placeFoods();
  updateHUD();
  draw();
}
function updateHUD(){
  $('prog').textContent = correct + '/' + text.length;
  $('wrong').textContent = wrong;
  if(correct > best){ best = correct; try{ localStorage.setItem('ut_snake_best', String(best)); }catch(e){} }
  $('best').textContent = best;
  $('said').innerHTML = saidNow();
}

/* ---------- 一步 ---------- */
function tick(){
  if(queue.length){
    const nd = queue.shift();
    if(nd.r !== -dir.r || nd.c !== -dir.c) dir = nd;
  }
  const head = {r:snake[0].r + dir.r, c:snake[0].c + dir.c};

  if(head.r < 0 || head.r >= ROWS || head.c < 0 || head.c >= COLS){ return die('墙', '💼', '主动离职'); }
  // 内耗：撞到自己（尾巴那一格下一步会移开，宽容处理）
  for(let i=0;i<snake.length-1;i++){
    if(snake[i].r===head.r && snake[i].c===head.c){ return die('自己', '🪞', '内耗'); }
  }

  snake.unshift(head);
  const hit = foods.findIndex(f => f.r===head.r && f.c===head.c);
  if(hit >= 0){
    const f = foods[hit];
    foods.splice(hit, 1);
    if(f.ch === text[correct]){
      spoken.push({ch:f.ch, ok:true});
      correct++;
      A.resume(); A.eat();
      if(correct >= text.length){ updateHUD(); return win(); }
    } else {
      // 错别字：念错的字也一样长在你身上，既占地方又让你更长更快
      spoken.push({ch:f.ch, ok:false});
      wrong++;
      A.resume(); A.wrong();
    }
    stepMs = Math.max(76, 172 - spoken.length*3);
  } else {
    snake.pop();
  }
  // 每一格都重摆一次：身体爬过去会把字压在底下，压在底下就既看不见也吃不到
  placeFoods();
  if(hit >= 0) updateHUD();
}
function die(what, emoji, title){
  running = false; dead = true; flash = 1;
  A.crash();
  const spokenLine = spoken.map(e => e.ch).join('') || '（一个字都没来得及说）';
  setTimeout(()=>{
    $('oEmoji').textContent = emoji;
    $('oTitle').textContent = title;
    $('oText').innerHTML =
      (what==='墙' ? '你撞墙了，相当于主动离职。' : '你咬到了自己 —— 典型的资源内耗。') +
      `<br>汇报才念到「<b>${text.slice(0, correct) || '…'}</b>」，后面没说完。` +
      `<span class="saidline">${spokenLine}</span>` +
      `${SAYINGS[(Math.random()*SAYINGS.length)|0]}<br>念对 <b>${correct}</b> 个字 · 错别字 <b>${wrong}</b> 个 · 最佳 <b>${best}</b>`;
    $('over').classList.add('show');
  }, 240);
  updateHUD();
}
function win(){
  running = false; dead = true;
  A.resume(); A.done();
  $('oEmoji').textContent = '✅';
  $('oTitle').textContent = '汇报完毕';
  $('oText').innerHTML =
    `整句话一个字不差地念完了，今天可以早点走。` +
    `<span class="saidline">${text}</span>` +
    `错别字 <b>${wrong}</b> 个 · 最佳 <b>${best}</b> 个字`;
  $('over').classList.add('show');
  updateHUD();
}

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  r = Math.min(r, w/2, h/2);
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(){
  if(!text) return;                 // boot() 里 resize() 会先打一枪，那时还没发牌
  const W = cell*COLS, H = cell*ROWS;
  ctx.clearRect(0,0,W,H);

  // 地板
  ctx.fillStyle = '#080d0c'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(110,240,184,.055)'; ctx.lineWidth = 1;
  for(let i=1;i<COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*cell+.5, 0); ctx.lineTo(i*cell+.5, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*cell+.5); ctx.lineTo(W, i*cell+.5); ctx.stroke();
  }
  // 边框
  ctx.strokeStyle = 'rgba(110,240,184,.22)'; ctx.lineWidth = 2;
  ctx.strokeRect(1,1,W-2,H-2);

  // 待吃的字（每个都长得一模一样 —— 哪个是对的，只能靠你自己读提词器）
  for(const f of foods){
    const x = f.c*cell, y = f.r*cell;
    // 三个字一起呼吸：错开相位的话，最亮那个会被误当成「这就是答案」
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/260);
    ctx.save();
    ctx.shadowColor = 'rgba(255,178,107,.85)'; ctx.shadowBlur = 8 + pulse*9;
    ctx.fillStyle = '#ffb26b';
    rr(x+cell*0.1, y+cell*0.1, cell*0.8, cell*0.8, cell*0.24); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#3a2408';
    ctx.font = `800 ${Math.round(cell*0.46)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.ch, x+cell/2, y+cell/2+0.5);
  }

  // 蛇身 —— 每一节都是你真正吐出来的字；头在最后，所以从尾读到头
  const n = snake.length;
  for(let i=n-1;i>=0;i--){
    const s = snake[i];
    const k = n>1 ? i/(n-1) : 0;
    const e = i < spoken.length ? spoken[spoken.length-1-i] : null;
    const bad = !!(e && !e.ok);
    const hue = bad ? 352 : 158 + k*72;
    const x = s.c*cell, y = s.r*cell;
    const shrink = i===0 ? 0.03 : 0.11;
    ctx.save();
    if(i===0){ ctx.shadowColor = bad ? 'rgba(255,110,110,.85)' : 'rgba(110,240,184,.85)'; ctx.shadowBlur = 14; }
    ctx.fillStyle = i===0 ? (bad ? '#ffc2c2' : '#9dffd4') : `hsl(${hue},58%,${52-k*10}%)`;
    rr(x+cell*shrink, y+cell*shrink, cell*(1-shrink*2), cell*(1-shrink*2), cell*0.24);
    ctx.fill();
    ctx.restore();

    // 身上的字（错别字是红的）
    if(e){
      ctx.fillStyle = e.ok ? (i===0 ? '#06231a' : 'rgba(6,20,16,.82)') : '#5c0f18';
      ctx.font = `800 ${Math.round(cell*(i===0?0.56:0.52))}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(e.ch, x+cell/2, y+cell/2+0.5);
    }
    // 眼睛
    if(i===0){
      const cx = x+cell/2, cy = y+cell/2;
      const ox = dir.c*cell*0.17, oy = dir.r*cell*0.17;
      const px = -dir.r*cell*0.16, py = dir.c*cell*0.16;
      ctx.fillStyle = '#062018';
      for(const s2 of [1,-1]){
        ctx.beginPath();
        ctx.arc(cx+ox+px*s2, cy+oy+py*s2, cell*0.075, 0, 7);
        ctx.fill();
      }
    }
  }

  // 死亡闪红
  if(flash > 0){
    ctx.fillStyle = `rgba(255,80,80,${flash*0.35})`;
    ctx.fillRect(0,0,W,H);
  }
  // 未开始
  if(!running && !dead){
    ctx.fillStyle = 'rgba(6,12,10,.62)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#6ef0b8';
    ctx.font = `800 ${Math.round(cell*0.78)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('按方向键开始', W/2, H/2);
  }
  if(paused && running){
    ctx.fillStyle = 'rgba(6,12,10,.62)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#8fd9ff';
    ctx.font = `800 ${Math.round(cell*0.78)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('已暂停', W/2, H/2);
  }
}

/* ---------- 主循环 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(80, ts - last || 16); last = ts;
  if(flash > 0) flash = Math.max(0, flash - dt/500);
  if(running && !paused && !dead){
    acc += dt;
    let guard = 0;
    while(acc >= stepMs && guard++ < 6){ acc -= stepMs; tick(); if(dead) break; }
  } else {
    acc = 0;
  }
  draw();
}

/* ---------- 交互 ---------- */
function turn(r,c){
  if(dead) return;
  if(!running){ running = true; A.init(); A.resume(); }
  A.resume();
  const lastDir = queue.length ? queue[queue.length-1] : dir;
  if((r === -lastDir.r && c === -lastDir.c) || (r === lastDir.r && c === lastDir.c)) return;
  if(queue.length < 2){ queue.push({r,c}); A.turn(); }
}
const KEYS = {
  ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1],
  w:[-1,0], s:[1,0], a:[0,-1], d:[0,1], W:[-1,0], S:[1,0], A:[0,-1], D:[0,1]
};
addEventListener('keydown', e=>{
  if(e.key===' '){ e.preventDefault(); togglePause(); return; }
  const k = KEYS[e.key];
  if(!k) return;
  e.preventDefault();
  turn(k[0], k[1]);
});
function togglePause(){
  if(dead) return;
  if(!running){ running = true; A.init(); A.resume(); return; }
  paused = !paused;
  $('pause').textContent = paused ? '继续' : '暂停';
}
cvs.addEventListener('pointerdown', e=>{ touchStart = {x:e.clientX, y:e.clientY}; });
cvs.addEventListener('pointerup', e=>{
  if(!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  touchStart = null;
  if(Math.max(Math.abs(dx),Math.abs(dy)) < 18){ togglePause(); return; }
  if(Math.abs(dx) > Math.abs(dy)) turn(0, dx>0?1:-1); else turn(dy>0?1:-1, 0);
});
$('pause').addEventListener('click', togglePause);
$('restart').addEventListener('click', ()=>{ A.init(); A.resume(); reset(); });
$('oAgain').addEventListener('click', ()=>{ A.init(); A.resume(); reset(); });
addEventListener('resize', resize);

/* ---------- 测试钩子 ---------- */
window.__s = {
  get text(){ return text; },
  get correct(){ return correct; },
  get wrong(){ return wrong; },
  get spoken(){ return spoken.map(e => e.ch + (e.ok ? '' : '✗')); },
  get snake(){ return snake.length; },
  get foods(){ return foods.map(f => f.r + ',' + f.c + ':' + f.ch); },
  get dead(){ return dead; },
  get running(){ return running; },
  get cols(){ return COLS; },
  get rows(){ return ROWS; },
  need(){ return text[correct]; },
  cells(){ return snake.map(p => p.r + ',' + p.c); },
  head(){ return {r:snake[0].r, c:snake[0].c}; },
  dirNow(){ return {r:dir.r, c:dir.c}; },
  setText(t){ text = t; correct = 0; spoken = []; wrong = 0; foods = []; placeFoods(); updateHUD(); draw(); },
  reset, placeFoods, tick,
  /* 把「下一个正确字」喂到嘴边：只为自动化回归用 */
  putNextAhead(){
    const h = snake[0], d = dir;
    const t = {r: h.r + d.r, c: h.c + d.c};
    if(t.r<0||t.r>=ROWS||t.c<0||t.c>=COLS) return null;
    foods = foods.filter(f => !(f.r===t.r && f.c===t.c));
    const p = freeCell();
    if(p) foods.push({r:p.r, c:p.c, ch: decoyChar()});
    foods.push({r:t.r, c:t.c, ch: text[correct]});
    return t;
  },
  putAt(r, c, ch){ foods = foods.filter(f => !(f.r===r && f.c===c)); foods.push({r, c, ch}); },
  setDir(r, c){ dir = {r, c}; queue = []; },
  start(){ running = true; }
};

/* ---------- 启动 ---------- */
(function boot(){
  try{ best = parseInt(localStorage.getItem('ut_snake_best')||'0',10) || 0; }catch(e){ best = 0; }
  reset(); resize(); requestAnimationFrame(loop);
})();
</script>
