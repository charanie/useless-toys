<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽象画板 · ABSTRACT PAINT</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0d}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#ece7dd;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;background:#0d0d12}
  .ui{position:fixed;z-index:3;pointer-events:none}
  .ui button,.ui input{pointer-events:auto}

  .top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;gap:12px}
  .title{font-size:13px;letter-spacing:.3em;color:#8f887c;text-transform:uppercase;padding-top:10px}
  .title b{color:#ff8a5c;letter-spacing:.14em}

  .bar{bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;padding:0 14px 20px;max-width:100%}
  button{
    font:inherit;font-size:13px;color:#ece7dd;cursor:pointer;white-space:nowrap;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    border-radius:999px;padding:10px 17px;letter-spacing:.06em;transition:.15s;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  button:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);transform:translateY(-1px)}
  button:active{transform:translateY(1px)}
  button.hot{background:linear-gradient(120deg,rgba(255,138,92,.3),rgba(200,107,255,.25));border-color:rgba(255,138,92,.6);color:#ffd9c4}
  button:disabled{opacity:.35;cursor:default;transform:none}

  .swatches{display:flex;gap:6px;align-items:center}
  .sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
  .sw:hover{transform:scale(1.15)}
  .sw.on{border-color:#fff;transform:scale(1.15)}
  .sw.rainbow{background:conic-gradient(#ff6a45,#ffd93d,#3fd06a,#5fd8ff,#c86bff,#ff6a45)}

  .palette{top:50%;left:18px;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;padding:12px 10px;
    background:rgba(20,20,26,.65);border:1px solid rgba(255,255,255,.1);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .palette .sw{width:26px;height:26px}
  .size{display:flex;flex-direction:column;align-items:center;gap:4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:26px;height:120px;writing-mode:vertical-lr;direction:rtl;
    background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{width:6px;border-radius:9px;background:rgba(255,255,255,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ff8a5c;
    margin-left:-6px;box-shadow:0 0 10px rgba(255,138,92,.6)}

  .toast{
    position:fixed;left:50%;top:76px;transform:translate(-50%,-10px);z-index:4;pointer-events:none;
    background:rgba(20,20,26,.94);border:1px solid rgba(255,255,255,.18);border-radius:12px;
    padding:10px 18px;font-size:14px;letter-spacing:.08em;box-shadow:0 16px 40px rgba(0,0,0,.6);
    opacity:0;transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.3,.4,1);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast b{color:#ffd36e}
  .hint{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);font-size:11.5px;color:#6f6a62;letter-spacing:.16em;z-index:2;transition:opacity .6s}
  .hint.hide{opacity:0}
  @media (max-width:620px){ .palette{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui top">
  <div class="title">抽象画板 · <b>ABSTRACT PAINT</b></div>
</div>

<div class="ui palette">
  <div class="swatches" style="flex-direction:column;gap:9px">
    <div class="sw rainbow on" data-col="rainbow" title="彩虹"></div>
    <div class="sw" data-col="#ff6a45" style="background:#ff6a45"></div>
    <div class="sw" data-col="#ffd93d" style="background:#ffd93d"></div>
    <div class="sw" data-col="#3fd06a" style="background:#3fd06a"></div>
    <div class="sw" data-col="#5fd8ff" style="background:#5fd8ff"></div>
    <div class="sw" data-col="#c86bff" style="background:#c86bff"></div>
    <div class="sw" data-col="#ffffff" style="background:#fff"></div>
  </div>
  <div class="size"><input type="range" id="size" min="2" max="80" value="18"></div>
</div>

<div class="ui bar">
  <button id="abstract" class="hot">🎲 抽象化</button>
  <button id="undo">↶ 撤销</button>
  <button id="clear">清空</button>
  <button id="save">保存 PNG</button>
</div>
<div class="hint" id="hint">随便画点什么，然后按「抽象化」</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ========= 抽象画板 ========= */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d', {willReadFrequently:true});
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
function resize(){
  const old = W ? ctx.getImageData(0,0,cvs.width,cvs.height) : null;
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cvs.width=W*DPR|0; cvs.height=H*DPR|0;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0d0d12'; ctx.fillRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(old){ try{ ctx.putImageData(old,0,0); }catch(e){} }
}
addEventListener('resize', resize);

/* ---- 状态 ---- */
let color='rainbow', size=18, drawing=false, lastP=null, hue=0;
const history=[];
function snap(){
  try{ history.push(ctx.getImageData(0,0,cvs.width,cvs.height)); }catch(e){}
  if(history.length>5) history.shift();
  $('undo').disabled = history.length===0;
}
function restore(){
  const d=history.pop();
  if(d) ctx.putImageData(d,0,0);
  $('undo').disabled = history.length===0;
}
function curColor(){
  if(color==='rainbow'){ hue=(hue+3.2)%360; return `hsl(${hue},90%,62%)`; }
  return color;
}

/* ---- 绘制 ---- */
const pts=[];
function pos(e){ const r=cvs.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
function down(e){
  cvs.setPointerCapture?.(e.pointerId);
  drawing=true; lastP=pos(e);
  pts.length=0; pts.push({...lastP});
  hideHint();
  /* 点一下也画一个点 */
  const c=curColor();
  ctx.fillStyle=c;
  ctx.beginPath(); ctx.arc(lastP.x,lastP.y,size*0.42,0,7); ctx.fill();
}
function move(e){
  if(!drawing) return;
  const p=pos(e);
  const c=curColor();
  ctx.save();
  ctx.strokeStyle=c; ctx.lineWidth=size;
  ctx.shadowColor=c; ctx.shadowBlur=size*0.7;
  ctx.beginPath(); ctx.moveTo(lastP.x,lastP.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  ctx.restore();
  /* 飞白/颗粒 */
  for(let i=0;i<Math.min(6, size/6);i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*size*0.7;
    ctx.globalAlpha=0.18+Math.random()*0.3;
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(p.x+Math.cos(a)*r, p.y+Math.sin(a)*r, 0.8+Math.random()*1.8, 0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  lastP=p; pts.push({...p});
  if(pts.length>500) pts.shift();
}
function up(){ if(drawing){ drawing=false; snap(); } }
cvs.addEventListener('pointerdown', down);
cvs.addEventListener('pointermove', move);
addEventListener('pointerup', up);
addEventListener('pointercancel', up);
function hideHint(){ $('hint').classList.add('hide'); }
setTimeout(hideHint, 12000);

/* ---- 抽象化 ---- */
const MORPHS=[
  {n:"左右镜像", f:()=>{
    const half=Math.floor(W/2);
    const src=ctx.getImageData(0,0,half*DPR,cvs.height);
    ctx.save(); ctx.scale(-1,1); ctx.translate(-W,0);
    ctx.drawImage(cvs, 0,0, half*DPR, cvs.height, -W,0, half, H);
    ctx.restore();
  }},
  {n:"上下镜像", f:()=>{
    const half=Math.floor(H/2);
    ctx.save(); ctx.scale(1,-1); ctx.translate(0,-H);
    ctx.drawImage(cvs, 0,0, cvs.width, half*DPR, 0,-H, W, half);
    ctx.restore();
  }},
  {n:"万花筒", f:()=>{
    const q=ctx.getImageData(0,0,Math.max(1,Math.floor(W/2*DPR)),Math.max(1,Math.floor(H/2*DPR)));
    const tmp=document.createElement('canvas'); tmp.width=q.width; tmp.height=q.height;
    tmp.getContext('2d').putImageData(q,0,0);
    ctx.save();
    ctx.drawImage(tmp, 0,0,W/2,H/2);
    ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(tmp, 0,0,W/2,H/2);
    ctx.restore();
    ctx.save();
    ctx.translate(0,H); ctx.scale(1,-1);
    ctx.drawImage(cvs, 0,0,cvs.width,Math.floor(H/2*DPR), 0,0,W,H/2);
    ctx.restore();
  }},
  {n:"故障切片", f:()=>{
    for(let i=0;i<26;i++){
      const y=Math.random()*cvs.height, hh=(4+Math.random()*40)*DPR;
      const dx=(Math.random()-0.5)*140*DPR;
      ctx.drawImage(cvs, 0,y,cvs.width,hh, dx,y,cvs.width,hh);
    }
    for(let i=0;i<3;i++){
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=0.16;
      ctx.drawImage(cvs, (Math.random()-0.5)*18, (Math.random()-0.5)*18);
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
  }},
  {n:"180° 倒转", f:()=>{
    const t=document.createElement('canvas'); t.width=cvs.width; t.height=cvs.height;
    t.getContext('2d').drawImage(cvs,0,0);
    ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(Math.PI); ctx.drawImage(t, -W/2, -H/2, W, H); ctx.restore();
  }},
  {n:"色块化", f:()=>{
    const block=Math.max(6,Math.round(14+Math.random()*30));
    const t=document.createElement('canvas'); t.width=cvs.width; t.height=cvs.height;
    const tc=t.getContext('2d');
    tc.imageSmoothingEnabled=false;
    tc.drawImage(cvs, 0,0, Math.max(1,cvs.width/block|0), Math.max(1,cvs.height/block|0));
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(t, 0,0, Math.max(1,cvs.width/block|0), Math.max(1,cvs.height/block|0), 0,0, W,H);
    ctx.imageSmoothingEnabled=true;
  }},
  {n:"反色", f:()=>{
    ctx.save(); ctx.globalCompositeOperation='difference';
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore();
  }},
  {n:"拖影", f:()=>{
    for(let i=1;i<=6;i++){
      ctx.save(); ctx.globalAlpha=0.16; ctx.drawImage(cvs, i*7, i*5); ctx.restore();
    }
  }},
  {n:"四方复制", f:()=>{
    const t=document.createElement('canvas'); t.width=cvs.width; t.height=cvs.height;
    t.getContext('2d').drawImage(cvs,0,0);
    ctx.drawImage(t, 0,0, cvs.width, cvs.height, 0,0, W/2,H/2);
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(t,0,0,cvs.width,cvs.height,0,0,W/2,H/2); ctx.restore();
    ctx.save(); ctx.translate(0,H); ctx.scale(1,-1); ctx.drawImage(t,0,0,cvs.width,cvs.height,0,0,W/2,H/2); ctx.restore();
    ctx.save(); ctx.translate(W,H); ctx.scale(-1,-1); ctx.drawImage(t,0,0,cvs.width,cvs.height,0,0,W/2,H/2); ctx.restore();
  }}
];
let lastMorph=-1, morphCount=0;
$('abstract').addEventListener('click', ()=>{
  snap();
  let i; do { i=(Math.random()*MORPHS.length)|0; } while(i===lastMorph && MORPHS.length>1);
  lastMorph=i; morphCount++;
  const m=MORPHS[i];
  try{ m.f(); }catch(e){}
  toast(m.n);
  if(morphCount===1) $('hint').textContent='再按一次，它会继续变形';
});
function toast(txt){
  const t=$('toast');
  t.innerHTML = '抽象化 · <b>'+txt+'</b>';
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---- 按钮 ---- */
$('undo').disabled=true;
$('undo').addEventListener('click', restore);
$('clear').addEventListener('click', ()=>{ snap(); ctx.fillStyle='#0d0d12'; ctx.fillRect(0,0,W,H); });
$('save').addEventListener('click', ()=>{
  const a=document.createElement('a');
  a.download='抽象作品-'+Date.now()+'.png';
  a.href=cvs.toDataURL('image/png'); a.click();
});
$('size').addEventListener('input', e=>{ size=+e.target.value; });
document.querySelectorAll('.sw').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
    sw.classList.add('on'); color=sw.dataset.col;
  });
});

/* ---- 启动 ---- */
resize();
</script>
</body>
</html>
