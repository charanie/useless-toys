<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>需求变更 · SCOPE CREEP</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0;background:#08070c}
  body{
    background-image:radial-gradient(900px 700px at 50% 12%, #141c2c 0%, #08070c 68%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#e8eef6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:18px 14px 24px;gap:13px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }

  header{width:min(620px,94vw);display:flex;align-items:flex-end;gap:12px}
  .brand{flex:1;min-width:0}
  .brand .t{font-size:11px;letter-spacing:.4em;color:#6f7b8c}
  .brand h1{margin:4px 0 0;font-size:21px;letter-spacing:.14em;color:#6ec8ff;font-weight:800}
  .brand .s{margin-top:5px;font-size:11.5px;color:#8492a4}
  .stats{display:flex;gap:7px}
  .stat{background:rgba(20,28,42,.84);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:6px 13px;text-align:center;min-width:62px}
  .stat .k{font-size:9.5px;letter-spacing:.22em;color:#6f7b8c}
  .stat .v{font:800 18px/1.3 ui-monospace,Consolas,monospace;color:#6ec8ff;font-variant-numeric:tabular-nums}
  .stat.mv .v{color:#ffd36e}
  .stat.best .v{color:#8ef0c8;font-size:15px}
  .stat.ch .v{color:#ff9d6b}
  /* 需求变更：整块板子抖一下，顶上飘一句 */
  @keyframes reqshake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}
    38%{transform:translateX(7px)}58%{transform:translateX(-5px)}78%{transform:translateX(5px)}}
  .board.shake{animation:reqshake .42s ease-out}
  .toast{position:fixed;left:50%;top:21%;transform:translateX(-50%);z-index:6;
    padding:9px 20px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .22s;
    background:linear-gradient(120deg,rgba(255,116,90,.95),rgba(255,186,86,.95));
    color:#2a1200;font:800 13px/1 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.1em;
    box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1}

  .board{display:grid;gap:8px;touch-action:manipulation}
  .card{perspective:700px;cursor:pointer;background:none;border:none;padding:0}
  .card .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .34s cubic-bezier(.3,.9,.4,1)}
  .card.open .inner{transform:rotateY(180deg)}
  .card.gone{opacity:0;transform:scale(.82);transition:opacity .3s, transform .3s;pointer-events:none}
  .face{position:absolute;inset:0;border-radius:11px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .back{background:linear-gradient(160deg,#243248,#161f2e);border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font-size:16px;color:rgba(110,200,255,.5)}
  .card:hover .back{border-color:rgba(110,200,255,.45)}
  .front{transform:rotateY(180deg);background:linear-gradient(160deg,#1b3348,#12212f);
    border:1px solid rgba(110,200,255,.4);box-shadow:0 0 16px rgba(110,200,255,.2)}
  .front .e{font-size:clamp(16px,4.4vw,26px);line-height:1}
  .front .w{font-size:clamp(8px,1.7vw,11px);letter-spacing:.06em;color:#9fc4de;white-space:nowrap}

  .bar{width:min(620px,94vw);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-size:12.5px;color:#e8eef6;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:9px 16px;letter-spacing:.08em;transition:.15s}
  button.b:hover{background:rgba(110,200,255,.15);border-color:rgba(110,200,255,.5);color:#cfeaff}
  button.b.primary{background:linear-gradient(120deg,rgba(110,200,255,.3),rgba(142,240,200,.2));border-color:rgba(110,200,255,.55)}
  button.b.on{background:linear-gradient(160deg,rgba(110,200,255,.3),rgba(110,200,255,.12));border-color:rgba(110,200,255,.6);color:#d6f2ff}
  .grp{display:flex;gap:5px;align-items:center}
  .grp .lb{font-size:10px;letter-spacing:.2em;color:#6f7b8c;margin-right:2px}
  .hint{flex:1;text-align:right;font-size:11px;color:#67748a;letter-spacing:.06em;line-height:1.6}
  footer{font-size:11px;color:#57647a;letter-spacing:.14em;text-align:center;line-height:1.9}

  .over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(5,7,11,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .over.show{display:flex}
  .box{width:min(400px,92vw);text-align:center;padding:30px 26px 24px;border-radius:22px;
    background:linear-gradient(180deg,rgba(24,32,46,.98),rgba(13,17,23,.98));
    border:1px solid rgba(110,200,255,.24);box-shadow:0 30px 80px rgba(0,0,0,.72)}
  .box .em{font-size:38px;line-height:1}
  .box h2{margin:13px 0 6px;font-size:20px;letter-spacing:.14em;color:#6ec8ff}
  .box p{margin:0 0 18px;font-size:12.5px;line-height:1.95;color:#93a2b6}
  .box p b{color:#ffd36e}
  .box .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="t">SCOPE CREEP</div>
    <h1>需求变更</h1>
    <div class="s">把成对的打工人黑话翻出来 —— 但你记住的会不算数</div>
  </div>
  <div class="stats">
    <div class="stat mv"><div class="k">步数</div><div class="v" id="moves">0</div></div>
    <div class="stat ch"><div class="k">变更</div><div class="v" id="changes">0</div></div>
    <div class="stat"><div class="k">用时</div><div class="v" id="time">0.0</div></div>
    <div class="stat best"><div class="k">最好</div><div class="v" id="best">—</div></div>
  </div>
</header>

<div class="board" id="board"></div>
<div class="toast" id="toast">需求变更</div>

<div class="bar">
  <button class="b primary" id="restart">重开一局</button>
  <div class="grp"><span class="lb">难度</span>
    <button class="b" data-lv="4">4×4</button>
    <button class="b on" data-lv="6">4×6</button>
    <button class="b" data-lv="8">6×6</button>
  </div>
  <span class="hint">翻两张，成对就消掉<br><b style="color:#ff9d6b">每消掉一对，剩下的牌全部重新洗牌</b></span>
</div>

<footer><b>需求变更</b>：每配对成功一对，还没消掉的牌就整体重排一次 —— 你刚背下来的位置，立刻作废<br>
全部消完就算今天没白来 · 步数越少越好，但这一关考的不是记性，是心态</footer>

<div class="over" id="over">
  <div class="box">
    <div class="em" id="oEmoji">🎉</div>
    <h2 id="oTitle">全消完了</h2>
    <p id="oText"></p>
    <div class="row"><button class="b primary" id="oAgain">再来一局</button></div>
  </div>
</div>

<script>
"use strict";
/* ========= 抽象记忆 · 翻牌配对 ========= */
const $ = id => document.getElementById(id);

const FACES = [
  ['🐟','摸鱼'], ['🧱','搬砖'], ['☕','续命'], ['🌙','加班'],
  ['💰','发薪'], ['🏖','放假'], ['📋','需求'], ['📅','会议'],
  ['⚡','加塞'], ['👔','领导'], ['🍜','外卖'], ['🛏','午睡'],
  ['🎧','戴耳机'], ['🖨','打印'], ['🧾','报销'], ['📊','周报'],
  ['🔔','催进度'], ['🚇','通勤']
];
/* 难度 = 列数（行数按总数推），值就是总格子数 */
const LEVELS = { 4:{cols:4, rows:4, name:'4×4'}, 6:{cols:4, rows:6, name:'4×6'}, 8:{cols:6, rows:6, name:'6×6'} };

let lv = LEVELS[6];
let deck = [], first = null, lock = false, moves = 0, left = 0;
let t0 = 0, timer = null, started = false, best = {};
let els = [], changes = 0, toastT = null;

function build(){
  const total = lv.cols * lv.rows;
  const pairs = total / 2;
  const pool = FACES.slice();
  // 洗牌取 pairs 种
  for(let i=pool.length-1;i>0;i--){ const j = (Math.random()*(i+1))|0; [pool[i],pool[j]] = [pool[j],pool[i]]; }
  deck = [];
  for(let i=0;i<pairs;i++){ deck.push(pool[i]); deck.push(pool[i]); }
  for(let i=deck.length-1;i>0;i--){ const j = (Math.random()*(i+1))|0; [deck[i],deck[j]] = [deck[j],deck[i]]; }

  first = null; lock = false; moves = 0; left = pairs; changes = 0;
  els = [];
  started = false; clearInterval(timer); timer = null;
  $('time').textContent = '0.0';
  $('over').classList.remove('show');
  updateHUD();

  const board = $('board');
  board.style.gridTemplateColumns = `repeat(${lv.cols}, var(--cs))`;
  board.innerHTML = '';
  const size = Math.min(window.innerWidth - 44, 620);
  const cs = Math.floor(Math.min((size - (lv.cols-1)*8) / lv.cols, 92));
  board.style.setProperty('--cs', cs + 'px');
  board.style.gridAutoRows = cs + 'px';

  deck.forEach((f, i)=>{
    const b = document.createElement('button');
    b.className = 'card'; b.dataset.i = i;
    b.innerHTML = `<div class="inner">
        <div class="face back">?</div>
        <div class="face front"><span class="e">${f[0]}</span><span class="w">${f[1]}</span></div>
      </div>`;
    b.addEventListener('click', ()=> flip(i, b));
    board.appendChild(b);
    els.push(b);
  });
}
/* 把还没消掉的牌整体重排一遍：成对关系不变，位置全变。
   这就是「需求变更」—— 你刚背下来的东西，一秒后就不算数了。 */
function reshuffle(){
  const slots = [];
  for(let i=0;i<deck.length;i++) if(!els[i].classList.contains('gone')) slots.push(i);
  if(slots.length < 4) return false;
  const before = slots.map(i => deck[i].join(''));
  const faces = slots.map(i => deck[i]);
  for(let i=faces.length-1;i>0;i--){ const j = (Math.random()*(i+1))|0; [faces[i],faces[j]] = [faces[j],faces[i]]; }
  slots.forEach((slot, k)=>{ deck[slot] = faces[k]; paintFront(slot); });
  changes++;
  // 还开着的牌（理论上这时候没有）收回去，别让人白记
  for(const i of slots){
    if(first && first.i === i){ first = null; }
    els[i].classList.remove('open');
  }
  const board = $('board');
  board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
  const tt = $('toast');
  tt.textContent = '需求变更 · 位置全变了';
  tt.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=> tt.classList.remove('show'), 1100);
  beep(300, 0.16, 0.04, 1.6);
  updateHUD();
  return before.join('') !== slots.map(i => deck[i].join('')).join('');
}
function paintFront(i){
  const f = deck[i];
  const front = els[i].querySelector('.front');
  if(front) front.innerHTML = `<span class="e">${f[0]}</span><span class="w">${f[1]}</span>`;
}
function updateHUD(){
  $('moves').textContent = moves;
  $('changes').textContent = changes;
  const key = lv.name;
  const rec = best[key];
  $('best').textContent = rec ? rec.moves + ' 步' : '—';
}
function startTimer(){
  if(started) return;
  started = true; t0 = performance.now();
  timer = setInterval(()=>{ $('time').textContent = ((performance.now()-t0)/1000).toFixed(1); }, 100);
}
function flip(i, el){
  if(lock || el.classList.contains('open') || el.classList.contains('gone')) return;
  startTimer();
  el.classList.add('open');
  beep(560, 0.05, 0.03);
  if(first == null){ first = {i, el}; return; }
  moves++; updateHUD();
  const a = first; first = null;
  if(deck[a.i] === deck[i]){
    // 配对成功
    lock = true;                     // 洗牌期间别让人翻牌
    setTimeout(()=>{
      a.el.classList.add('gone'); el.classList.add('gone');
      beep(880, 0.14, 0.05, 1.4);
      left--;
      if(left === 0){ lock = false; win(); return; }
      lock = false;
      reshuffle();                   // 消掉一对，剩下的全重排
    }, 260);
  } else {
    lock = true;
    setTimeout(()=>{
      a.el.classList.remove('open'); el.classList.remove('open');
      beep(240, 0.09, 0.03, 0.8);
      lock = false;
    }, 640);
  }
}
function win(){
  clearInterval(timer);
  const secs = (performance.now()-t0)/1000;
  const key = lv.name;
  const rec = best[key];
  const isBest = !rec || moves < rec.moves;
  if(isBest){ best[key] = { moves, secs }; try{ localStorage.setItem('ut_memory_best', JSON.stringify(best)); }catch(e){} }
  updateHUD();
  $('oEmoji').textContent = isBest ? '🏆' : '🎉';
  $('oTitle').textContent = isBest ? '最少步数' : '全消完了';
  $('oText').innerHTML = `${lv.name} 用时 <b>${secs.toFixed(1)}s</b> · 共 <b>${moves}</b> 步 · 被变更 <b>${changes}</b> 次` +
    `<br>（要是没人改需求，理论最少 ${lv.cols*lv.rows/2} 步）` +
    (isBest ? '<br>🎊 新纪录' : (rec ? `<br>本机最好 <b>${rec.moves}</b> 步` : ''));
  $('over').classList.add('show');
}

/* ---------- 音效 ---------- */
let actx = null;
function beep(f, dur, gain, bend){
  try{
    if(!actx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return; actx = new C(); }
    if(actx.state === 'suspended') actx.resume();
    const c = actx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
    if(bend) o.frequency.exponentialRampToValueAtTime(f*bend, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}

document.querySelectorAll('[data-lv]').forEach(b=>{
  b.addEventListener('click', ()=>{
    lv = LEVELS[b.dataset.lv];
    document.querySelectorAll('[data-lv]').forEach(x=> x.classList.toggle('on', x===b));
    build(); updateHUD();
  });
});
$('restart').addEventListener('click', build);
$('oAgain').addEventListener('click', build);
addEventListener('resize', ()=>{
  const board = $('board');
  const size = Math.min(window.innerWidth - 44, 620);
  const cs = Math.floor(Math.min((size - (lv.cols-1)*8) / lv.cols, 92));
  board.style.setProperty('--cs', cs + 'px');
  board.style.gridAutoRows = cs + 'px';
});

(function boot(){
  try{ best = JSON.parse(localStorage.getItem('ut_memory_best')||'{}') || {}; }catch(e){ best = {}; }
  build();
})();

window.__memory = {
  get deck(){ return deck; },
  get state(){ return { moves, left, lv: lv.name, lock, changes,
                        open: document.querySelectorAll('.card.open').length,
                        gone: document.querySelectorAll('.card.gone').length }; },
  get finished(){ return document.getElementById('over').classList.contains('show'); },
  get changes(){ return changes; },
  reshuffle,
  click(i){ const el = document.querySelector(`.card[data-i="${i}"]`); if(el) flip(i, el); },
  /* 每个位置现在是什么（测试用） */
  faces(){ return deck.map(f => f[1]); },
  alive(){ const o = []; for(let i=0;i<els.length;i++) if(!els[i].classList.contains('gone')) o.push(i); return o; },
  build
};
</script>
</body>
</html>
