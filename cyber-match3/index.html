<script src="../config.js"></script>
<script>
"use strict";
/* =========================================================
   抽象消消乐 · Abstract Match-3
   ========================================================= */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const $=id=>document.getElementById(id);

const COLS=8, ROWS=8;
const TYPES=[
  {e:'🐟', hue:150, w:'摸鱼'},
  {e:'🧱', hue:16,  w:'搬砖'},
  {e:'☕', hue:34,  w:'续命'},
  {e:'🌙', hue:268, w:'加班'},
  {e:'💰', hue:48,  w:'发薪'},
  {e:'🏖', hue:196, w:'放假'}
];

let W=0,H=0,DPR=1, CELL=60, BX=0, BY=0;
function layout(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cvs.width=W*DPR|0; cvs.height=H*DPR|0;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const availW=Math.min(W-44, 620);
  const availH=H-232;
  CELL=Math.floor(Math.min(availW/COLS, availH/ROWS));
  CELL=Math.max(30, Math.min(74, CELL));
  BX=Math.round((W-CELL*COLS)/2);
  BY=Math.round((H-CELL*ROWS)/2)+16;
}
addEventListener('resize', layout);

/* ---------------- 音效 ---------------- */
const A={
  ctx:null, muted:false, master:null,
  init(){
    if(this.ctx) return;
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=0.9;
    this.master.connect(this.ctx.destination);
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,d,type,v,slide){
    if(this.muted||!this.ctx) return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(); o.type=type||'triangle';
    o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+d);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v||0.06,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+d+0.04);
  },
  noise(d,v,freq){
    if(this.muted||!this.ctx) return;
    const c=this.ctx,t=c.currentTime;
    const len=Math.floor(c.sampleRate*d);
    const b=c.createBuffer(1,len,c.sampleRate); const dd=b.getChannelData(0);
    for(let i=0;i<len;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=c.createBufferSource(); s.buffer=b;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq||1200; bp.Q.value=0.9;
    const g=c.createGain(); g.gain.setValueAtTime(v||0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(bp).connect(g).connect(this.master); s.start(t); s.stop(t+d+0.02);
  },
  swap(){ this.tone(560,0.08,'triangle',0.05,700); },
  bad(){ this.tone(170,0.16,'sawtooth',0.05,110); },
  match(chain){
    const base=523.25;
    const f=base*Math.pow(2, Math.min(14, (chain-1)*2)/12);
    this.tone(f,0.24,'triangle',0.075);
    this.tone(f*1.5,0.20,'sine',0.045);
  },
  special(){ this.noise(0.4,0.16,900); this.tone(120,0.45,'sine',0.09,60); },
  levelup(){ [523,659,784,1047].forEach((f,i)=> setTimeout(()=>this.tone(f,0.34,'triangle',0.08), i*90)); },
  over(){ [440,370,294,220].forEach((f,i)=> setTimeout(()=>this.tone(f,0.4,'sine',0.075), i*130)); },
  drop(){ this.tone(300,0.05,'sine',0.03,240); }
};

/* ---------------- 方块 ---------------- */
let uid=0;
function Tile(type,r,c){
  this.id=++uid; this.type=type; this.r=r; this.c=c;
  this.x=c; this.y=r;              // 显示坐标（浮点）
  this.scale=1; this.alpha=1; this.special=null; this.born=0;
}
let grid=[], sel=null, busy=false;
let score=0, level=1, moves=25, goal=1000, chainMax=0;
let particles=[], floats=[], shake=0, idleAt=0, hint=null;
let best = 0; try{ best = Number(localStorage.getItem('ut_match3_best'))||0; }catch(e){}

const key=(r,c)=>r*COLS+c;
const inB=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
let rng = Math.random;
const rndType = () => (rng()*TYPES.length)|0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- 每日挑战：所有人同一副牌 ---------------- */
const DAILY_MOVES=30, DAILY_GOAL=4000;
let mode='normal', dailySeed=0;
function todayStr(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function seedOf(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- 建盘 ---------------- */
function fillBoard(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    let t, guard=0;
    do{
      t=rndType(); guard++;
    }while(guard<40 && (
      (c>=2 && grid[r][c-1] && grid[r][c-2] && grid[r][c-1].type===t && grid[r][c-2].type===t) ||
      (r>=2 && grid[r-1][c] && grid[r-2][c] && grid[r-1][c].type===t && grid[r-2][c].type===t)
    ));
    grid[r][c]=new Tile(t,r,c);
  }
  if(!findHint()) shuffleBoard(false);
}

/* ---------------- 找匹配 ---------------- */
function findRuns(){
  const runs=[];
  for(let r=0;r<ROWS;r++){
    let c=0;
    while(c<COLS){
      const t=grid[r][c];
      if(!t){ c++; continue; }
      let c2=c+1;
      while(c2<COLS && grid[r][c2] && grid[r][c2].type===t.type) c2++;
      if(c2-c>=3){ const cells=[]; for(let i=c;i<c2;i++) cells.push([r,i]); runs.push({dir:'h', len:c2-c, type:t.type, cells}); }
      c=c2;
    }
  }
  for(let c=0;c<COLS;c++){
    let r=0;
    while(r<ROWS){
      const t=grid[r][c];
      if(!t){ r++; continue; }
      let r2=r+1;
      while(r2<ROWS && grid[r2][c] && grid[r2][c].type===t.type) r2++;
      if(r2-r>=3){ const cells=[]; for(let i=r;i<r2;i++) cells.push([i,c]); runs.push({dir:'v', len:r2-r, type:t.type, cells}); }
      r=r2;
    }
  }
  return runs;
}
function groupRuns(runs){
  const groups=[];
  const used=new Array(runs.length).fill(false);
  for(let i=0;i<runs.length;i++){
    if(used[i]) continue;
    const g={runs:[runs[i]], cells:new Set()};
    used[i]=true;
    runs[i].cells.forEach(([r,c])=>g.cells.add(key(r,c)));
    let grew=true;
    while(grew){
      grew=false;
      for(let j=0;j<runs.length;j++){
        if(used[j]) continue;
        if(runs[j].cells.some(([r,c])=>g.cells.has(key(r,c)))){
          used[j]=true; g.runs.push(runs[j]);
          runs[j].cells.forEach(([r,c])=>g.cells.add(key(r,c)));
          grew=true;
        }
      }
    }
    groups.push(g);
  }
  return groups;
}
function classify(g){
  if(g.runs.some(r=>r.len>=5)) return 'rainbow';
  if(g.runs.length>=2) return 'bomb';
  const r=g.runs[0];
  if(r.len===4) return r.dir==='h' ? 'row' : 'col';
  return null;
}
function specialCellOf(g, kind){
  if(sel && g.cells.has(key(sel.r, sel.c))) return {r:sel.r, c:sel.c};
  if(selB && g.cells.has(key(selB.r, selB.c))) return {r:selB.r, c:selB.c};
  const longest=g.runs.slice().sort((a,b)=>b.len-a.len)[0];
  const mid=longest.cells[Math.floor(longest.cells.length/2)];
  return {r:mid[0], c:mid[1]};
}

/* ---------------- 特殊方块展开 ---------------- */
function expandSpecials(set){
  const q=[...set], done=new Set();
  while(q.length){
    const k=q.pop();
    if(done.has(k)) continue; done.add(k);
    const r=Math.floor(k/COLS), c=k%COLS;
    const t=grid[r][c];
    if(!t || !t.special) continue;
    const add=[];
    if(t.special==='row') for(let i=0;i<COLS;i++) add.push([r,i]);
    else if(t.special==='col') for(let i=0;i<ROWS;i++) add.push([i,c]);
    else if(t.special==='bomb'){ for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) add.push([r+dr,c+dc]); }
    else if(t.special==='rainbow'){
      const cnt={};
      for(let rr=0;rr<ROWS;rr++) for(let cc=0;cc<COLS;cc++){
        const tt=grid[rr][cc]; if(tt) cnt[tt.type]=(cnt[tt.type]||0)+1;
      }
      let tt=0, m=-1;
      for(const kk in cnt) if(cnt[kk]>m){ m=cnt[kk]; tt=+kk; }
      for(let rr=0;rr<ROWS;rr++) for(let cc=0;cc<COLS;cc++){
        const x=grid[rr][cc]; if(x && x.type===tt) add.push([rr,cc]);
      }
    }
    for(const [rr,cc] of add){
      if(!inB(rr,cc) || !grid[rr][cc]) continue;
      const kk=key(rr,cc);
      if(!set.has(kk)){ set.add(kk); q.push(kk); }
    }
  }
}

/* ---------------- 交互 ---------------- */
let selB=null, downPt=null, downCell=null, dragging=false;
function cellAt(px,py){
  const c=Math.floor((px-BX)/CELL), r=Math.floor((py-BY)/CELL);
  return inB(r,c) ? {r,c} : null;
}
cvs.addEventListener('pointerdown', e=>{
  A.init(); A.resume();
  if(busy || document.querySelector('.over.show')) return;
  const cell=cellAt(e.clientX, e.clientY);
  if(!cell) return;
  idleAt=performance.now(); hint=null;
  downPt={x:e.clientX,y:e.clientY}; downCell=cell; dragging=false;
  if(!sel){ sel={...cell}; selB=null; A.tone(700,0.05,'sine',0.03); }
  else if(sel.r===cell.r && sel.c===cell.c){ sel=null; }
  else if(Math.abs(sel.r-cell.r)+Math.abs(sel.c-cell.c)===1){ const a=sel; sel=null; trySwap(a, cell); }
  else { sel={...cell}; }
});
cvs.addEventListener('pointermove', e=>{
  if(!downPt || busy) return;
  const dx=e.clientX-downPt.x, dy=e.clientY-downPt.y;
  if(Math.hypot(dx,dy) < CELL*0.42) return;
  dragging=true;
  let t;
  if(Math.abs(dx)>Math.abs(dy)) t={r:downCell.r, c:downCell.c + (dx>0?1:-1)};
  else t={r:downCell.r + (dy>0?1:-1), c:downCell.c};
  const from=downCell;
  downPt=null; sel=null; downCell=null;
  if(inB(t.r,t.c)) trySwap(from, t);
});
addEventListener('pointerup', ()=>{ downPt=null; downCell=null; });

/* ---------------- 交换 ---------------- */
function swapCells(a,b){
  const ta=grid[a.r][a.c], tb=grid[b.r][b.c];
  grid[a.r][a.c]=tb; grid[b.r][b.c]=ta;
  if(ta){ ta.r=b.r; ta.c=b.c; }
  if(tb){ tb.r=a.r; tb.c=a.c; }
}
async function trySwap(a,b){
  if(busy) return;
  busy=true; sel=null;
  const ta=grid[a.r][a.c], tb=grid[b.r][b.c];
  if(!ta||!tb){ busy=false; return; }
  swapCells(a,b);
  A.swap();
  await sleep(170);
  if(findRuns().length===0){
    swapCells(a,b); A.bad();
    await sleep(170);
    busy=false; return;
  }
  moves--; syncHUD();
  await resolveAll(a,b);
  await ensurePlayable();
  busy=false;
  checkState();
}

/* ---------------- 结算 ---------------- */
async function resolveAll(a,b){
  let chain=0;
  while(true){
    const runs=findRuns();
    if(!runs.length) break;
    chain++;
    const groups=groupRuns(runs);
    const toClear=new Set();
    const create=[];
    for(const g of groups){
      const kind=classify(g);
      g.cells.forEach(k=>toClear.add(k));
      if(kind){
        sel=a; selB=b;
        const cell=specialCellOf(g, kind);
        sel=null; selB=null;
        toClear.delete(key(cell.r, cell.c));
        create.push({kind, r:cell.r, c:cell.c, type:g.runs[0].type});
      }
    }
    sel=null; selB=null;

    const before=toClear.size;
    expandSpecials(toClear);
    const bonus = toClear.size - before;
    const gained = Math.round((toClear.size*20) * chain);
    score += gained;
    chainMax=Math.max(chainMax, chain);
    syncHUD();

    // 特效
    const cells=[...toClear].map(k=>({r:Math.floor(k/COLS), c:k%COLS}));
    const mid=cells[Math.floor(cells.length/2)];
    if(mid){
      floats.push({x:BX+(mid.c+.5)*CELL, y:BY+(mid.r+.5)*CELL, t:0, life:1.0,
        text:'+'+gained, size: chain>1?26:21, hue: chain>1?290:170});
    }
    if(chain>1) banner('连锁 ×'+chain+(chain>=3?' ！':''));
    if(chain===1 && before>=5) A.special(); else A.match(chain);
    if(bonus>0) A.special();
    shake=Math.min(1, shake + 0.16 + Math.min(0.4, toClear.size*0.02) + (chain-1)*0.1);

    for(const {r,c} of cells){
      const t=grid[r][c];
      if(!t) continue;
      t.clearing=true;
      const px=BX+(t.x+.5)*CELL, py=BY+(t.y+.5)*CELL;
      burst(px, py, 6, TYPES[t.type].hue);
    }
    await sleep(Math.max(190, 300 - chain*20));
    for(const {r,c} of cells){ grid[r][c]=null; }

    // 生成特殊方块
    for(const sp of create){
      const t=new Tile(sp.type, sp.r, sp.c);
      t.special=sp.kind; t.scale=0.2; t.born=performance.now();
      grid[sp.r][sp.c]=t;
      const px=BX+(sp.c+.5)*CELL, py=BY+(sp.r+.5)*CELL;
      burst(px, py, 22, sp.kind==='rainbow'? 300 : TYPES[sp.type].hue);
      A.special();
      floats.push({x:px, y:py-10, t:0, life:1.1,
        text: sp.kind==='row'?'🚀 横向火箭': sp.kind==='col'?'🚀 纵向火箭': sp.kind==='bomb'?'💣 炸弹':'🌈 彩虹',
        size:19, hue: sp.kind==='rainbow'?300:40});
    }
    await sleep(120);
    gravityAndRefill();
    await sleep(230);
  }
  return chain;
}

function gravityAndRefill(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(grid[r][c]){
        if(write!==r){
          const t=grid[r][c];
          grid[write][c]=t; t.r=write; grid[r][c]=null;
        }
        write--;
      }
    }
    let above=1;
    for(let r=write;r>=0;r--){
      const t=new Tile(rndType(), r, c);
      t.y = r - (write+2) - Math.random()*1.4;
      t.scale=1;
      grid[r][c]=t;
      above++;
    }
  }
}

/* ---------------- 死局 / 提示 ---------------- */
function findHint(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const dirs=[[0,1],[1,0]];
    for(const [dr,dc] of dirs){
      const r2=r+dr, c2=c+dc;
      if(!inB(r2,c2)) continue;
      const ta=grid[r][c], tb=grid[r2][c2];
      if(!ta||!tb) continue;
      grid[r][c]=tb; grid[r2][c2]=ta;
      const ok=findRuns().length>0;
      grid[r][c]=ta; grid[r2][c2]=tb;
      if(ok) return {a:{r,c}, b:{r:r2,c:c2}};
    }
  }
  return null;
}
function shuffleBoard(loud){
  const all=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]) all.push(grid[r][c]);
  let guard=0;
  do{
    for(let i=all.length-1;i>0;i--){ const j=(rng()*(i+1))|0; const tmp=all[i]; all[i]=all[j]; all[j]=tmp; }
    let i=0;
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const t=all[i++]; grid[r][c]=t; t.r=r; t.c=c;
    }
    guard++;
  }while(guard<30 && (findRuns().length>0 || !findHint()));
  if(loud){ banner('没有可行的走法，重排！'); A.special(); }
}
async function ensurePlayable(){
  if(!findHint()){ shuffleBoard(true); await sleep(600); }
}

/* ---------------- 关卡 ---------------- */
function syncHUD(){
  $('uScore').textContent=score.toLocaleString('en-US');
  $('uGoal').textContent=goal.toLocaleString('en-US');
  $('uMoves').textContent=moves;
  $('uLevel').textContent = mode==='daily' ? '每日' : level;
  $('uMoves').parentElement.classList.toggle('low', moves<=5);
  if(mode==='normal' && score>best){ best=score; $('uBest').textContent=best.toLocaleString('en-US');
    try{ localStorage.setItem('ut_match3_best', String(best)); }catch(e){} }
}
function checkState(){
  if(mode==='daily'){
    if(score>=goal){ A.levelup(); endGame(true); return; }
    if(moves<=0){ A.over(); endGame(false); return; }
    return;
  }
  if(moves<=0 && score<goal){ A.over(); endGame(false); return; }
  if(score>=goal){
    A.levelup();
    const left=moves*80;
    score+=left;
    $('luTitle').textContent = '第 '+level+' 关通过！';
    $('luText').innerHTML = `剩余步数奖励 <b>+${left.toLocaleString('en-US')}</b> 分，本局总分 <b>${score.toLocaleString('en-US')}</b>。<br>下一关目标 <i>${(goal*2).toLocaleString('en-US')}</i> 分，步数 25。`;
    $('levelup').classList.add('show');
    syncHUD();
  }
}
function endGame(success){
  const s=score;
  $('rEmoji').textContent = success ? '🎉' : '🫠';
  $('rTitle').textContent = mode==='daily'
    ? (success ? '今日挑战完成！' : '今日挑战结束')
    : '步数用完了';
  $('rText').innerHTML = mode==='daily'
    ? `今日得分 <b>${s.toLocaleString('en-US')}</b>　目标 <i>${DAILY_GOAL.toLocaleString('en-US')}</i><br>${todayStr()} · ${DAILY_MOVES} 步 · 人人同一副牌`
    : `本局 <b>${s.toLocaleString('en-US')}</b> 分，差 <i>${Math.max(0,goal-s).toLocaleString('en-US')}</i> 分过关。<br>最高分 ${best.toLocaleString('en-US')}`;
  pendingRec = { mode, score:s, lines:0, date: todayStr() };
  $('rSaveRow').style.display = 'flex';
  $('rSaved').textContent = '';
  $('rName').value = lastName || '路人';
  $('result').classList.add('show');
}
function nextLevel(){
  level++; goal=goal*2; moves=25;
  $('levelup').classList.remove('show');
  newBoard(true);
}
function newBoard(keep){
  if(!keep){ score=0; level=1; goal=1000; moves=25; chainMax=0; }
  particles=[]; floats=[]; sel=null; selB=null; shake=0;
  fillBoard(); syncHUD();
}
function startGame(m){
  mode = m;
  if(m==='daily'){
    dailySeed = seedOf('match3-daily-'+todayStr());
    rng = mulberry32(dailySeed);
    score=0; level=1; goal=DAILY_GOAL; moves=DAILY_MOVES; chainMax=0;
  } else {
    rng = Math.random;
    score=0; level=1; goal=1000; moves=25; chainMax=0;
  }
  newBoard(true);
  $('uLevelK').textContent = m==='daily' ? '模 式' : '关 卡';
  syncHUD();
}

/* ---------------- 粒子 / 飘字 ---------------- */
function burst(x,y,n,hue){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=50+Math.random()*230;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,t:0,life:.5+Math.random()*.5,
      r:2+Math.random()*3.4,h:hue+(Math.random()*40-20)});
  }
}
function banner(text){
  const b=$('banner');
  b.textContent=text;
  b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
}

/* ---------------- 绘制 ---------------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawTile(t, now){
  const px=BX+(t.x+.5)*CELL, py=BY+(t.y+.5)*CELL;
  const s=(t.clearing ? t.scale : t.scale);
  const size=CELL*0.9*s;
  ctx.save();
  ctx.translate(px,py);
  ctx.globalAlpha = t.clearing ? Math.max(0,t.scale) : 1;

  // 底色
  const hue = t.special==='rainbow' ? ((now/8)%360) : TYPES[t.type].hue;
  const g=ctx.createLinearGradient(0,-size/2,0,size/2);
  if(t.special==='rainbow'){
    g.addColorStop(0,`hsl(${hue},92%,72%)`);
    g.addColorStop(1,`hsl(${(hue+90)%360},85%,46%)`);
  } else {
    g.addColorStop(0,`hsl(${hue},72%,60%)`);
    g.addColorStop(1,`hsl(${hue},74%,40%)`);
  }
  const r=size*0.26;
  rr(-size/2,-size/2,size,size,r);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.34)'; ctx.lineWidth=1.4; ctx.stroke();
  // 顶部高光
  ctx.save(); rr(-size/2,-size/2,size,size,r); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.22)';
  rr(-size/2+2,-size/2+2,size-4, size*0.34, r*0.8); ctx.fill();
  ctx.restore();

  // 图形
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`${Math.round(size*0.56)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.fillText(TYPES[t.type].e, 0, 1);

  // 特殊标记
  if(t.special && !t.clearing){
    if(t.special==='row' || t.special==='col'){
      ctx.save(); ctx.globalAlpha=.85; ctx.fillStyle='#fff';
      const bw=size*0.14;
      if(t.special==='row'){ rr(-size*0.44,-bw/2,size*0.88,bw,bw/2); ctx.fill(); }
      else { rr(-bw/2,-size*0.44,bw,size*0.88,bw/2); ctx.fill(); }
      ctx.restore();
    }
    if(t.special==='bomb'){
      ctx.save(); ctx.globalAlpha=.9; ctx.strokeStyle='#fff'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(0,0,size*0.41,0,7); ctx.stroke();
      ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,.7)';
      ctx.beginPath(); ctx.arc(0,0,size*0.47,0,7); ctx.stroke(); ctx.restore();
    }
    if(t.special==='rainbow'){
      ctx.save(); ctx.globalAlpha=.95; ctx.lineWidth=3;
      for(let i=0;i<6;i++){
        ctx.strokeStyle=`hsl(${i*60+(now/10)},95%,62%)`;
        ctx.beginPath(); ctx.arc(0,0,size*0.46, i*1.047, i*1.047+0.86); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 选中
  if(sel && sel.r===t.r && sel.c===t.c){
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.setLineDash([]); rr(-size/2-3,-size/2-3,size+6,size+6,r+3); ctx.stroke();
    ctx.globalAlpha=.22; ctx.fillStyle='#fff'; rr(-size/2,-size/2,size,size,r); ctx.fill();
  }
  // 提示
  if(hint && ((hint.a.r===t.r&&hint.a.c===t.c)||(hint.b.r===t.r&&hint.b.c===t.c))){
    ctx.globalAlpha=.35+0.35*Math.sin(now/140);
    ctx.strokeStyle='#ffd36e'; ctx.lineWidth=3;
    rr(-size/2-2,-size/2-2,size+4,size+4,r+2); ctx.stroke();
  }
  ctx.restore();
}

function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.01) ctx.translate((Math.random()-0.5)*shake*12,(Math.random()-0.5)*shake*12);

  // 棋盘底板
  const pad=8;
  const bx=BX-pad, by=BY-pad, bw=CELL*COLS+pad*2, bh=CELL*ROWS+pad*2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=40; ctx.shadowOffsetY=16;
  rr(bx,by,bw,bh,22); ctx.fillStyle='rgba(20,19,28,.72)'; ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1.4; rr(bx,by,bw,bh,22); ctx.stroke();
  // 格子
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    ctx.globalAlpha=0.05; ctx.fillStyle='#fff';
    rr(BX+c*CELL+2, BY+r*CELL+2, CELL-4, CELL-4, CELL*0.24); ctx.fill();
  }
  ctx.globalAlpha=1;

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const t=grid[r][c];
    if(t) drawTile(t, now);
  }

  // 粒子
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=`hsl(${p.h},90%,66%)`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // 飘字
  for(const f of floats){
    const k=f.t/f.life;
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-k*k);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`800 ${f.size}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillStyle=`hsl(${f.hue},92%,72%)`;
    ctx.shadowColor=`hsla(${f.hue},92%,60%,.9)`; ctx.shadowBlur=18;
    ctx.fillText(f.text, f.x, f.y - k*48);
    ctx.restore();
  }
  ctx.restore();

  // 暗角
  const vg=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.32, W/2,H*0.45, Math.max(W,H)*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.66)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ---------------- 主循环 ---------------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000); last=now;

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    const k=Math.min(1, 13*dt);
    t.x += (t.c - t.x)*k;
    t.y += (t.r - t.y)*k;
    if(Math.abs(t.c-t.x)<0.004) t.x=t.c;
    if(Math.abs(t.r-t.y)<0.004) t.y=t.r;
    if(t.clearing) t.scale = Math.max(0, t.scale - dt*5.5);
    else if(t.scale !== 1) t.scale += (1 - t.scale) * Math.min(1, 9*dt);
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    if(p.t>=p.life){ particles.splice(i,1); continue; }
    p.vy+=620*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(let i=floats.length-1;i>=0;i--){ floats[i].t+=dt; if(floats[i].t>=floats[i].life) floats.splice(i,1); }
  shake=Math.max(0, shake - dt*3);

  // 提示：闲置 6 秒
  if(!busy && !sel && !document.querySelector('.over.show')){
    if(now - idleAt > 6000){ if(!hint) hint=findHint(); }
  }

  draw(now);
}

/* ---------------- 本机榜 + 联网榜 ---------------- */
let lastName=''; try{ lastName=localStorage.getItem('ut_match3_name')||''; }catch(e){}
let pendingRec=null, curTab='normal';
const lsKey = m => 'ut_match3_scores_'+m;
function loadLocal(m){ try{ const a=JSON.parse(localStorage.getItem(lsKey(m))); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveLocalRec(rec){
  const a=loadLocal(rec.mode);
  a.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,6), name:rec.name, score:rec.score, lines:rec.lines, date:rec.date});
  a.sort((x,y)=>y.score-x.score);
  if(a.length>20) a.length=20;
  try{ localStorage.setItem(lsKey(rec.mode), JSON.stringify(a)); }catch(e){}
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const Net={
  get base(){ return (window.SHOP_API||'').replace(/\/+$/,''); },
  get on(){ return !!this.base; },
  async _fetch(url, opts, ms){
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), ms || 6000);
    try{ return await fetch(url, Object.assign({}, opts || {}, {signal:ctl.signal})); }
    finally{ clearTimeout(t); }
  },
  async submit(rec){
    if(!this.base) return {online:false};
    try{
      const r=await this._fetch(this.base+'/scores',{
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(rec)}, 7000);
      const j=await r.json();
      return j.ok ? {online:true, rank:j.rank, total:j.total} : {online:false};
    }catch(e){ return {online:false}; }
  },
  async list(m){
    if(!this.base) return null;
    try{
      const r=await this._fetch(this.base+'/scores?mode='+encodeURIComponent(m)+'&limit=20', null, 6000);
      const j=await r.json();
      return j.ok ? j.scores : null;
    }catch(e){ return null; }
  }
};

function lbRow(r,i){
  const me = lastName && r.name===lastName;
  return `<div class="lbrow ${me?'me':''}">`+
    `<span class="rk">${i+1}</span>`+
    `<span class="nm">${esc(r.name)}</span>`+
    `<span class="sc">${(r.score||0).toLocaleString('en-US')}</span>`+
    `<span class="dt">${((r.date||'').slice(5))||'—'}</span>`+
  `</div>`;
}
async function renderBoard(m){
  if(m) curTab=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.mode===curTab));
  const box=$('lbList');
  box.innerHTML='<div class="empty">读取中…</div>';
  const remote = await Net.list(curTab);
  if(remote && remote.length){
    $('netline').textContent = `🌐 联网榜 · ${curTab==='daily' ? ('今日 '+todayStr()) : '常规'} · 共 ${remote.length} 条`;
    box.innerHTML = remote.map(lbRow).join('');
  } else {
    const local = loadLocal(curTab);
    $('netline').textContent = Net.on
      ? '⚠️ 联网榜暂时读不到，先看本机记录'
      : '📴 未配置后端，下面是本机记录（部署方法见 server/README.md）';
    box.innerHTML = local.length ? local.map(lbRow).join('') : '<div class="empty">还没有成绩。去打一局吧。</div>';
  }
}

/* ---------------- 交互按钮 ---------------- */
$('startBtn').addEventListener('click', ()=>{ A.init(); A.resume(); $('start').classList.remove('show'); startGame('normal'); idleAt=performance.now(); });
$('dailyBtn').addEventListener('click', ()=>{ A.init(); A.resume(); $('start').classList.remove('show'); startGame('daily'); idleAt=performance.now(); });
$('boardBtn').addEventListener('click', ()=>{ A.init(); A.resume(); boardFrom='start'; $('start').classList.remove('show'); renderBoard('normal'); $('board').classList.add('show'); });
$('luNext').addEventListener('click', ()=>{ A.init(); A.resume(); nextLevel(); idleAt=performance.now(); });

$('rSave').addEventListener('click', async ()=>{
  if(!pendingRec) return;
  const name = ($('rName').value.trim() || '路人').slice(0,12);
  lastName = name; try{ localStorage.setItem('ut_match3_name', name); }catch(e){}
  const rec = Object.assign({}, pendingRec, {name});
  saveLocalRec(rec);
  $('rSaveRow').style.display='none';
  $('rSaved').textContent = Net.on ? '正在上传…' : '已存在本机榜';
  if(Net.on){
    const r = await Net.submit(rec);
    $('rSaved').textContent = r.online
      ? ('已上榜' + (r.rank ? ('，当前第 '+r.rank+' 名') : ''))
      : '网络不通，已存在本机榜';
  }
});
$('rName').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('rSave').click(); } });
$('rBoard').addEventListener('click', ()=>{
  A.init(); A.resume();
  boardFrom='result';
  $('result').classList.remove('show');
  renderBoard(pendingRec ? pendingRec.mode : 'normal');
  $('board').classList.add('show');
});
$('rAgain').addEventListener('click', ()=>{
  A.init(); A.resume();
  $('result').classList.remove('show');
  startGame(mode==='daily' ? 'daily' : 'normal');
  idleAt=performance.now();
});
$('restart').addEventListener('click', ()=>{
  A.init(); A.resume();
  $('result').classList.remove('show'); $('levelup').classList.remove('show'); $('start').classList.remove('show');
  startGame(mode);
  idleAt=performance.now();
});
$('muteBtn').addEventListener('click', e=>{ A.init(); A.muted=!A.muted; e.target.textContent=A.muted?'🔇':'🔊'; });

/* 排行榜面板 */
let boardFrom=null;
$('lbClose').addEventListener('click', ()=>{
  $('board').classList.remove('show');
  if(boardFrom==='result'){ $('result').classList.add('show'); }
  else if(boardFrom==='start'){ $('start').classList.add('show'); }
  boardFrom=null;
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>renderBoard(t.dataset.mode)));
$('lbExport').addEventListener('click', async ()=>{
  const btn=$('lbExport');
  try{ await navigator.clipboard.writeText(JSON.stringify(loadLocal(curTab))); btn.textContent='已复制 ✓'; }
  catch(e){ btn.textContent='复制失败'; }
  setTimeout(()=>btn.textContent='导出本机', 1600);
});
$('lbImport').addEventListener('click', ()=>{
  const t=prompt('粘贴别人导出的成绩 JSON：');
  if(!t) return;
  try{
    const arr=JSON.parse(t);
    if(!Array.isArray(arr)) throw new Error('bad');
    const cur=loadLocal(curTab); const ids=new Set(cur.map(r=>r.id));
    for(const r of arr){
      if(!r || typeof r.score!=='number') continue;
      const id=r.id||('i'+Date.now()+Math.random().toString(36).slice(2,6));
      if(ids.has(id)) continue; ids.add(id);
      cur.push({id, name:String(r.name||'路人').slice(0,12), score:r.score|0, lines:r.lines|0, date:String(r.date||'')});
    }
    cur.sort((a,b)=>b.score-a.score); if(cur.length>20) cur.length=20;
    localStorage.setItem(lsKey(curTab), JSON.stringify(cur));
    renderBoard();
  }catch(e){ alert('这不是有效的成绩数据。'); }
});
$('lbClear').addEventListener('click', ()=>{
  if(!confirm('清空本机榜？（联网榜不受影响）')) return;
  try{ localStorage.removeItem(lsKey(curTab)); }catch(e){}
  renderBoard();
});

/* ---------------- 启动 ---------------- */
layout();
$('uBest').textContent = best.toLocaleString('en-US');
$('dailyNote').innerHTML = `今日 ${todayStr()} · ${DAILY_MOVES} 步 · 目标 ${DAILY_GOAL.toLocaleString('en-US')} 分<br>所有人玩同一副牌，比的是当天最高分`;
fillBoard(); syncHUD();
$('start').classList.add('show');
requestAnimationFrame(loop);
</script>
</body>
</html>
