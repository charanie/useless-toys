<style>
  *{box-sizing:border-box}

    background-image:radial-gradient(900px 700px at 50% 12%, #2a1414 0%, #0b0708 68%);

    min-height:100vh;padding:16px 14px 22px;gap:11px;

  }

  header{width:min(660px,95vw);display:flex;align-items:flex-end;gap:12px}

  .bar{width:min(660px,95vw);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-size:12.5px;color:#f2e8e6;cursor:pointer;

  button.b:hover{background:rgba(255,138,107,.16);border-color:rgba(255,138,107,.5);color:#ffd0c0}
  button.b.primary{background:linear-gradient(120deg,rgba(255,138,107,.3),rgba(142,240,200,.18));border-color:rgba(255,138,107,.55)}

  .grp{display:flex;gap:5px;align-items:center}

  .box{width:min(430px,94vw);text-align:center;padding:26px 24px 22px;border-radius:22px;
    background:linear-gradient(180deg,rgba(40,26,24,.98),rgba(20,13,12,.98));

  .box .em{font-size:36px;line-height:1}

<body>

<header>
  <div class="brand">

<div class="wrap"><canvas id="c"></canvas></div>

<div class="bar">

    <button class="b" data-spd="0.8">慢</button>

<b style="color:#ffd36e">复议</b>：曲子过半，红蓝的含义会对调一次 —— 字还是那两个字，意思换了，底下的键位提示会跟着换<br>
音符从右往左滚，撞到鼓上就敲它 · 曲子照样是现场算出来的</footer>

<div class="over show" id="over">
  <div class="box">
    <div class="em" id="oEmoji">🥁</div>
    <h2 id="oTitle">选一首</h2>
    <p id="oText">红的是咚、蓝的是咔，撞到鼓上敲掉它。</p>
    <div class="lbl">曲 目</div>
    <div class="songs" id="songList"></div>
    <div class="lbl">难 度</div>
    <div class="row" id="diffRow"></div>
    <div class="row" style="margin-top:14px"><button class="b primary" id="oStart">开始</button></div>
  </div>

<script>
"use strict";
/* =====================================================================
   抽象太鼓 —— 两键横向滚动的音游
   跟 cyber-keys 共用同一套音乐引擎思路：曲子现场合成，谱面从曲子里长出来。
   ===================================================================== */
const $ = id => document.getElementById(id);

/* ---------- 音乐引擎 ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const midiHz = n => 440*Math.pow(2,(n-69)/12);
const MINOR = [0,2,3,5,7,8,10], PENTA = [0,3,5,7,10];

/* 底鼓和军鼓的落点必须互相错开，否则谱面去重会把整类鼓点丢掉（详见 cyber-keys 里的说明） */
const DRUM_PAT = {
  four:  { kick:'x.....x...x..x..', snare:'....x.......x...', hat:'x.x.x.x.x.x.x.x.' },
  break: { kick:'x.....x...x.....', snare:'....x.......x..x', hat:'x.xx.xx.x.xx.xx.' },
  half:  { kick:'x.....x.........', snare:'........x.......', hat:'..x...x...x...x.' },
  rush:  { kick:'x..x..x.x..x..x.', snare:'....x.......x...', hat:'xxxxxxxxxxxxxxxx' },
  shuffle:{ kick:'x..x..x..x..x..x', snare:'..x.....x.......', hat:'..x.x...x.x...x.' }
};
const BASS_PAT = {
  drive:'x..x..x...x.x...', busy:'x.x..x.xx..x..x.', chill:'x.......x.......', rush:'x.x.x.x.x.x.x.x.', march:'x...x...x...x...'
};
const MEL_DENS = { drive:0.42, busy:0.58, chill:0.30, rush:0.50, march:0.36 };
const PROG = [0, 5, 2, 6];

const SONGS = [
  { id:'drill', title:'早操进行曲', bpm:126, root:45, seed:5101, drums:'four',    bars:22, style:'march' },
  { id:'rush',  title:'赶地铁',     bpm:156, root:43, seed:5202, drums:'rush',    bars:22, style:'rush'  },
  { id:'lazy',  title:'午休半小时', bpm: 96, root:48, seed:5303, drums:'half',    bars:18, style:'chill' },
  { id:'boss',  title:'领导来了',   bpm:170, root:41, seed:5404, drums:'shuffle', bars:22, style:'busy'  }
];

function buildSong(cfg){
  const rnd = mulberry32(cfg.seed);
  const spb = 60/cfg.bpm, step = spb/4, ev = [];
  const P = DRUM_PAT[cfg.drums], B = BASS_PAT[cfg.style], dens = MEL_DENS[cfg.style];
  const deg = d => { const n = MINOR.length, o = Math.floor(d/n), i = ((d%n)+n)%n; return MINOR[i] + 12*o; };
  const pen = d => { const n = PENTA.length, o = Math.floor(d/n), i = ((d%n)+n)%n; return PENTA[i] + 12*o; };
  let walk = 4;
  for(let bar=0; bar<cfg.bars; bar++){
    const t0 = bar*16*step;
    for(let s=0;s<16;s++){
      const t = t0 + s*step;
      if(P.kick[s]==='x')  ev.push({t, kind:'kick'});
      if(P.snare[s]==='x') ev.push({t, kind:'snare'});
      if(P.hat[s]==='x')   ev.push({t, kind:'hat'});
    }
    const root = cfg.root + deg(PROG[bar % PROG.length]);
    for(let s=0;s<16;s++) if(B[s]==='x') ev.push({t: t0 + s*step, kind:'bass', midi: root});
    if(bar % 2 === 0){
      const dur = step*32;
      for(const iv of [0, 3, 7]) ev.push({t: t0, kind:'pad', midi: root + iv, dur});
    }
    for(let s=0;s<16;s++){
      const onBeat = (s % 4 === 0);
      if(rnd() < (onBeat ? dens*1.7 : dens)){
        walk += [-2,-1,-1,0,1,1,2][(rnd()*7)|0];
        walk = Math.max(0, Math.min(10, walk));
        ev.push({t: t0 + s*step, kind:'lead', midi: cfg.root + 24 + pen(walk)});
      }
    }
  }
  ev.sort((a,b)=> a.t - b.t);
  return { cfg, events: ev, step, spb, dur: cfg.bars*16*step };
}

const M = {
  ctx:null, master:null, noise:null, song:null, t0:0, i:0, on:false, vol:0.85,
  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    const c = this.ctx = new C();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 6; comp.attack.value = 0.004;
    const g = this.master = c.createGain(); g.gain.value = this.vol;
    g.connect(comp).connect(c.destination);
    const len = Math.floor(c.sampleRate*1.2);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = b;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  now(){ return this.ctx ? this.ctx.currentTime - this.t0 : 0; },
  start(song, lead){ this.init(); this.resume(); this.song = song; this.i = 0; this.on = true;
    this.t0 = this.ctx.currentTime + (lead == null ? 3.2 : lead); },
  stop(){ this.on = false; },
  /* 你打得怎么样，歌就长什么样：手顺就加声部、音也准；手一乱就掉声部、开始走音。
     这是「音乐是现场算出来的」才做得到的事 —— 谱子固定的游戏没法这么干。 */
  perf: 0.58,       // 0 一塌糊涂 ～ 1 炉火纯青（按最近的判定平滑变化）
  voices: 3,        // 现在开着几个声部：开场三个，主旋律得靠自己打进去
  hype(d){ this.perf = Math.max(0, Math.min(1, this.perf + d)); },
  retune(){ this.voices = this.perf < 0.20 ? 1 : this.perf < 0.40 ? 2 : this.perf < 0.68 ? 3 : 4; },
  allow(kind){
    const v = this.voices;
    if(v <= 1) return kind === 'kick' || kind === 'bass';
    if(v <= 2) return kind !== 'pad' && kind !== 'lead';
    if(v <= 3) return kind !== 'lead';
    return true;
  },
  tick(){
    if(!this.on || !this.ctx || !this.song) return;
    this.retune();
    const ahead = this.ctx.currentTime + 0.18;
    while(this.i < this.song.events.length){
      const ev = this.song.events[this.i];
      const at = this.t0 + ev.t;
      if(at > ahead) break;
      if(at > this.ctx.currentTime - 0.06 && this.allow(ev.kind)) this.play(ev, at);
      this.i++;
    }
  },
  play(ev, at){
    const c = this.ctx, K = ev.kind;
    if(K === 'kick'){
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150, at);
      o.frequency.exponentialRampToValueAtTime(44, at+0.11);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.95, at+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.20);
      o.connect(g).connect(this.master); o.start(at); o.stop(at+0.24);
    } else if(K === 'snare'){
      const s=c.createBufferSource(); s.buffer=this.noise;
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.9;
      const g=c.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.32, at+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.15);
      s.connect(bp).connect(g).connect(this.master); s.start(at); s.stop(at+0.18);
      const o=c.createOscillator(), g2=c.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(210, at);
      g2.gain.setValueAtTime(0.0001, at);
      g2.gain.exponentialRampToValueAtTime(0.13, at+0.004);
      g2.gain.exponentialRampToValueAtTime(0.0001, at+0.09);
      o.connect(g2).connect(this.master); o.start(at); o.stop(at+0.12);
    } else if(K === 'hat'){
      const s=c.createBufferSource(); s.buffer=this.noise;
      const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
      const g=c.createGain();
      g.gain.setValueAtTime(0.09, at);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.045);
      s.connect(hp).connect(g).connect(this.master); s.start(at); s.stop(at+0.07);
    } else if(K === 'bass'){
      const o=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain();
      o.type='triangle'; o.frequency.value = midiHz(ev.midi);
      lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=3;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.28, at+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.26);
      o.connect(lp).connect(g).connect(this.master); o.start(at); o.stop(at+0.30);
    } else if(K === 'lead'){
      const o=c.createOscillator(), o2=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain();
      o.type='square'; o2.type='triangle';
      o.frequency.value = midiHz(ev.midi); o2.frequency.value = midiHz(ev.midi)*(1.004 + (1-this.perf)*0.011);
      lp.type='lowpass'; lp.frequency.setValueAtTime(4200, at);
      lp.frequency.exponentialRampToValueAtTime(1400, at+0.24);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.075, at+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.26);
      o.connect(lp); o2.connect(lp); lp.connect(g).connect(this.master);
      o.start(at); o2.start(at); o.stop(at+0.30); o2.stop(at+0.30);
    } else if(K === 'pad'){
      const d = ev.dur || 1.6;
      for(const det of [-6, 6]){
        const o=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain();
        const off = det * (1 + (1-this.perf)*2.2);      // 手一乱，两个锯齿就散开走音
        o.type='sawtooth'; o.frequency.value = midiHz(ev.midi)*Math.pow(2, off/1200);
        lp.type='lowpass'; lp.frequency.value=1000;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.linearRampToValueAtTime(0.028, at+0.5);
        g.gain.setValueAtTime(0.028, at+Math.max(0.6, d-0.6));
        g.gain.linearRampToValueAtTime(0.0001, at+d);
        o.connect(lp).connect(g).connect(this.master); o.start(at); o.stop(at+d+0.05);
      }
    }
  }
};

/* ---------- 谱面：咚=底鼓，咔=军鼓/踩镲 ----------
   按十六分音符网格采样，难度只管「每隔几格取一个」。
   早先按最小时间间隔过滤是错的：它总保先来的那类，军鼓会被整类吃掉。 */
const DIFFS = {
  easy:   { name:'轻敲', stride:6, kick:1, snare:1, lead:0, hat:0, mult:0.85 },
  normal: { name:'正经', stride:3, kick:1, snare:1, lead:1, hat:0, mult:1.0  },
  hard:   { name:'拼命', stride:2, kick:1, snare:1, lead:1, hat:1, mult:1.2  }
};
function buildChart(song, diffKey){
  const D = DIFFS[diffKey];
  const step = song.step, grid = new Map();
  for(const ev of song.events){
    if(!D[ev.kind]) continue;
    const s = Math.round(ev.t/step);
    if(!grid.has(s)) grid.set(s, ev);
  }
  const last = Math.round(song.dur/step);
  const out = [];
  for(let s=0; s<=last; s+=D.stride){
    let ev = null;
    for(let k=0; k<D.stride && !ev; k++) ev = grid.get(s+k) || null;
    if(!ev) continue;
    let type;
    if(ev.kind === 'kick')       type = 'don';
    else if(ev.kind === 'snare') type = 'ka';
    else if(ev.kind === 'hat')   type = out.length % 2 ? 'ka' : 'don';
    else                         type = ((ev.midi - song.cfg.root) % 2 === 0) ? 'don' : 'ka';
    out.push({ t: ev.t, type, judged:false, result:null });
  }
  return out;
}

/* ---------- 状态 ---------- */
const W = 680, H = 300;
const HIT_X = 132;
const WIN = { perfect:0.045, good:0.090, ok:0.140 };
const TIER = { perfect:{ n:'完美', s:300, c:'#8ef0c8' }, good:{ n:'良好', s:200, c:'#5fd8ff' },
               ok:{ n:'凑合', s:100, c:'#ffd36e' }, miss:{ n:'错过', s:0, c:'#ff7a6b' } };
const COL = { don:'#ff8a6b', ka:'#5fd8ff' };

const cvs = $('c'), ctx = cvs.getContext('2d');
let song=null, chart=[], playing=false, paused=false, finished=false;
let score=0, combo=0, maxCombo=0, hits=0, totalNotes=0, speed=1, songIdx=0, diffKey='normal';
let judgeCount={perfect:0,good:0,ok:0,miss:0};
let fx=[], drumFlash=0, drumColor='#ff8a6b', last=0, countBeep=-9;
let best={}, autoPlay=false, trackY=0;
/* 复议：曲子过半，红蓝的含义会对调 —— 「换了个说法」，字还是那两个字 */
let flipped=false, flipAt=0, flipUntil=0;
const HINT_N = 'F = 咚（红） · J = 咔（蓝） · 也可点画布左右半边';
const HINT_F = '⚠ 复议生效：F = 咔（蓝） · J = 咚（红） —— 说法换了，红蓝跟着换';

function resize(){
  const availW = Math.min(window.innerWidth - 46, 680);   // 46 = body 与 wrap 的内边距
  const availH = window.innerHeight*0.60;
  const k = Math.min(availW/W, availH/H, 1);
  const w = Math.round(W*k), h = Math.round(H*k);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = w*dpr; cvs.height = h*dpr;
  cvs.style.width = w+'px'; cvs.style.height = h+'px';
  ctx.setTransform(dpr*w/W, 0, 0, dpr*h/H, 0, 0);
  trackY = H*0.56;
  draw(M.now());
}
function currentSong(){
  const full = buildSong(SONGS[songIdx]);
  chart = buildChart(full, diffKey);
  song = full; return full;
}
/* 复议：曲子过半的时候对调一次，一次就好，不然就成耍人了 */
function doFlip(st){
  if(flipped) return;
  flipped = true; flipUntil = st + 2.4;
  $('hint').textContent = HINT_F;
  $('hint').classList.add('flip');
}
const hitDon = () => tryHit(flipped ? 'ka' : 'don');
const hitKa  = () => tryHit(flipped ? 'don' : 'ka');
function reset(){
  playing=false; paused=false; finished=false;
  score=0; combo=0; maxCombo=0; hits=0;
  judgeCount={perfect:0,good:0,ok:0,miss:0};
  fx=[]; drumFlash=0; countBeep=-9;
  flipped=false; flipAt=0; flipUntil=0;
  $('hint').textContent = HINT_N; $('hint').classList.remove('flip');
  currentSong(); totalNotes = chart.length;
  flipAt = song.dur * 0.52;
  M.perf = 0.58; M.retune();         // 开场三个声部，主旋律得靠自己打进去
  M.stop(); updateHUD();
}
function play(){ reset(); M.start(song, 3.2); playing = true; $('over').classList.remove('show'); }
function updateHUD(){
  $('score').textContent = score;
  $('combo').textContent = combo;
  const denom = (judgeCount.perfect+judgeCount.good+judgeCount.ok+judgeCount.miss) || 1;
  const acc = (judgeCount.perfect*300 + judgeCount.good*200 + judgeCount.ok*100)/(denom*300);
  $('acc').textContent = totalNotes ? (acc*100).toFixed(1)+'%' : '100%';
  $('grade').textContent = totalNotes ? gradeOf(acc) : '—';
  const v = M.voices || 3;
  $('voices').textContent = v + '/4';
  $('voices').style.color = v >= 4 ? '#8ef0c8' : v === 3 ? '#8fd9ff' : v === 2 ? '#ffd36e' : '#ff7a6b';
}
function gradeOf(a){ return a>=.96?'S':a>=.90?'A':a>=.80?'B':a>=.65?'C':'D'; }

function judgeNote(n, tier){
  n.judged=true; n.result=tier;
  const s=TIER[tier], D=DIFFS[diffKey];
  judgeCount[tier]++;
  if(tier==='miss'){ combo=0; M.hype(-0.11); }
  else{
    hits++; combo++; if(combo>maxCombo) maxCombo=combo;
    score += Math.round(s.s * D.mult * (1 + Math.min(1, combo/100)));
    // 手顺，歌就越弹越满；漏一拍要三次完美才补得回来
    M.hype(tier==='perfect' ? 0.07 : tier==='good' ? 0.03 : 0.01);
  }
  M.retune();
  updateHUD();
}
function tryHit(type){
  if(!playing || paused || finished) return;
  const now = M.now();
  let bn=null, bd=1e9;
  for(const n of chart){
    if(n.judged || n.type !== type) continue;
    const d = Math.abs(n.t - now);
    if(d < bd){ bd = d; bn = n; }
  }
  drumFlash = 1; drumColor = COL[type];
  if(!bn || bd > WIN.ok) return;
  const tier = bd<=WIN.perfect?'perfect':bd<=WIN.good?'good':'ok';
  judgeNote(bn, tier);
  fx.push({ x:HIT_X, y:trackY-72, text:TIER[tier].n, color:TIER[tier].c, life:1 });
}
function update(st){
  if(!playing || paused) return;
  if(!flipped && st >= flipAt) doFlip(st);   // 曲子过半，红蓝对调
  M.tick();
  for(const n of chart){
    if(n.judged) continue;
    if(autoPlay && st >= n.t){ judgeNote(n,'perfect'); continue; }
    if(st > n.t + WIN.ok){
      judgeNote(n,'miss');
      fx.push({ x:HIT_X, y:trackY-72, text:'错过', color:TIER.miss.c, life:1 });
    }
  }
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.life -= 0.024; f.y -= 0.6;
    if(f.life<=0) fx.splice(i,1);
  }
  drumFlash = Math.max(0, drumFlash - 0.055);
  if(st > song.dur + 1.4) finish();
  const cnt = Math.ceil(-st);
  if(st < 0 && cnt !== countBeep && cnt <= 3 && cnt >= 1){ countBeep = cnt; beep(cnt); }
}
function beep(n){
  M.init(); if(!M.ctx) return;
  const c=M.ctx, t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.value = 660 + (3-n)*110;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.07, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
  o.connect(g).connect(M.master); o.start(t); o.stop(t+0.15);
}
function finish(){
  playing=false; finished=true; M.stop();
  const denom = totalNotes || 1;
  const acc = (judgeCount.perfect*300+judgeCount.good*200+judgeCount.ok*100)/(denom*300);
  const g = gradeOf(acc);
  const key = SONGS[songIdx].id + ':' + diffKey;
  const prev = best[key];
  const isBest = !prev || score > prev.score;
  if(isBest){ best[key] = { score, grade:g }; try{ localStorage.setItem('ut_taiko_best', JSON.stringify(best)); }catch(e){} }
  paintBest();
  $('oEmoji').textContent = g==='S'?'🏆':g==='D'?'😵':'🥁';
  $('oTitle').textContent = g==='S'?'鼓都被你敲穿了':g==='D'?'手有点跟不上':'打完了';
  $('oText').innerHTML =
    `《${SONGS[songIdx].title}》· ${DIFFS[diffKey].name}<br>` +
    `分数 <b>${score}</b> · 准确率 <b>${(acc*100).toFixed(1)}%</b> · 评级 <b>${g}</b><br>` +
    `完美 <b>${judgeCount.perfect}</b> · 良好 <b>${judgeCount.good}</b> · 凑合 <b>${judgeCount.ok}</b> · 错过 <b>${judgeCount.miss}</b>` +
    (maxCombo?` · 最高连击 <b>${maxCombo}</b>`:'') +
    (isBest?'<br>🎊 新纪录' : (prev?`<br>本机最好 <b>${prev.score}</b>`:''));
  $('oStart').textContent = '再来一次';
  $('over').classList.add('show');
  updateHUD();
}

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(st){
  if(!song) return;                       // boot 时 resize() 会先调一次 draw，那时还没有曲子
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#17100f'); bg.addColorStop(1,'#0e0908');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // 背景柱子
  ctx.fillStyle = 'rgba(255,138,107,.035)';
  for(let x=HIT_X; x<W; x+=80) ctx.fillRect(x, 0, 2, H);

  // 轨道
  ctx.fillStyle = 'rgba(255,255,255,.045)';
  rr(HIT_X, trackY-24, W-HIT_X-20, 48, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,138,107,.16)'; ctx.lineWidth = 2;
  rr(HIT_X, trackY-24, W-HIT_X-20, 48, 22); ctx.stroke();

  // 音符
  const fallT = 1.55/speed, r = 21;
  for(const n of chart){
    if(n.judged && n.result !== 'miss') continue;
    const x = HIT_X + (n.t - st)/fallT * (W - HIT_X - 40);
    if(x < HIT_X-40 || x > W+40) continue;
    ctx.save();
    ctx.globalAlpha = n.result==='miss' ? 0.22 : 1;
    ctx.shadowColor = COL[n.type]; ctx.shadowBlur = 14;
    ctx.fillStyle = COL[n.type];
    if(n.type === 'don'){ ctx.beginPath(); ctx.arc(x, trackY, r, 0, 7); ctx.fill(); }
    else { rr(x-r, trackY-r, r*2, r*2, 8); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = 'rgba(12,8,8,.55)';
    ctx.font = '800 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n.type==='don'?'咚':'咔', x, trackY+1);
  }

  // 判定环
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(HIT_X, trackY, r+8, 0, 7); ctx.stroke();

  // 鼓
  drawDrum(HIT_X, trackY);

  // 特效
  for(const f of fx){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = '800 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.text, f.x + (1-f.life)*30, f.y);
  }
  ctx.globalAlpha = 1;

  // 进度
  const prog = Math.max(0, Math.min(1, st/song.dur));
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(0,0,W,4);
  ctx.fillStyle = '#ff8a6b'; ctx.fillRect(0,0,W*prog,4);

  // 连击
  if(combo >= 5 && playing){
    ctx.globalAlpha = .28;
    ctx.fillStyle = '#ffd36e';
    ctx.font = `800 ${Math.min(46, 24+combo*0.22)}px ui-monospace,Consolas,monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(combo, W*0.62, H*0.32);
    ctx.globalAlpha = 1;
  }

  // 键位（复议之后红蓝对调，这里的提示必须跟着换，不然就是耍人）
  ctx.font = '800 12px ui-monospace,Consolas,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const kDon = flipped ? 'J' : 'F', kKa = flipped ? 'F' : 'J';
  ctx.fillStyle = flipped ? '#ffd36e' : 'rgba(255,138,107,.7)';
  ctx.fillText(kDon + ' 咚', HIT_X, trackY+62);
  ctx.fillStyle = flipped ? '#ffd36e' : 'rgba(95,216,255,.7)';
  ctx.fillText(kKa + ' 咔', HIT_X, trackY+82);

  // 换说法的那一下，屏幕正中给个提示
  if(st < flipUntil){
    const a = Math.min(1, (flipUntil - st)/2.4 * 1.6);
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = 'rgba(12,7,6,.6)'; ctx.fillRect(0, H*0.13, W, 62);
    ctx.fillStyle = '#ffd36e';
    ctx.font = '800 26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('换了个说法', W/2, H*0.13+24);
    ctx.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('红现在是 ' + kDon + '，蓝现在是 ' + kKa, W/2, H*0.13+46);
    ctx.globalAlpha = 1;
  }

  if(playing && !paused && st < 0){
    ctx.fillStyle = 'rgba(14,9,8,.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff8a6b';
    ctx.font = '800 64px ui-monospace,Consolas,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(Math.min(3, Math.ceil(-st)), W*0.6, H*0.42);
    ctx.font = '600 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText('《'+SONGS[songIdx].title+'》· '+DIFFS[diffKey].name, W*0.6, H*0.42+48);
  }
  if(paused){
    ctx.fillStyle = 'rgba(14,9,8,.74)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff8a6b';
    ctx.font = '800 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('已暂停', W/2, H*0.45);
    ctx.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.fillText('按空格继续', W/2, H*0.45+32);
  }
}
function drawDrum(cx, cy){
  const R = 46;
  ctx.save();
  if(drumFlash > 0){ ctx.shadowColor = drumColor; ctx.shadowBlur = 26*drumFlash; }
  const g = ctx.createRadialGradient(cx-14, cy-16, 6, cx, cy, R);
  g.addColorStop(0, '#8a5a3e'); g.addColorStop(1, '#4a2c1e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,220,190,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  if(drumFlash > 0){
    ctx.globalAlpha = drumFlash*0.55;
    ctx.fillStyle = drumColor;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(255,225,200,.14)';
  ctx.beginPath(); ctx.arc(cx, cy, R*0.62, 0, 7); ctx.fill();
}

/* ---------- 主循环与交互 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(60, ts-last || 16); last = ts;
  const st = M.now();
  update(st); draw(st);
}
addEventListener('keydown', e=>{
  if(e.key === ' '){
    e.preventDefault();
    if(!playing) play();
    else if(!finished) paused = !paused;
    return;
  }
  if(e.repeat) return;
  if(e.key==='f'||e.key==='F'){ e.preventDefault(); hitDon(); }
  if(e.key==='j'||e.key==='J'){ e.preventDefault(); hitKa(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); hitDon(); }
  if(e.key==='ArrowRight'){ e.preventDefault(); hitKa(); }
});
cvs.addEventListener('pointerdown', e=>{
  if(!playing) return;
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  (x < 0.5 ? hitDon : hitKa)();
});
$('start').addEventListener('click', ()=>{ M.init(); M.resume(); play(); });
$('oStart').addEventListener('click', ()=>{ M.init(); M.resume(); play(); });
document.querySelectorAll('[data-spd]').forEach(b=>{
  b.addEventListener('click', ()=>{
    speed = parseFloat(b.dataset.spd);
    document.querySelectorAll('[data-spd]').forEach(x=> x.classList.toggle('on', x===b));
  });
});
addEventListener('resize', resize);

(function buildPicker(){
  const list = $('songList');
  SONGS.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'song' + (i===0?' on':'');
    el.innerHTML = `<span class="nm">${s.title}</span><span class="meta">${s.bpm} BPM</span><span class="bk" data-bk="${s.id}"></span>`;
    el.addEventListener('click', ()=>{
      songIdx = i;
      [...list.children].forEach((c,j)=> c.classList.toggle('on', j===i));
    });
    list.appendChild(el);
  });
  const dr = $('diffRow');
  Object.keys(DIFFS).forEach(k=>{
    const b = document.createElement('button');
    b.className = 'b' + (k==='normal'?' on':'');
    b.textContent = DIFFS[k].name;
    b.addEventListener('click', ()=>{
      diffKey = k;
      [...dr.children].forEach(x=> x.classList.toggle('on', x===b));
      paintBest();
    });
    dr.appendChild(b);
  });
})();
function paintBest(){
  for(const s of SONGS){
    const el = document.querySelector(`[data-bk="${s.id}"]`);
    if(!el) continue;
    const rec = best[s.id+':'+diffKey];
    el.textContent = rec ? rec.grade+' '+rec.score : '—';
  }
}

(function boot(){
  try{ best = JSON.parse(localStorage.getItem('ut_taiko_best')||'{}') || {}; }catch(e){ best = {}; }
  resize(); reset(); paintBest();
  requestAnimationFrame(loop);
})();

window.__taiko = {
  get chart(){ return chart; }, get song(){ return song; },
  get state(){ return { playing, paused, finished, score, combo, maxCombo, judgeCount, totalNotes }; },
  setAuto(v){ autoPlay = !!v; }, hit: tryHit, play, finish,
  M,
  get perf(){ return M.perf; },
  get voices(){ return M.voices; },
  get voicesShown(){ return $('voices').textContent; },
  setPerf(v){ M.perf = v; M.retune(); updateHUD(); },
  judgeForTest(tier){ judgeNote({ type:'don', judged:false }, tier); },
  /* 复议那部分 */
  get flipped(){ return flipped; },
  get flipAt(){ return flipAt; },
  get hint(){ return $('hint').textContent; },
  hitDon, hitKa,
  forceFlip(st){ doFlip(st == null ? M.now() : st); draw(M.now()); }
};
</script>
</body>
</html>
