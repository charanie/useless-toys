<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛博求签机 · CYBER FORTUNE</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0b0b0e}
  body{
    background-image:radial-gradient(900px 700px at 50% 30%, #1d1712 0%, #0b0b0e 72%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:#efe7d6;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #c{position:fixed;inset:0;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none}

  .title{position:absolute;top:24px;left:50%;transform:translateX(-50%);text-align:center;line-height:1.2}
  .title h1{margin:0;font-size:clamp(18px,3vw,26px);letter-spacing:.4em;font-weight:800;color:#e8b96a;text-shadow:0 0 30px rgba(232,185,106,.3)}
  .title .sub{margin-top:6px;font-size:11px;letter-spacing:.32em;color:#8a7f6c}

  .bar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{
    pointer-events:auto;font:inherit;font-size:13px;color:#efe7d6;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
    border-radius:999px;padding:11px 22px;letter-spacing:.1em;transition:.15s;
  }
  button:hover{background:rgba(232,185,106,.18);border-color:rgba(232,185,106,.55);color:#f4d79a;transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:default;transform:none}
  .hint{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);font-size:12px;color:#8a7f6c;letter-spacing:.2em;transition:opacity .6s;white-space:nowrap}
  .hint.hide{opacity:0}

  /* 签文卡片 */
  .card{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
    width:min(430px,88vw);max-height:82vh;overflow:auto;
    background:linear-gradient(180deg,#f6efe0,#efe6d3);color:#2a2419;
    border-radius:14px;padding:26px 26px 22px;
    box-shadow:0 40px 90px rgba(0,0,0,.75), inset 0 0 0 1px #d9c9a6, inset 0 0 60px rgba(180,150,90,.15);
    opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s cubic-bezier(.2,1.3,.4,1);
  }
  .card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .card .no{font-size:12px;letter-spacing:.3em;color:#9a8a68;text-align:center}
  .card .lvl{
    text-align:center;font-size:26px;font-weight:800;letter-spacing:.3em;margin:6px 0 14px;
  }
  .card .poem{
    font-family:"Songti SC","SimSun",serif;font-size:17px;line-height:2.1;text-align:center;
    letter-spacing:.06em;border-top:1px solid #d9c9a6;border-bottom:1px solid #d9c9a6;padding:14px 0;margin-bottom:16px;
  }
  .card .jie{font-size:13.5px;line-height:1.95;color:#4a4133;margin-bottom:16px}
  .card .yiji{display:flex;gap:10px;flex-direction:column;font-size:13.5px;line-height:1.8}
  .card .yiji .row{display:flex;gap:10px;align-items:flex-start}
  .card .tag{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;
  }
  .tag.y{background:#3f8f5f}
  .tag.j{background:#b0463c}
  .card .act{display:flex;gap:10px;margin-top:20px;justify-content:center}
  .card button{background:#2a2419;color:#f6efe0;border-color:#2a2419}
  .card button:hover{background:#3d3527;color:#fff;border-color:#3d3527}
  .card .seal{
    position:absolute;right:18px;bottom:16px;width:46px;height:46px;border-radius:6px;
    background:#b0342a;color:#f6efe0;display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC",serif;font-weight:800;font-size:15px;line-height:1.1;text-align:center;
    transform:rotate(-6deg);opacity:.9;letter-spacing:1px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="title">
    <h1>赛 博 求 签</h1>
    <div class="sub">CYBER FORTUNE · 天机不可泄露，但可以刷新</div>
  </div>
  <div class="hint" id="hint">按住签筒左右摇 · 或直接点「摇 签」</div>
  <div class="bar">
    <button id="shakeBtn">摇 签</button>
    <button id="muteBtn">🔊</button>
  </div>
</div>

<script>
"use strict";
/* ========= 赛博求签机 ========= */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cvs.width=W*DPR|0;cvs.height=H*DPR|0;
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize);

/* ---- 音效 ---- */
const A={
  ctx:null,muted:false,
  init(){ if(this.ctx)return; const C=window.AudioContext||window.webkitAudioContext; if(C)this.ctx=new C(); },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  _last:0,
  rattle(){
    if(this.muted||!this.ctx)return;
    const now=performance.now(); if(now-this._last<55)return; this._last=now;
    const c=this.ctx,t=c.currentTime;
    const len=Math.floor(c.sampleRate*0.06);
    const b=c.createBuffer(1,len,c.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(); s.buffer=b;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500+Math.random()*1800; bp.Q.value=0.9;
    const g=c.createGain(); g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    s.connect(bp).connect(g).connect(c.destination); s.start(t); s.stop(t+0.08);
  },
  pop(){
    if(this.muted||!this.ctx)return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(680,t); o.frequency.exponentialRampToValueAtTime(240,t+0.12);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.22);
  },
  ding(){
    if(this.muted||!this.ctx)return;
    const c=this.ctx,t=c.currentTime;
    [659.25,987.77,1318.5].forEach((f,i)=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=c.createGain(); const st=t+i*0.07;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.13,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+1.0);
      o.connect(g).connect(c.destination); o.start(st); o.stop(st+1.05);
    });
  }
};

/* ---- 签文素材 ---- */
const L1=["云在青天水在瓶","门前流水尚能西","一根枯木待春风","灯下无人影自斜","山高路远坑又深","昨夜东风吹又回","世事如棋局局新","月落乌啼霜满天","三十年来寻剑客","春江水暖鸭先知","半生浮沉一场梦","菩提本无树"];
const L2=["一片冰心在玉壶","十年踪迹十年心","不知何处吹芦管","此情可待成追忆","无可奈何花落去","柳暗花明又一村","莫愁前路无知己","曾经沧海难为水","一蓑烟雨任平生","也无风雨也无晴"];
const L3=["手机震动又放下","老板叫你去开会","工资到账已还贷","地铁到站人未醒","外卖超时二十分","群里艾特又撤回","闹钟响了第五次","体检报告还没看","凌晨一点还在刷","工位空调正对头"];
const L4=["放下手机捡起来","这事还得慢慢来","该来的总会来的","毕竟来都来了","今晚早点睡吧","答案在风里","相信过程（不太信）","一切都会好起来的","你已经做得很好了","明天再说也行"];

const JIE=[
  "此签主「等」。你最近惦记的那件事，不是不来，是在路上堵车。不必强求，也不必不强求。",
  "签意：天机只可意会，不可退款。眼下宜按兵不动，因为动了也没用。",
  "解曰：你担心的那件事，有 60% 的概率不会发生。剩下 40%，发生的时候你正好在忙别的。",
  "此签平平，主「还行」。没有大吉，也没有大凶，就是很普通的一天，但这已经很难得了。",
  "签示：你最近想做的事，缺的不是机会，是起床。先从「起床」开始，其余自会显现。",
  "解曰：所求之事，宜缓不宜急。急也没有用，这签早给你算好了。",
  "此签主「反转」。你以为的坏事，最后会变成别的事。至于是好事还是别的事，签上没写。"
];
const YI=["摸鱼","点外卖","早睡","喝奶茶","发呆","装忙","撤回消息","什么都不做","走一步算一步","相信直觉","给自己放个假","少看手机"];
const JI=["开会","早起","说真话","梭哈","内耗","复盘","追问意义","熬夜","较真","立 flag","硬撑","跟老板讲道理"];

const LEVELS=[
  {t:"上上签",c:"#c8963c",w:0.12,seal:"大吉"},
  {t:"上签",  c:"#b0463c",w:0.26,seal:"上吉"},
  {t:"中签",  c:"#3f6f9f",w:0.40,seal:"平"},
  {t:"下签",  c:"#6b6b6b",w:0.16,seal:"小凶"},
  {t:"下下签",c:"#3a3a3a",w:0.06,seal:"凶"}
];
const pick=a=>a[(Math.random()*a.length)|0];
function rollLevel(){
  let r=Math.random(), acc=0;
  for(const l of LEVELS){ acc+=l.w; if(r<=acc) return l; }
  return LEVELS[2];
}

/* ---- 签筒几何 ---- */
const tube={ x:0, y:0, w:118, h:210, rot:0, energy:0, shakeT:0 };
const sticks=[];
function buildSticks(){
  sticks.length=0;
  const n=13;
  for(let i=0;i<n;i++){
    sticks.push({
      ox:(i-(n-1)/2)*(tube.w*0.055),
      len: 96 + Math.random()*30,
      tilt:(Math.random()-0.5)*0.12,
      y:0, out:0, chosen:false
    });
  }
}
function layout(){
  tube.x=W/2; tube.y=H*0.60;
  buildSticks();
}

/* ---- 状态 ---- */
let drawing=false, revealed=false, resTimer=0;
const pointer={x:0,y:0,down:false,lastX:0};

/* ---- 摇签 ---- */
function addEnergy(v){
  if(drawing) return;
  tube.energy += v;
  tube.shakeT += v;
  if(tube.shakeT > 0.12){ A.rattle(); tube.shakeT=0; }
  if(tube.energy > 1.0) draw();
}
function shakeAnim(){
  if(drawing) return;
  drawing = true; // 借用，防止重复
  const start=performance.now(), dur=1500;
  (function step(){
    if(!drawing) return;
    const k=Math.min(1,(performance.now()-start)/dur);
    tube.energy = 0.2 + k*0.9;
    tube.shakeT += 0.06;
    if(tube.shakeT > 0.12){ A.rattle(); tube.shakeT=0; }
    if(k<1) requestAnimationFrame(step);
    else { drawing=false; draw(); }
  })();
}
function draw(){
  if(drawing===true && tube.energy<1) return;
  drawing=true;
  const lv=rollLevel();
  const chosen=sticks[(Math.random()*sticks.length)|0];
  chosen.chosen=true;
  const t0=performance.now();
  (function rise(){
    const k=Math.min(1,(performance.now()-t0)/700);
    chosen.out = k;
    if(k<1) requestAnimationFrame(rise);
    else { A.pop(); setTimeout(()=>{ A.ding(); showCard(lv); drawing=false; }, 260); }
  })();
}

/* ---- 卡片 ---- */
function showCard(lv){
  const poem=[pick(L1),pick(L2),pick(L3),pick(L4)];
  const no = 1 + (Math.random()*99|0);
  const yi = [pick(YI), pick(YI)].filter((v,i,a)=>a.indexOf(v)===i);
  const ji = [pick(JI), pick(JI)].filter((v,i,a)=>a.indexOf(v)===i);
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="no">第 ${no} 签</div>
    <div class="lvl" style="color:${lv.c}">${lv.t}</div>
    <div class="poem">${poem.join('<br>')}</div>
    <div class="jie">${pick(JIE)}</div>
    <div class="yiji">
      <div class="row"><span class="tag y">宜</span><span>${yi.join('、')}</span></div>
      <div class="row"><span class="tag j">忌</span><span>${ji.join('、')}</span></div>
    </div>
    <div class="act">
      <button data-a="again">再摇一签</button>
      <button data-a="close">收下</button>
    </div>
    <div class="seal">${lv.seal}<br>之印</div>`;
  document.getElementById('ui').appendChild(card);
  requestAnimationFrame(()=>card.classList.add('show'));
  card.querySelector('[data-a="close"]').addEventListener('click', ()=>{
    card.classList.remove('show'); setTimeout(()=>card.remove(), 320); reset();
  });
  card.querySelector('[data-a="again"]').addEventListener('click', ()=>{
    card.classList.remove('show'); setTimeout(()=>{ card.remove(); reset(); shakeAnim(); }, 280);
  });
}
function reset(){
  for(const s of sticks){ s.out=0; s.chosen=false; }
  tube.energy=0; revealed=false; $('shakeBtn').disabled=false;
}

/* ---- 绘制 ---- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawSticks(){
  // 筒内的签
  for(const s of sticks){
    if(s.chosen){
      // 已被抽出的那根单独在后面画
      continue;
    }
    const wob = Math.sin(performance.now()/90 + s.ox)*tube.energy*7;
    ctx.save();
    ctx.translate(tube.x + s.ox + wob, tube.y - tube.h*0.42);
    ctx.rotate(s.tilt + tube.rot*0.5);
    ctx.fillStyle='#d9c9a6'; rr(-5, -s.len, 10, s.len, 4); ctx.fill();
    ctx.fillStyle='#b0342a'; rr(-5, -s.len, 10, 12, 4); ctx.fill();
    ctx.restore();
  }
  // 抽出的那根
  for(const s of sticks){
    if(!s.chosen) continue;
    const rise = s.out * 240;
    const wob = Math.sin(performance.now()/70)*tube.energy*6;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;
    ctx.translate(tube.x + s.ox*0.4 + wob, tube.y - tube.h*0.42 - rise);
    ctx.rotate(s.tilt*0.4);
    ctx.fillStyle='#f0e6cf'; rr(-8, -s.len*1.15, 16, s.len*1.15, 5); ctx.fill();
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.fillStyle='#b0342a'; rr(-8, -s.len*1.15, 16, 18, 5); ctx.fill();
    ctx.fillStyle='#8a7f6c'; ctx.font='700 9px ui-monospace,Consolas,monospace'; ctx.textAlign='center';
    ctx.save(); ctx.translate(0, -s.len*0.5); ctx.rotate(Math.PI/2); ctx.fillText('签', 0, 3); ctx.restore();
    ctx.restore();
  }
}
function drawTube(){
  const sw = Math.sin(performance.now()/70)*(tube.energy*0.06);
  tube.rot = sw;
  ctx.save();
  ctx.translate(tube.x, tube.y + tube.h*0.42);
  ctx.rotate(sw);
  ctx.translate(-tube.x, -(tube.y + tube.h*0.42));

  // 影子
  ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(tube.x, tube.y+tube.h*0.46, tube.w*0.62, 16, 0,0,7); ctx.fill(); ctx.restore();

  // 筒身
  const top=tube.y - tube.h*0.42, h=tube.h;
  const g=ctx.createLinearGradient(tube.x-tube.w/2,0,tube.x+tube.w/2,0);
  g.addColorStop(0,'#5c3a1e'); g.addColorStop(0.35,'#a86a34'); g.addColorStop(0.6,'#c98a4a'); g.addColorStop(1,'#6b431f');
  rr(tube.x-tube.w/2, top, tube.w, h, 16);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(40,20,6,.7)'; ctx.lineWidth=2.5; ctx.stroke();
  // 上下口
  ctx.beginPath(); ctx.ellipse(tube.x, top, tube.w/2, 13, 0,0,7);
  ctx.fillStyle='#3a2410'; ctx.fill(); ctx.strokeStyle='rgba(20,10,2,.8)'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(tube.x, top+h, tube.w/2, 13, 0,0,7);
  ctx.fillStyle='#4a2e14'; ctx.fill();
  // 装饰带
  ctx.fillStyle='rgba(176,52,42,.85)';
  ctx.fillRect(tube.x-tube.w/2, top+h*0.42, tube.w, 12);
  ctx.fillStyle='rgba(232,185,106,.9)';
  ctx.font='700 12px "Songti SC","SimSun",serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('签', tube.x, top+h*0.42+6);
  ctx.restore();

  // 高光
  ctx.save(); ctx.globalAlpha=.18; ctx.fillStyle='#fff';
  rr(tube.x-tube.w/2+12, top+18, 12, h-60, 6); ctx.fill(); ctx.restore();
}

function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  tube.energy = Math.max(0, tube.energy - 0.012);
  drawSticks();
  drawTube();
}
resize(); layout(); requestAnimationFrame(loop);

/* ---- 交互 ---- */
cvs.addEventListener('pointerdown', e=>{
  A.init(); A.resume();
  pointer.down=true; pointer.lastX=e.clientX;
  $('hint').classList.add('hide');
});
cvs.addEventListener('pointermove', e=>{
  if(!pointer.down) return;
  const dx=e.clientX-pointer.lastX;
  pointer.lastX=e.clientX;
  addEnergy(Math.abs(dx)*0.012);
});
addEventListener('pointerup', ()=>{ pointer.down=false; });
cvs.addEventListener('pointerdown', ()=>{ $('hint').classList.add('hide'); });

$('shakeBtn').addEventListener('click', ()=>{
  A.init(); A.resume();
  $('hint').classList.add('hide');
  shakeAnim();
});
$('muteBtn').addEventListener('click', ()=>{ A.init(); A.muted=!A.muted; $('muteBtn').textContent=A.muted?'🔇':'🔊'; });
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); A.init(); A.resume(); shakeAnim(); } });
setTimeout(()=>$('hint').classList.add('hide'), 10000);
</script>
</body>
</html>
