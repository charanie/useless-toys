<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>抽象接住 · CATCH IT</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0;background:#08080b}
  body{
    background-image:radial-gradient(900px 700px at 50% 10%, #101e18 0%, #08080b 68%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#e8f4ee;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:16px 14px 22px;gap:12px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }

  header{width:min(560px,94vw);display:flex;align-items:flex-end;gap:12px}
  .brand{flex:1;min-width:0}
  .brand .t{font-size:11px;letter-spacing:.4em;color:#6f8c7e}
  .brand h1{margin:4px 0 0;font-size:21px;letter-spacing:.14em;color:#4fe0a8;font-weight:800}
  .brand .s{margin-top:5px;font-size:11.5px;color:#84a294}
  .stats{display:flex;gap:7px}
  .stat{background:rgba(18,32,26,.84);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:6px 13px;text-align:center;min-width:60px}
  .stat .k{font-size:9.5px;letter-spacing:.22em;color:#6f8c7e}
  .stat .v{font:800 18px/1.3 ui-monospace,Consolas,monospace;color:#ffd36e;font-variant-numeric:tabular-nums}
  .stat.cb .v{color:#4fe0a8}
  .stat.hp .v{color:#ff7a6b;letter-spacing:2px;font-size:15px}
  .stat.best .v{color:#6ec8ff;font-size:15px}

  .wrap{position:relative;border-radius:16px;padding:8px;
    background:linear-gradient(160deg,#12211b,#080f0c);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 66px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.05);
    touch-action:none;line-height:0}
  canvas{display:block;border-radius:10px;background:#0a120e;touch-action:none;cursor:none}

  .bar{width:min(560px,94vw);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-size:12.5px;color:#e8f4ee;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:9px 16px;letter-spacing:.08em;transition:.15s}
  button.b:hover{background:rgba(79,224,168,.15);border-color:rgba(79,224,168,.5);color:#c8ffe6}
  button.b.primary{background:linear-gradient(120deg,rgba(79,224,168,.3),rgba(110,200,255,.2));border-color:rgba(79,224,168,.55)}
  .hint{flex:1;text-align:right;font-size:11px;color:#5f7a6e;letter-spacing:.06em;line-height:1.6}
  footer{font-size:11px;color:#4e6a5e;letter-spacing:.14em;text-align:center;line-height:1.9}
  footer b{color:#ff7a6b}

  .over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(5,8,7,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .over.show{display:flex}
  .box{width:min(400px,92vw);text-align:center;padding:30px 26px 24px;border-radius:22px;
    background:linear-gradient(180deg,rgba(18,32,26,.98),rgba(10,17,14,.98));
    border:1px solid rgba(79,224,168,.24);box-shadow:0 30px 80px rgba(0,0,0,.72)}
  .box .em{font-size:38px;line-height:1}
  .box h2{margin:13px 0 6px;font-size:20px;letter-spacing:.14em;color:#4fe0a8}
  .box p{margin:0 0 18px;font-size:12.5px;line-height:1.95;color:#8fa89e}
  .box p b{color:#ffd36e}
  .box .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="t">CATCH IT · ENDLESS</div>
    <h1>抽象接住</h1>
    <div class="s">接外卖接工资，别接需求</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div>
    <div class="stat cb"><div class="k">连击</div><div class="v" id="combo">0</div></div>
    <div class="stat hp"><div class="k">体力</div><div class="v" id="hp">♥♥♥</div></div>
    <div class="stat best"><div class="k">最佳</div><div class="v" id="best">0</div></div>
  </div>
</header>

<div class="wrap"><canvas id="c"></canvas></div>

<div class="bar">
  <button class="b primary" id="start">开始 (空格)</button>
  <span class="hint">鼠标 / 手指拖动 · ← → 键也行</span>
</div>

<footer><b>红色那几样别接</b> —— 需求、加塞、领导、加班，接到掉一条命</footer>

<div class="over" id="over">
  <div class="box">
    <div class="em" id="oEmoji">🧺</div>
    <h2 id="oTitle">接不动了</h2>
    <p id="oText"></p>
    <div class="row"><button class="b primary" id="oAgain">再来一局</button></div>
  </div>
</div>

<script>
"use strict";
/* ========= 抽象接住 ========= */
const $ = id => document.getElementById(id);
const W = 560, H = 640;

const GOOD = [
  { e:'🍜', n:'外卖', v:10 },
  { e:'☕', n:'续命', v:10 },
  { e:'💰', n:'工资', v:30 },
  { e:'🎁', n:'奖金', v:50 }
];
const BAD = [
  { e:'📋', n:'需求' }, { e:'⚡', n:'加塞' },
  { e:'👔', n:'领导' }, { e:'🔥', n:'加班' }
];

const cvs = $('c'), ctx = cvs.getContext('2d');
let items = [], fx = [];
let score = 0, combo = 0, maxCombo = 0, hp = 3, best = 0;
let playing = false, over = true, paused = false;
let basket = { x: W/2, w: 116, h: 26 };
let targetX = W/2, keys = { l:false, r:false };
let spawnT = 0, fallT = 0, last = 0, shake = 0, caught = 0, escaped = 0;
let scale = 1;

/* ---------- 音效 ---------- */
let actx = null, noiseBuf = null;
function A(){
  if(!actx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, gain, type, bend){
  const c = A(); if(!c) return;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
  if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40, f*bend), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.04);
}
function sfxCatch(n){
  const c = A(); if(!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(420 + Math.min(6,n)*70, t);
  o.frequency.exponentialRampToValueAtTime(700 + Math.min(6,n)*90, t+0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.055, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.18);
}
function sfxBad(){
  const c = A(); if(!c) return;
  [0,.08,.17].forEach((d,i)=>{
    const t = c.currentTime + d, o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(200*Math.pow(.8,i), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.2);
  });
}
function sfxMiss(){ tone(200, 0.07, 0.022, 'sine', 0.8); }

/* ---------- 尺寸 ---------- */
function resize(){
  const availW = Math.min(window.innerWidth - 46, 560);
  const availH = window.innerHeight*0.60;
  const k = Math.min(availW/W, availH/H, 1);
  const w = Math.round(W*k), h = Math.round(H*k);
  scale = w/W;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = w*dpr; cvs.height = h*dpr;
  cvs.style.width = w+'px'; cvs.style.height = h+'px';
  ctx.setTransform(dpr*k, 0, 0, dpr*k, 0, 0);
  draw();
}

/* ---------- 一局 ---------- */
function reset(){
  items = []; fx = [];
  score = 0; combo = 0; maxCombo = 0; hp = 3;
  playing = false; over = true; paused = false;
  spawnT = 0; fallT = 0; shake = 0; caught = 0; escaped = 0;
  basket.x = W/2; targetX = W/2;
  $('over').classList.remove('show');
  updateHUD(); draw();
}
function begin(){ reset(); playing = true; over = false; A(); }
function updateHUD(){
  $('score').textContent = score;
  $('combo').textContent = combo;
  $('hp').textContent = hp > 0 ? '♥'.repeat(hp) : '—';
  if(score > best){ best = score; try{ localStorage.setItem('ut_catch_best', String(best)); }catch(e){} }
  $('best').textContent = best;
}
function spawn(){
  const t = Math.min(1, score/900);
  const badChance = 0.26 + t*0.16;
  const isBad = Math.random() < badChance;
  const kind = isBad ? BAD[(Math.random()*BAD.length)|0] : GOOD[(Math.random()*GOOD.length)|0];
  const r = 25;
  items.push({
    x: r + 12 + Math.random()*(W - 2*r - 24),
    y: -r, vy: (170 + t*230) * (0.85 + Math.random()*0.35),
    vx: (Math.random()-0.5) * 40 * t,
    r, bad: isBad, e: kind.e, n: kind.n, v: kind.v || 0, rot: 0
  });
}
function update(dt){
  if(!playing || paused) return;
  const t = Math.min(1, score/900);
  // 筐
  if(keys.l) targetX -= 620*dt;
  if(keys.r) targetX += 620*dt;
  targetX = Math.max(basket.w/2 + 6, Math.min(W - basket.w/2 - 6, targetX));
  basket.x += (targetX - basket.x) * Math.min(1, dt*16);

  // 生成
  spawnT += dt;
  const every = Math.max(0.30, 0.86 - t*0.5);
  if(spawnT >= every){ spawnT = 0; spawn(); }

  const by = H - 74;
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.y += it.vy*dt; it.x += it.vx*dt; it.rot += dt*2;
    if(it.x < it.r+6){ it.x = it.r+6; it.vx = Math.abs(it.vx); }
    if(it.x > W-it.r-6){ it.x = W-it.r-6; it.vx = -Math.abs(it.vx); }

    // 进筐
    if(it.y + it.r > by && it.y - it.r < by + basket.h &&
       it.x > basket.x - basket.w/2 - it.r*0.5 && it.x < basket.x + basket.w/2 + it.r*0.5){
      items.splice(i,1);
      if(it.bad){
        hp--; combo = 0; shake = 1;
        fx.push({ x: it.x, y: by, text: it.n + ' −1♥', color:'#ff7a6b', life:1 });
        sfxBad();
        if(hp <= 0){ finish(); return; }
      } else {
        combo++; caught++;
        if(combo > maxCombo) maxCombo = combo;
        const mult = 1 + Math.min(1, combo/20);
        const gain = Math.round(it.v * mult);
        score += gain;
        fx.push({ x: it.x, y: by, text: '+' + gain, color:'#8ef0c8', life:1 });
        sfxCatch(combo);
      }
      updateHUD();
      continue;
    }
    // 落地
    if(it.y - it.r > H){
      items.splice(i,1);
      if(!it.bad){ combo = 0; escaped++; sfxMiss(); updateHUD(); }
    }
  }
  for(let i=fx.length-1;i>=0;i--){
    const f = fx[i]; f.life -= dt*1.3; f.y -= dt*44;
    if(f.life <= 0) fx.splice(i,1);
  }
  shake = Math.max(0, shake - dt*3);
}
function finish(){
  playing = false; over = true;
  updateHUD();
  const acc = caught + escaped ? Math.round(caught/(caught+escaped)*100) : 0;
  const chop = score >= 1500 ? '你接到了本月最好的东西。'
             : score >= 700  ? '还行，手挺稳。'
             : score >= 250  ? '外卖接到了，工资没接到。'
             : '今天什么都没接住。';
  setTimeout(()=>{
    $('oEmoji').textContent = score >= 700 ? '🧺' : '😵';
    $('oTitle').textContent = '接不动了';
    $('oText').innerHTML = `${chop}<br>接住 <b>${caught}</b> 个 · 漏掉 <b>${escaped}</b> 个 · 接中率 <b>${acc}%</b>` +
      (maxCombo ? ` · 最高连击 <b>${maxCombo}</b>` : '') + `<br>本局 <b>${score}</b> · 最佳 <b>${best}</b>`;
    $('over').classList.add('show');
  }, 320);
}

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(){
  const sx = shake > 0 ? (Math.random()-0.5)*10*shake : 0;
  ctx.save(); ctx.translate(sx, 0);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b1512'); bg.addColorStop(1,'#070d0a');
  ctx.fillStyle = bg; ctx.fillRect(-20,0,W+40,H);

  // 背景格子
  ctx.strokeStyle = 'rgba(79,224,168,.045)'; ctx.lineWidth = 1;
  for(let x=0;x<=W;x+=56){ ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=56){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke(); }

  // 危险线
  ctx.strokeStyle = 'rgba(255,122,107,.22)'; ctx.lineWidth = 2; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(0, H-74); ctx.lineTo(W, H-74); ctx.stroke();
  ctx.setLineDash([]);

  // 掉落物
  for(const it of items){
    const col = it.bad ? '#ff7a6b' : '#4fe0a8';
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = 16;
    ctx.fillStyle = it.bad ? 'rgba(255,122,107,.16)' : 'rgba(79,224,168,.16)';
    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, 7); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, 7); ctx.stroke();
    ctx.restore();
    ctx.font = `${it.r*1.25}px "PingFang SC","Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.e, it.x, it.y+1);
    ctx.fillStyle = col;
    ctx.font = '700 10px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(it.n, it.x, it.y + it.r + 11);
  }

  // 筐
  const by = H - 74, bx = basket.x, bw = basket.w, bh = basket.h;
  ctx.save();
  ctx.shadowColor = 'rgba(79,224,168,.8)'; ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(0, by, 0, by+bh);
  g.addColorStop(0,'#7fe3bd'); g.addColorStop(1,'#2a8f68');
  ctx.fillStyle = g;
  rr(bx-bw/2, by, bw, bh, 7); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(220,255,240,.55)'; ctx.lineWidth = 2;
  rr(bx-bw/2+1, by+1, bw-2, bh-2, 7); ctx.stroke();
  // 筐纹
  ctx.strokeStyle = 'rgba(6,32,22,.36)'; ctx.lineWidth = 2;
  for(let i=1;i<5;i++){
    const px = bx - bw/2 + bw*i/5;
    ctx.beginPath(); ctx.moveTo(px, by+4); ctx.lineTo(px, by+bh-4); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('工 位', bx, by + bh/2);

  // 飘字
  for(const f of fx){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = '800 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // 连击
  if(combo >= 5 && playing){
    ctx.globalAlpha = .3;
    ctx.fillStyle = '#ffd36e';
    ctx.font = `800 ${Math.min(58, 26+combo*0.6)}px ui-monospace,Consolas,monospace`;
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(combo, W-26, 74);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if(!playing && !over){
    ctx.fillStyle = 'rgba(7,13,10,.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#4fe0a8';
    ctx.font = '800 24px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('按「开始」接外卖', W/2, H*0.45);
  }
  if(paused){
    ctx.fillStyle = 'rgba(7,13,10,.72)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#4fe0a8';
    ctx.font = '800 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('已暂停', W/2, H*0.45);
  }
}

/* ---------- 主循环与交互 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016); last = ts;
  update(dt); draw();
}
function aim(clientX){
  const r = cvs.getBoundingClientRect();
  targetX = (clientX - r.left)/r.width * W;
}
cvs.addEventListener('pointerdown', e=>{ A(); if(over) return; aim(e.clientX); cvs.setPointerCapture?.(e.pointerId); });
cvs.addEventListener('pointermove', e=>{ if(e.pointerType === 'mouse' || e.buttons) aim(e.clientX); });
addEventListener('keydown', e=>{
  if(e.key === ' '){ e.preventDefault();
    if(over) begin(); else paused = !paused; return; }
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ keys.l = true; e.preventDefault(); }
  if(e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D'){ keys.r = true; e.preventDefault(); }
});
addEventListener('keyup', e=>{
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
  if(e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.r = false;
});
$('start').addEventListener('click', begin);
$('oAgain').addEventListener('click', begin);
addEventListener('resize', resize);

(function boot(){
  try{ best = parseInt(localStorage.getItem('ut_catch_best')||'0',10) || 0; }catch(e){ best = 0; }
  resize(); reset();
  requestAnimationFrame(loop);
})();

window.__catch = {
  get state(){ return { playing, over, score, combo, maxCombo, hp, caught, escaped, items: items.length, basketX: basket.x }; },
  begin, reset, spawn,
  setBasket(x){ targetX = x; basket.x = x; },
  push(o){ items.push(Object.assign({ x: W/2, y: 0, vy: 200, vx: 0, r: 25, bad:false, e:'🍜', n:'外卖', v:10, rot:0 }, o)); }
};
</script>
</body>
</html>
